<script>
/* ---- assets/js/games/memory-match.js ---- */
/* Memory Match — find the pairs; fewer flips is better. */
(function () {
  'use strict';
  var ICONS = ['🍕', '🚀', '🐙', '🌵', '🎧', '🦊', '⚡', '🍩', '🎲', '🌙', '🐝', '🔮',
    '🍉', '🎈', '🐳', '🧊', '🌻', '🪐'];

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;
    var cards = [];

    function layoutFor(level) {
      // 3x4, 4x4, 4x5, 4x6, 5x6 …
      var layouts = [[4, 3], [4, 4], [5, 4], [6, 4], [6, 5], [7, 4], [8, 4]];
      return layouts[Math.min(layouts.length - 1, level - 1)];
    }

    function reset(g) {
      var d = g.data;
      d.level = d.level || 1;
      var lay = layoutFor(d.level);
      d.cols = lay[0]; d.rows = lay[1];
      var pairs = (d.cols * d.rows) / 2;
      var picked = U.shuffle(ICONS.slice()).slice(0, pairs);
      d.deck = U.shuffle(picked.concat(picked));
      d.flipped = [];
      d.found = [];
      d.moves = 0;
      d.time = 0;
      d.busy = false;
      d.done = false;
      build(g);
      g.set('Level', d.level);
      g.set('Moves', 0);
      g.set('Pairs', '0/' + pairs);
    }

    function build(g) {
      var d = g.data;
      var wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:12px';
      var grid = document.createElement('div');
      grid.style.cssText = 'display:grid;gap:8px;' +
        'grid-template-columns:repeat(' + d.cols + ',1fr);' +
        'width:min(94vw,' + (d.cols * 84) + 'px)';
      cards = [];
      for (var i = 0; i < d.deck.length; i++) {
        var b = document.createElement('button');
        b.type = 'button';
        b.dataset.i = i;
        b.style.cssText = 'aspect-ratio:3/4;border:0;border-radius:10px;cursor:pointer;padding:0;' +
          'font-size:clamp(18px,4.6vw,34px);display:grid;place-items:center;' +
          'background:linear-gradient(140deg,#7c5cff,#4d8cff);color:transparent;' +
          'transition:background .2s,transform .16s,color .12s';
        grid.appendChild(b);
        cards.push(b);
      }
      grid.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (b) flip(g, +b.dataset.i);
      });
      var hint = document.createElement('div');
      hint.style.cssText = 'color:#a8b0d8;font-size:.86rem';
      hint.textContent = 'Turn over two cards. Match them and they stay.';
      wrap.appendChild(grid);
      wrap.appendChild(hint);
      g.root.innerHTML = '';
      g.root.appendChild(wrap);
      paint(g);
    }

    function paint(g) {
      var d = g.data;
      d.deck.forEach(function (icon, i) {
        var b = cards[i];
        var open = d.flipped.indexOf(i) !== -1 || d.found.indexOf(i) !== -1;
        var matched = d.found.indexOf(i) !== -1;
        b.textContent = icon;
        b.style.color = open ? '#fff' : 'transparent';
        b.style.background = matched ? 'linear-gradient(140deg,#34d399,#22d3ee)'
          : open ? '#232a58' : 'linear-gradient(140deg,#7c5cff,#4d8cff)';
        b.style.transform = open ? 'rotateY(0deg) scale(1)' : 'scale(1)';
        b.style.opacity = matched ? '.72' : '1';
        b.style.cursor = open ? 'default' : 'pointer';
      });
    }

    function flip(g, i) {
      var d = g.data;
      if (g.state !== 'play' || d.busy || d.done) return;
      if (d.flipped.indexOf(i) !== -1 || d.found.indexOf(i) !== -1) return;
      if (d.flipped.length >= 2) return;

      d.flipped.push(i);
      Milo.sound.blip();
      paint(g);

      if (d.flipped.length < 2) return;

      d.moves++;
      g.set('Moves', d.moves);
      var a = d.flipped[0], b = d.flipped[1];

      if (d.deck[a] === d.deck[b]) {
        d.found.push(a, b);
        d.flipped = [];
        Milo.sound.coin();
        paint(g);
        g.set('Pairs', (d.found.length / 2) + '/' + (d.deck.length / 2));
        if (d.found.length === d.deck.length) win(g);
      } else {
        d.busy = true;
        Milo.sound.tone({ f: 200, d: .1, v: .06, type: 'square' });
        setTimeout(function () {
          d.flipped = [];
          d.busy = false;
          paint(g);
        }, 700);
      }
    }

    function win(g) {
      var d = g.data;
      d.done = true;
      var perfect = d.deck.length / 2;
      var earned = Math.max(60, (600 - (d.moves - perfect) * 18 - Math.round(d.time) * 3)) * d.level;
      g.score += earned;
      Milo.sound.win();
      d.level++;
      g.overlay({
        emo: '🃏',
        title: 'All pairs found!',
        text: d.moves + ' flips in ' + U.time(d.time) + ' — worth ' + U.fmt(earned) + ' points.',
        score: g.score,
        best: g.best,
        newBest: Milo.store.setBest('memory-match', g.score),
        actions: [
          { label: 'Bigger board →', primary: true, onClick: function () { next(g); } },
          { label: 'Start over', onClick: function () { g.data.level = 1; g.restart(); } }
        ]
      });
    }

    function next(g) {
      g.clearOverlay();
      var keepScore = g.score, keepLevel = g.data.level;
      reset(g);
      g.data.level = keepLevel;
      g.score = keepScore;
      g.state = 'play';
      g.set('Level', keepLevel);
      g.best = Milo.store.best('memory-match');
    }

    return Milo.domGame(host, {
      id: 'memory-match',
      stats: ['Level', 'Moves', 'Pairs'],
      bg: '#111536',
      emo: '🃏',
      start: {
        title: 'Memory Match',
        text: 'Turn over two cards at a time and remember what you saw. Match every ' +
          'pair to move up to a bigger board.',
        keys: ['Click a card']
      },
      preload: function (g) { g.data.level = 1; },
      init: reset,
      update: function (g, dt) {
        var d = g.data;
        if (!d.done) d.time += dt;
      }
    });
  }

  window.Milo.register({
    id: 'memory-match', title: 'Memory Match', emo: '🃏', category: 'Casual',
    tagline: 'Find every pair from memory',
    description: 'Cards start face down. Turn two over — if they match they stay up, ' +
      'otherwise they flip back and you have to remember where they were. Clear the ' +
      'board and the next level deals a bigger one. Fewer flips and less time score higher.',
    controls: ['Click a card'],
    colors: ['#7c5cff', '#34d399'],
    tags: ['memory', 'cards', 'relaxing', 'levels'],
    mount: mount
  });
})();

</script>
<script>
/* ---- assets/js/games/whack-a-mole.js ---- */
/* Whack-a-Mole — 45 seconds, and some of them bite back. */
(function () {
  'use strict';
  var W = 700, H = 540;
  var COLS = 4, ROWS = 3, DURATION = 45;

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function holeAt(i) {
      var x = i % COLS, y = (i / COLS) | 0;
      return {
        x: 110 + x * ((W - 220) / (COLS - 1)),
        y: 150 + y * ((H - 230) / (ROWS - 1))
      };
    }

    function reset(g) {
      var d = g.data;
      d.holes = [];
      for (var i = 0; i < COLS * ROWS; i++) {
        d.holes.push({ up: 0, kind: 'mole', timer: U.rand(.4, 2.4), hit: false, bonk: 0 });
      }
      d.time = DURATION;
      d.hits = 0;
      d.misses = 0;
      d.combo = 0;
      d.parts = [];
      d.pop = 1.9;
      g.set('Score', 0);
      g.set('Time', DURATION);
      g.set('Combo', 0);
    }

    return Milo.arcade(host, {
      id: 'whack-a-mole',
      w: W, h: H, bg: '#2a1f12',
      stats: ['Score', 'Time', 'Combo'],
      emo: '🔨',
      start: {
        title: 'Whack-a-Mole',
        text: 'Forty-five seconds. Hit the brown moles, leave the spiky green ones ' +
          'alone — they cost you points and reset your combo.',
        keys: ['Click or tap a mole']
      },
      init: reset,

      onPointer: function (g, type, x, y) {
        if (type !== 'down' || g.state !== 'play') return;
        var d = g.data, got = false;
        d.holes.forEach(function (h, i) {
          if (h.up < .35 || h.hit) return;
          var p = holeAt(i);
          if (U.dist(x, y, p.x, p.y - 18 * h.up) < 46) {
            got = true;
            h.hit = true;
            h.bonk = .25;
            if (h.kind === 'mole') {
              d.hits++;
              d.combo++;
              var pts = 10 + Math.min(40, d.combo * 2);
              g.score += pts;
              Milo.sound.coin();
              burst(d, p.x, p.y - 20, '#ffd257');
            } else {
              d.combo = 0;
              g.score = Math.max(0, g.score - 25);
              Milo.sound.hit();
              burst(d, p.x, p.y - 20, '#fb7185');
            }
            g.set('Score', U.fmt(g.score));
            g.set('Combo', d.combo);
          }
        });
        if (!got) {
          d.combo = 0;
          d.misses++;
          g.set('Combo', 0);
          Milo.sound.click();
        }
      },

      update: function (g, dt) {
        var d = g.data;
        d.time -= dt;
        g.set('Time', Math.max(0, Math.ceil(d.time)));
        if (d.time <= 0) {
          g.gameOver({
            emo: '⏰', title: 'Time!',
            text: d.hits + ' moles bopped, ' + d.misses + ' swings missed.'
          });
          return;
        }

        // Moles come faster as the round goes on.
        d.pop = 1.9 - (1 - d.time / DURATION) * 1.15;

        d.holes.forEach(function (h) {
          h.timer -= dt;
          h.bonk = Math.max(0, h.bonk - dt);
          if (h.timer <= 0) {
            if (h.up > 0) {
              h.up = Math.max(0, h.up - dt * 4);
              if (h.up <= 0) { h.timer = U.rand(.25, d.pop); h.hit = false; }
            } else {
              h.kind = Math.random() < .24 ? 'spike' : 'mole';
              h.up = 0.001;
              h.timer = U.rand(.55, 1.15);
              h.rising = true;
            }
          } else if (h.rising) {
            h.up = Math.min(1, h.up + dt * 5);
            if (h.up >= 1) h.rising = false;
          } else if (h.hit) {
            h.up = Math.max(0, h.up - dt * 6);
          }
        });

        d.parts = d.parts.filter(function (p) {
          p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 700 * dt; p.life -= dt;
          return p.life > 0;
        });
      },

      draw: function (g) {
        var c = g.ctx, d = g.data;
        var sky = c.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#4a7c34'); sky.addColorStop(1, '#2f5220');
        c.fillStyle = sky; c.fillRect(0, 0, W, H);

        // grass tufts
        c.strokeStyle = 'rgba(255,255,255,.06)'; c.lineWidth = 2;
        c.beginPath();
        for (var i = 0; i < 60; i++) {
          var gx = U.hash2(i, 1, 7) * W, gy = U.hash2(i, 2, 7) * H;
          c.moveTo(gx, gy); c.lineTo(gx + 3, gy - 8);
        }
        c.stroke();

        d.holes.forEach(function (h, i) {
          var p = holeAt(i);
          c.fillStyle = '#241a10';
          c.beginPath(); c.ellipse(p.x, p.y, 50, 20, 0, 0, 7); c.fill();
          c.fillStyle = '#12100c';
          c.beginPath(); c.ellipse(p.x, p.y - 2, 44, 16, 0, 0, 7); c.fill();

          if (h.up <= 0) return;
          var rise = h.up * 46;
          var squash = h.bonk > 0 ? 1 - h.bonk : 1;
          c.save();
          c.beginPath();
          c.rect(p.x - 46, p.y - 90, 92, 90 - 2);
          c.clip();
          c.translate(p.x, p.y - rise);
          c.scale(1, squash);

          if (h.kind === 'mole') {
            c.fillStyle = '#8b5a3c';
            c.beginPath(); c.ellipse(0, 0, 32, 34, 0, 0, 7); c.fill();
            c.fillStyle = '#c9906c';
            c.beginPath(); c.ellipse(0, 10, 18, 15, 0, 0, 7); c.fill();
            c.fillStyle = '#1a1008';
            c.beginPath(); c.arc(-11, -7, 4, 0, 7); c.arc(11, -7, 4, 0, 7); c.fill();
            c.fillStyle = '#f8b8c8';
            c.beginPath(); c.ellipse(0, 6, 6, 4.5, 0, 0, 7); c.fill();
          } else {
            c.fillStyle = '#3fae5f';
            c.beginPath();
            for (var s = 0; s < 12; s++) {
              var a = s / 12 * 6.283;
              var r = s % 2 ? 24 : 36;
              c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
            }
            c.closePath(); c.fill();
            c.fillStyle = '#0f2b16';
            c.beginPath(); c.arc(-9, -5, 4.5, 0, 7); c.arc(9, -5, 4.5, 0, 7); c.fill();
            c.strokeStyle = '#0f2b16'; c.lineWidth = 2.5; c.lineCap = 'round';
            c.beginPath(); c.arc(0, 12, 8, Math.PI + .3, -.3); c.stroke();
          }
          c.restore();
        });

        d.parts.forEach(function (p) {
          c.globalAlpha = Math.max(0, p.life / p.max);
          c.fillStyle = p.col;
          c.beginPath(); c.arc(p.x, p.y, 4, 0, 7); c.fill();
        });
        c.globalAlpha = 1;

        if (d.time < 11) {
          c.fillStyle = d.time < 6 ? '#fb7185' : '#ffd257';
          c.font = '800 40px Outfit, sans-serif';
          c.textAlign = 'center';
          c.globalAlpha = .3 + Math.abs(Math.sin(g.t * 4)) * .5;
          c.fillText(Math.ceil(d.time), W / 2, 74);
          c.globalAlpha = 1;
        }
      }
    });

    function burst(d, x, y, col) {
      for (var i = 0; i < 14; i++) {
        var a = Math.random() * 6.28, s = U.rand(60, 240);
        d.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: U.rand(.3, .6), max: .6, col: col });
      }
    }
  }

  window.Milo.register({
    id: 'whack-a-mole', title: 'Whack-a-Mole', emo: '🔨', category: 'Casual',
    tagline: 'Bop the moles, dodge the spikes',
    description: 'Forty-five seconds of moles popping out of holes. Every brown mole ' +
      'you hit builds a combo worth more points, but the spiky green ones cost you 25 ' +
      'and reset the combo — as does swinging at nothing. They pop faster as the clock runs down.',
    controls: ['Click', 'Tap'],
    colors: ['#8b5a3c', '#4a7c34'],
    tags: ['reflex', 'timed', 'clicking', 'casual'],
    mount: mount
  });
})();

</script>
<script>
/* ---- assets/js/games/aim-trainer.js ---- */
/* Aim Trainer — 30 seconds of targets, with accuracy and reaction time. */
(function () {
  'use strict';
  var W = 800, H = 560, DURATION = 30;

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function reset(g) {
      var d = g.data;
      d.targets = [];
      d.time = DURATION;
      d.hits = 0;
      d.shots = 0;
      d.streak = 0;
      d.bestStreak = 0;
      d.reactions = [];
      d.parts = [];
      d.rings = [];
      spawn(d);
      g.set('Score', 0);
      g.set('Time', DURATION);
      g.set('Accuracy', '—');
    }

    function spawn(d) {
      var size = Math.max(18, 42 - d.hits * 0.55);
      d.targets = [{
        x: U.rand(size + 30, W - size - 30),
        y: U.rand(size + 70, H - size - 30),
        r: size,
        born: performance.now(),
        life: 0
      }];
    }

    return Milo.arcade(host, {
      id: 'aim-trainer',
      w: W, h: H, bg: '#0a0e24',
      stats: ['Score', 'Time', 'Accuracy'],
      emo: '🎯',
      start: {
        title: 'Aim Trainer',
        text: 'Thirty seconds. Click each target the moment it appears — they get ' +
          'smaller the more you hit. Missing costs you points.',
        keys: ['Click the targets', 'Speed and accuracy both count']
      },
      init: reset,

      onPointer: function (g, type, x, y) {
        if (type !== 'down' || g.state !== 'play') return;
        var d = g.data;
        d.shots++;
        var t = d.targets[0];
        if (t && U.dist(x, y, t.x, t.y) <= t.r) {
          var ms = performance.now() - t.born;
          d.reactions.push(ms);
          d.hits++;
          d.streak++;
          d.bestStreak = Math.max(d.bestStreak, d.streak);
          // Quick clicks on small targets are worth the most.
          var speedBonus = Math.max(0, 60 - Math.floor(ms / 20));
          var sizeBonus = Math.round((44 - t.r) * 2);
          g.score += 20 + speedBonus + Math.max(0, sizeBonus) + Math.min(30, d.streak * 2);
          g.set('Score', U.fmt(g.score));
          Milo.sound.tone({ f: 700 + Math.min(600, d.streak * 30), d: .06, v: .07, type: 'square' });
          d.rings.push({ x: t.x, y: t.y, r: t.r, t: 1 });
          for (var i = 0; i < 14; i++) {
            var a = Math.random() * 6.28, s = U.rand(70, 280);
            d.parts.push({ x: t.x, y: t.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .45, max: .45, col: '#22d3ee' });
          }
          spawn(d);
        } else {
          d.streak = 0;
          g.score = Math.max(0, g.score - 15);
          g.set('Score', U.fmt(g.score));
          Milo.sound.tone({ f: 150, f2: 90, d: .1, v: .06, type: 'sawtooth' });
          d.rings.push({ x: x, y: y, r: 14, t: 1, miss: true });
        }
        var acc = d.shots ? Math.round(d.hits / d.shots * 100) : 0;
        g.set('Accuracy', acc + '%');
      },

      update: function (g, dt) {
        var d = g.data;
        d.time -= dt;
        g.set('Time', Math.max(0, Math.ceil(d.time)));

        d.targets.forEach(function (t) { t.life += dt; });

        d.rings = d.rings.filter(function (r) { r.t -= dt * 2.4; return r.t > 0; });
        d.parts = d.parts.filter(function (p) {
          p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
          return p.life > 0;
        });

        if (d.time <= 0) {
          var acc = d.shots ? Math.round(d.hits / d.shots * 100) : 0;
          var avg = d.reactions.length
            ? Math.round(d.reactions.reduce(function (a, b) { return a + b; }, 0) / d.reactions.length)
            : 0;
          g.gameOver({
            emo: '🎯', title: 'Time!',
            text: d.hits + ' hits · ' + acc + '% accuracy · ' +
              (avg ? avg + 'ms average reaction' : 'no hits') +
              ' · best streak ' + d.bestStreak
          });
        }
      },

      draw: function (g) {
        var c = g.ctx, d = g.data;
        c.fillStyle = '#0a0e24'; c.fillRect(0, 0, W, H);
        c.strokeStyle = 'rgba(124,92,255,.10)'; c.lineWidth = 1;
        c.beginPath();
        for (var x = 0; x < W; x += 40) { c.moveTo(x, 0); c.lineTo(x, H); }
        for (var y = 0; y < H; y += 40) { c.moveTo(0, y); c.lineTo(W, y); }
        c.stroke();

        d.rings.forEach(function (r) {
          c.globalAlpha = r.t;
          c.strokeStyle = r.miss ? '#fb7185' : '#22d3ee';
          c.lineWidth = 3;
          c.beginPath(); c.arc(r.x, r.y, r.r * (2 - r.t), 0, 7); c.stroke();
        });
        c.globalAlpha = 1;

        d.targets.forEach(function (t) {
          var pulse = 1 + Math.sin(t.life * 8) * .04;
          c.save();
          c.translate(t.x, t.y);
          c.scale(pulse, pulse);
          c.shadowColor = '#ff4d6d'; c.shadowBlur = 22;
          c.fillStyle = '#ff4d6d';
          c.beginPath(); c.arc(0, 0, t.r, 0, 7); c.fill();
          c.shadowBlur = 0;
          c.fillStyle = '#fff';
          c.beginPath(); c.arc(0, 0, t.r * .66, 0, 7); c.fill();
          c.fillStyle = '#ff4d6d';
          c.beginPath(); c.arc(0, 0, t.r * .38, 0, 7); c.fill();
          c.fillStyle = '#fff';
          c.beginPath(); c.arc(0, 0, t.r * .13, 0, 7); c.fill();
          c.restore();
        });

        d.parts.forEach(function (p) {
          c.globalAlpha = Math.max(0, p.life / p.max);
          c.fillStyle = p.col;
          c.fillRect(p.x - 2, p.y - 2, 4, 4);
        });
        c.globalAlpha = 1;

        if (d.streak > 2) {
          c.fillStyle = '#ffd257';
          c.font = '800 18px Outfit, sans-serif';
          c.textAlign = 'center';
          c.fillText('STREAK ×' + d.streak, W / 2, H - 22);
        }
      }
    });
  }

  window.Milo.register({
    id: 'aim-trainer', title: 'Aim Trainer', emo: '🎯', category: 'Casual',
    tagline: 'How fast is your click?',
    description: 'One target at a time, thirty seconds on the clock. Hitting a target ' +
      'instantly spawns the next one — slightly smaller. Faster clicks on smaller targets ' +
      'score more, consecutive hits build a streak bonus, and every miss costs 15 points. ' +
      'Your accuracy and average reaction time are reported at the end.',
    controls: ['Click', 'Tap'],
    colors: ['#ff4d6d', '#22d3ee'],
    tags: ['reflex', 'reaction time', 'accuracy', 'timed'],
    mount: mount
  });
})();

</script>
<script>
/* ---- assets/js/games/coin-tycoon.js ---- */
/* Coin Tycoon — an idle clicker with upgrades that keeps earning offline. */
(function () {
  'use strict';

  var UPGRADES = [
    { id: 'grip', name: 'Better Grip', emo: '✋', desc: '+1 coin per click', cost: 25, mult: 1.45, kind: 'click', amount: 1 },
    { id: 'intern', name: 'Intern', emo: '🧑‍💼', desc: '+0.5 coins per second', cost: 60, mult: 1.5, kind: 'auto', amount: 0.5 },
    { id: 'press', name: 'Coin Press', emo: '⚙️', desc: '+3 coins per second', cost: 420, mult: 1.55, kind: 'auto', amount: 3 },
    { id: 'gloves', name: 'Gold Gloves', emo: '🧤', desc: '+6 coins per click', cost: 900, mult: 1.5, kind: 'click', amount: 6 },
    { id: 'mint', name: 'Private Mint', emo: '🏛️', desc: '+22 coins per second', cost: 5200, mult: 1.6, kind: 'auto', amount: 22 },
    { id: 'vault', name: 'Vault Network', emo: '🏦', desc: '+140 coins per second', cost: 48000, mult: 1.62, kind: 'auto', amount: 140 },
    { id: 'orbit', name: 'Orbital Foundry', emo: '🛰️', desc: '+1,100 coins per second', cost: 520000, mult: 1.7, kind: 'auto', amount: 1100 }
  ];

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;
    var coinsEl, rateEl, shopEl, bigBtn, parts = [], fx;

    function load() {
      var s = Milo.store.get('coin-tycoon:save', null);
      if (!s) return null;
      // Credit whatever the mint earned while the tab was closed (capped at 8h).
      var away = Math.min(8 * 3600, (Date.now() - (s.at || Date.now())) / 1000);
      var rate = rateOf(s.owned || {});
      s.offline = away > 60 ? rate * away : 0;
      s.coins = (s.coins || 0) + s.offline;
      return s;
    }

    function save(d) {
      Milo.store.set('coin-tycoon:save', {
        coins: d.coins, total: d.total, owned: d.owned, clicks: d.clicks, at: Date.now()
      });
    }

    function rateOf(owned) {
      var r = 0;
      UPGRADES.forEach(function (u) {
        if (u.kind === 'auto') r += (owned[u.id] || 0) * u.amount;
      });
      return r;
    }
    function perClick(owned) {
      var c = 1;
      UPGRADES.forEach(function (u) {
        if (u.kind === 'click') c += (owned[u.id] || 0) * u.amount;
      });
      return c;
    }
    function costOf(u, owned) {
      return Math.ceil(u.cost * Math.pow(u.mult, owned[u.id] || 0));
    }

    function reset(g) {
      var d = g.data;
      var s = load();
      d.coins = s ? s.coins : 0;
      d.total = s ? s.total || s.coins : 0;
      d.owned = s ? s.owned || {} : {};
      d.clicks = s ? s.clicks || 0 : 0;
      d.saveT = 0;
      build(g);
      if (s && s.offline > 1) {
        fx.textContent = 'Welcome back — your mints earned ' + U.fmtShort(s.offline) + ' while you were away.';
        setTimeout(function () { if (fx) fx.textContent = ''; }, 6000);
      }
      refresh(g);
    }

    function build(g) {
      var wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;gap:18px;align-items:stretch;width:100%;max-width:760px;' +
        'flex-wrap:wrap;justify-content:center';

      var left = document.createElement('div');
      left.style.cssText = 'flex:1 1 240px;display:flex;flex-direction:column;align-items:center;' +
        'justify-content:center;gap:10px;min-width:230px';

      coinsEl = document.createElement('div');
      coinsEl.style.cssText = 'font:800 clamp(26px,6vw,44px)/1 Outfit,sans-serif;color:#ffd257;' +
        'text-shadow:0 0 24px rgba(255,210,87,.4)';
      rateEl = document.createElement('div');
      rateEl.style.cssText = 'color:#a8b0d8;font-size:.9rem';

      bigBtn = document.createElement('button');
      bigBtn.type = 'button';
      bigBtn.textContent = '🪙';
      bigBtn.style.cssText = 'width:min(46vw,168px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;' +
        'font-size:clamp(46px,12vw,78px);background:radial-gradient(circle at 35% 30%,#ffe9a8,#f0b429 62%,#b47b12);' +
        'box-shadow:0 12px 34px rgba(240,180,41,.45),inset 0 -8px 20px rgba(0,0,0,.25);' +
        'transition:transform .07s;user-select:none;-webkit-user-select:none';
      bigBtn.addEventListener('mousedown', function () { bigBtn.style.transform = 'scale(.94)'; });
      bigBtn.addEventListener('mouseup', function () { bigBtn.style.transform = ''; });
      bigBtn.addEventListener('mouseleave', function () { bigBtn.style.transform = ''; });
      bigBtn.addEventListener('click', function (e) { clickCoin(g, e); });

      fx = document.createElement('div');
      fx.style.cssText = 'color:#34d399;font-size:.84rem;height:2.4em;text-align:center;max-width:26ch';

      left.appendChild(coinsEl);
      left.appendChild(rateEl);
      left.appendChild(bigBtn);
      left.appendChild(fx);

      shopEl = document.createElement('div');
      shopEl.style.cssText = 'flex:1 1 300px;min-width:270px;max-height:min(62vh,430px);overflow-y:auto;' +
        'display:flex;flex-direction:column;gap:7px;padding-right:4px';
      shopEl.addEventListener('click', function (e) {
        var b = e.target.closest('[data-buy]');
        if (b) buy(g, b.dataset.buy);
      });

      wrap.appendChild(left);
      wrap.appendChild(shopEl);
      g.root.innerHTML = '';
      g.root.appendChild(wrap);
    }

    function clickCoin(g, e) {
      var d = g.data;
      var gain = perClick(d.owned);
      d.coins += gain;
      d.total += gain;
      d.clicks++;
      Milo.sound.tone({ f: 760 + Math.random() * 120, f2: 1100, d: .05, v: .05, type: 'square' });
      floatText(g, '+' + U.fmtShort(gain), e);
      refresh(g);
    }

    function floatText(g, text, e) {
      var n = document.createElement('div');
      n.textContent = text;
      var rect = host.getBoundingClientRect();
      var x = e && e.clientX ? e.clientX - rect.left : rect.width / 2;
      var y = e && e.clientY ? e.clientY - rect.top : rect.height / 2;
      n.style.cssText = 'position:absolute;left:' + x + 'px;top:' + y + 'px;pointer-events:none;' +
        'color:#ffd257;font:800 16px Outfit,sans-serif;z-index:7;transition:transform .7s ease-out,opacity .7s';
      host.appendChild(n);
      requestAnimationFrame(function () {
        n.style.transform = 'translate(-50%,-52px)';
        n.style.opacity = '0';
      });
      setTimeout(function () { n.remove(); }, 750);
    }

    function buy(g, id) {
      var d = g.data;
      var u = UPGRADES.filter(function (x) { return x.id === id; })[0];
      if (!u) return;
      var cost = costOf(u, d.owned);
      if (d.coins < cost) { Milo.sound.tone({ f: 140, d: .1, v: .05, type: 'square' }); return; }
      d.coins -= cost;
      d.owned[id] = (d.owned[id] || 0) + 1;
      Milo.sound.powerup();
      refresh(g);
      save(d);
    }

    function refresh(g) {
      var d = g.data;
      var rate = rateOf(d.owned), click = perClick(d.owned);
      coinsEl.textContent = U.fmtShort(d.coins) + ' 🪙';
      rateEl.textContent = U.fmtShort(rate) + '/sec  ·  ' + U.fmtShort(click) + ' per click';
      g.set('Coins', U.fmtShort(d.coins));
      g.set('Per sec', U.fmtShort(rate));
      g.set('Earned', U.fmtShort(d.total));
      g.score = Math.floor(d.total);
      Milo.store.setBest('coin-tycoon', g.score);

      shopEl.innerHTML = UPGRADES.map(function (u) {
        var have = d.owned[u.id] || 0;
        var cost = costOf(u, d.owned);
        var can = d.coins >= cost;
        // Hide upgrades that are still far out of reach, so the shop stays readable.
        var visible = have > 0 || d.total >= u.cost * 0.4;
        if (!visible) return '';
        return '<button data-buy="' + u.id + '" type="button" style="' +
          'display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:9px 11px;' +
          'border-radius:12px;cursor:' + (can ? 'pointer' : 'default') + ';' +
          'border:1px solid ' + (can ? 'rgba(52,211,153,.5)' : 'rgba(255,255,255,.08)') + ';' +
          'background:' + (can ? 'rgba(52,211,153,.10)' : 'rgba(255,255,255,.04)') + ';' +
          'color:#eef1ff;font:inherit;opacity:' + (can ? '1' : '.6') + '">' +
          '<span style="font-size:22px">' + u.emo + '</span>' +
          '<span style="flex:1">' +
          '<span style="font-weight:700;font-size:.9rem">' + u.name +
          (have ? ' <span style="color:#22d3ee">×' + have + '</span>' : '') + '</span><br>' +
          '<span style="font-size:.76rem;color:#a8b0d8">' + u.desc + '</span></span>' +
          '<span style="font-weight:800;font-size:.85rem;color:' + (can ? '#34d399' : '#8b93bd') + '">' +
          U.fmtShort(cost) + '</span></button>';
      }).join('');
    }

    return Milo.domGame(host, {
      id: 'coin-tycoon',
      stats: ['Coins', 'Per sec', 'Earned'],
      bg: '#12142e',
      emo: '🪙',
      trackBest: false,
      autoStart: true,
      start: { title: 'Coin Tycoon' },
      init: reset,
      update: function (g, dt) {
        var d = g.data;
        var rate = rateOf(d.owned);
        if (rate) {
          d.coins += rate * dt;
          d.total += rate * dt;
        }
        d.tick = (d.tick || 0) + dt;
        if (d.tick > 0.2) { d.tick = 0; refresh(g); }
        d.saveT += dt;
        if (d.saveT > 5) { d.saveT = 0; save(d); }
      },
      destroy: function (g) { save(g.data); }
    });
  }

  window.Milo.register({
    id: 'coin-tycoon', title: 'Coin Tycoon', emo: '🪙', category: 'Casual',
    tagline: 'Click, upgrade, and let it run',
    description: 'Tap the coin to earn. Spend what you make on interns, presses, mints ' +
      'and eventually an orbital foundry, each of which earns for you automatically. ' +
      'Your progress saves in this browser and the mints keep working while the tab is ' +
      'closed — up to eight hours’ worth.',
    controls: ['Click the coin', 'Click an upgrade to buy'],
    colors: ['#f0b429', '#b47b12'],
    scoreLabel: 'coins',
    tags: ['idle', 'clicker', 'upgrades', 'relaxing'],
    mount: mount
  });
})();

</script>

<script>
/* ---- assets/js/app.js ---- */
/* ==========================================================================
   MiloPlay portal
   Hash routing, search, categories, favourites, recently-played, and the
   game player. Everything is client-side so the whole site works as static
   files (GitHub Pages, a USB stick, or file://).
   ========================================================================== */
(function () {
  'use strict';

  var Milo = window.Milo;
  var U = Milo.util;
  var store = Milo.store;
  var el = Milo.el;

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  /* --------------------------------------------------------------- state */

  var CATEGORIES = [
    { id: 'Sandbox', icon: '⛏️', blurb: 'Build, mine and explore open worlds.' },
    { id: 'Arcade', icon: '🕹️', blurb: 'Quick reflex classics you can pick up in a second.' },
    { id: 'Action', icon: '💥', blurb: 'Shoot, dodge and survive the swarm.' },
    { id: 'Puzzle', icon: '🧩', blurb: 'Take your time and think it through.' },
    { id: 'Racing', icon: '🏎️', blurb: 'Fast lanes, tight corners, no brakes.' },
    { id: 'Sports', icon: '🏓', blurb: 'Beat the bot, beat your best.' },
    { id: 'Casual', icon: '🍭', blurb: 'Relaxed games for a five-minute break.' },
    { id: 'Strategy', icon: '♟️', blurb: 'Outsmart the opponent, one move at a time.' }
  ];

  // Officially-hosted games elsewhere on the web. We link out rather than
  // embed — these are other people's sites and framing them is not ours to do.
  var EXTERNAL = [
    { name: 'Eaglercraft', desc: 'Minecraft 1.8 in the browser', url: 'https://eaglercraft.com/', emo: '⛏️', colors: ['#5b8a3c', '#8b5a2b'] },
    { name: 'Bloxd.io', desc: 'Multiplayer voxel worlds & minigames', url: 'https://bloxd.io/', emo: '🧱', colors: ['#f59e0b', '#ef4444'] },
    { name: 'CrazyGames', desc: 'Huge browser games catalogue', url: 'https://www.crazygames.com/', emo: '🎡', colors: ['#7c5cff', '#ec4899'] },
    { name: 'Poki', desc: 'Curated free web games', url: 'https://poki.com/', emo: '🎈', colors: ['#22d3ee', '#3b82f6'] },
    { name: 'Krunker.io', desc: 'Fast browser FPS', url: 'https://krunker.io/', emo: '🔫', colors: ['#64748b', '#0ea5e9'] },
    { name: 'itch.io', desc: 'Indie games, many playable in-browser', url: 'https://itch.io/games/html5', emo: '🎨', colors: ['#fa5c5c', '#f97316'] }
  ];

  var state = {
    query: '',
    route: { name: 'home' },
    favs: store.get('favs', []) || [],
    recent: store.get('recent', []) || [],
    plays: store.get('plays', {}) || {}
  };

  var current = null;  // live game instance

  /* --------------------------------------------------------------- helpers */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function tileStyle(game) {
    var c = game.colors;
    return 'background:linear-gradient(140deg,' + c[0] + ' 0%,' + c[1] + ' 100%)';
  }

  function tileHTML(game, cls) {
    return '<div class="tile ' + (cls || '') + '" style="' + tileStyle(game) + '">' +
      '<span class="glyph">' + (game.emo || '🎮') + '</span></div>';
  }

  function isFav(id) { return state.favs.indexOf(id) !== -1; }

  function toggleFav(id) {
    var i = state.favs.indexOf(id);
    if (i === -1) { state.favs.unshift(id); toast('❤️ Added to favourites'); }
    else { state.favs.splice(i, 1); toast('Removed from favourites'); }
    store.set('favs', state.favs);
    renderSidebar();
    return isFav(id);
  }

  function markPlayed(id) {
    state.recent = [id].concat(state.recent.filter(function (x) { return x !== id; })).slice(0, 24);
    state.plays[id] = (state.plays[id] || 0) + 1;
    store.set('recent', state.recent);
    store.set('plays', state.plays);
    renderSidebar();
  }
  Milo.onPlayed = markPlayed;

  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2000);
  }

  function go(hash) { location.hash = hash; }

  function scoreMatch(game, q) {
    var t = game.title.toLowerCase();
    if (t === q) return 100;
    if (t.indexOf(q) === 0) return 80;
    if (t.indexOf(q) !== -1) return 60;
    if ((game.tagline || '').toLowerCase().indexOf(q) !== -1) return 40;
    if (game.category.toLowerCase().indexOf(q) !== -1) return 30;
    if (game.tags.some(function (x) { return x.toLowerCase().indexOf(q) !== -1; })) return 25;
    if ((game.description || '').toLowerCase().indexOf(q) !== -1) return 10;
    return 0;
  }

  function search(q) {
    q = q.trim().toLowerCase();
    if (!q) return [];
    return Milo.games
      .map(function (gm) { return { g: gm, s: scoreMatch(gm, q) }; })
      .filter(function (r) { return r.s > 0; })
      .sort(function (a, b) { return b.s - a.s || a.g.title.localeCompare(b.g.title); })
      .map(function (r) { return r.g; });
  }

  /* ------------------------------------------------------------ card list */

  // The play overlay has to live inside .tile for the hover effect, so cards
  // are assembled as nodes rather than as an HTML string.
  function card(game, opts) {
    opts = opts || {};
    var b = el('button', 'card' + (opts.wide ? ' wide' : ''));
    b.type = 'button';
    b.dataset.play = game.id;
    b.setAttribute('aria-label', 'Play ' + game.title);

    var badgeText = opts.badge || (game.featured ? 'Featured' : (game.isNew ? 'New' : ''));
    var badgeKind = opts.badgeKind || (game.featured ? 'hot' : (game.isNew ? 'new' : ''));
    if (badgeText) b.appendChild(el('span', 'badge ' + badgeKind, esc(badgeText)));

    var fav = el('span', 'fav-btn' + (isFav(game.id) ? ' on' : ''), isFav(game.id) ? '♥' : '♡');
    fav.dataset.fav = game.id;
    fav.setAttribute('role', 'button');
    fav.setAttribute('tabindex', '0');
    fav.setAttribute('aria-label', 'Toggle favourite for ' + game.title);
    b.appendChild(fav);

    var tile = el('div', 'tile');
    tile.setAttribute('style', tileStyle(game));
    tile.appendChild(el('span', 'glyph', game.emo || '🎮'));
    var pl = el('div', 'tile-play');
    pl.appendChild(el('span', null, Milo.ICON.play));
    tile.appendChild(pl);
    b.appendChild(tile);

    var best = store.best(game.id);
    var body = el('div', 'card-body');
    body.appendChild(el('div', 'card-title', esc(game.title)));
    body.appendChild(el('div', 'card-meta',
      esc(game.category) + (best ? '<span class="dot"></span>Best ' + U.fmt(best) : '')));
    b.appendChild(body);
    return b;
  }

  function gridOf(games, opts) {
    var grid = el('div', 'grid' + (opts && opts.big ? ' big' : ''));
    games.forEach(function (gm, i) {
      grid.appendChild(card(gm, { wide: opts && opts.wideFirst && i === 0 }));
    });
    return grid;
  }

  function section(title, emo, games, opts) {
    opts = opts || {};
    if (!games.length) return null;
    var s = el('section', 'section');
    var head = el('div', 'section-head');
    head.appendChild(el('h2', null, '<span class="emo">' + emo + '</span>' + esc(title)));
    if (opts.moreHash) {
      var m = el('button', 'more', 'See all →');
      m.type = 'button';
      m.addEventListener('click', function () { go(opts.moreHash); });
      head.appendChild(m);
    }
    s.appendChild(head);
    s.appendChild(gridOf(games, opts));
    return s;
  }

  /* ------------------------------------------------------------- sidebar */

  function renderSidebar() {
    var nav = $('#sidenav');
    if (!nav) return;
    var r = state.route;
    var html = '';

    function link(hash, icon, label, count, active) {
      return '<button class="side-link' + (active ? ' active' : '') + '" data-go="' + hash + '">' +
        '<span class="ico">' + icon + '</span>' + esc(label) +
        (count ? '<span class="count">' + count + '</span>' : '') + '</button>';
    }

    html += '<div class="side-title">Browse</div>';
    html += link('#/', '🏠', 'Home', 0, r.name === 'home');
    html += link('#/browse', '🎮', 'All games', Milo.games.length, r.name === 'browse' && !r.cat);
    html += link('#/favorites', '❤️', 'Favourites', state.favs.length, r.name === 'favorites');
    html += link('#/recent', '🕘', 'Recently played', state.recent.length, r.name === 'recent');

    html += '<div class="side-title">Categories</div>';
    CATEGORIES.forEach(function (c) {
      var n = Milo.games.filter(function (gm) { return gm.category === c.id; }).length;
      if (!n) return;
      html += link('#/c/' + encodeURIComponent(c.id), c.icon, c.id, n, r.name === 'browse' && r.cat === c.id);
    });

    html += '<div class="side-title">More</div>';
    html += link('#/elsewhere', '🌐', 'Games elsewhere', 0, r.name === 'elsewhere');
    html += link('#/about', 'ℹ️', 'About', 0, r.name === 'about');

    nav.innerHTML = html;
  }

  /* --------------------------------------------------------------- views */

  function viewHome() {
    var wrap = el('div');

    var featured = Milo.games.filter(function (gm) { return gm.featured; });
    var hero = el('section', 'hero');
    hero.innerHTML =
      '<div class="hero-inner">' +
      '<span class="eyebrow">✨ ' + Milo.games.length + ' free games · no downloads · no sign-up</span>' +
      '<h1>Play something <span>brilliant</span> right now.</h1>' +
      '<p>Voxel worlds, arena shooters, puzzles and arcade classics — all built to run ' +
      'instantly in your browser, on any device. Nothing to install, nothing to pay.</p>' +
      '<div class="hero-cta">' +
      '<button class="btn btn-primary" data-play="' + esc((featured[0] || Milo.games[0]).id) + '">' +
      Milo.ICON.play + ' Play ' + esc((featured[0] || Milo.games[0]).title) + '</button>' +
      '<button class="btn btn-ghost" data-go="#/browse">Browse all games</button>' +
      '<button class="btn btn-ghost" data-random="1">🎲 Surprise me</button>' +
      '</div></div>';
    wrap.appendChild(hero);

    var s;
    if ((s = section('Featured', '⭐', featured, { big: true, moreHash: '#/browse' }))) wrap.appendChild(s);

    var recentGames = state.recent.map(function (id) { return Milo.byId[id]; })
      .filter(Boolean).slice(0, 12);
    if ((s = section('Jump back in', '🕘', recentGames, { moreHash: '#/recent' }))) wrap.appendChild(s);

    var favGames = state.favs.map(function (id) { return Milo.byId[id]; }).filter(Boolean).slice(0, 12);
    if ((s = section('Your favourites', '❤️', favGames, { moreHash: '#/favorites' }))) wrap.appendChild(s);

    // Most-played across this browser, falling back to catalogue order.
    var popular = Milo.games.slice().sort(function (a, b) {
      return (state.plays[b.id] || 0) - (state.plays[a.id] || 0) ||
        (b.featured ? 1 : 0) - (a.featured ? 1 : 0);
    }).slice(0, 12);
    if ((s = section('Popular now', '🔥', popular, { moreHash: '#/browse' }))) wrap.appendChild(s);

    CATEGORIES.forEach(function (c) {
      var games = Milo.games.filter(function (gm) { return gm.category === c.id; });
      if (games.length < 2) return;
      var sec = section(c.id, c.icon, games.slice(0, 12), { moreHash: '#/c/' + encodeURIComponent(c.id) });
      if (sec) wrap.appendChild(sec);
    });

    // Links out to the big sites people asked about.
    var ext = el('section', 'section');
    ext.appendChild(el('div', 'section-head',
      '<h2><span class="emo">🌐</span>Great games elsewhere</h2>'));
    ext.appendChild(el('p', null,
      '<span style="color:var(--text-2);font-size:.93rem">These open on their own official sites in a new tab.</span>'));
    ext.appendChild(externalList());
    wrap.appendChild(ext);

    return wrap;
  }

  function externalList() {
    var list = el('div', 'ext-list');
    list.style.marginTop = '12px';
    EXTERNAL.forEach(function (x) {
      var a = el('a', 'ext');
      a.href = x.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML =
        '<div class="tile" style="background:linear-gradient(140deg,' + x.colors[0] + ',' + x.colors[1] + ')">' +
        '<span class="glyph">' + x.emo + '</span></div>' +
        '<div><div class="n">' + esc(x.name) + '</div><div class="d">' + esc(x.desc) + '</div></div>' +
        '<span class="arrow">↗</span>';
      list.appendChild(a);
    });
    return list;
  }

  function viewBrowse(cat) {
    var wrap = el('div');
    var games = cat ? Milo.games.filter(function (gm) { return gm.category === cat; }) : Milo.games.slice();
    var meta = CATEGORIES.filter(function (c) { return c.id === cat; })[0];

    var head = el('div', 'page-head');
    head.innerHTML =
      '<h1>' + (meta ? meta.icon + ' ' : '') + esc(cat || 'All games') + '</h1>' +
      '<p>' + (meta ? esc(meta.blurb) + ' ' : '') + games.length + ' game' + (games.length === 1 ? '' : 's') +
      ' — free, instant, no account needed.</p>';
    wrap.appendChild(head);

    var chips = el('div', 'chips');
    var all = el('button', 'chip' + (!cat ? ' active' : ''), 'All');
    all.type = 'button';
    all.addEventListener('click', function () { go('#/browse'); });
    chips.appendChild(all);
    CATEGORIES.forEach(function (c) {
      var n = Milo.games.filter(function (gm) { return gm.category === c.id; }).length;
      if (!n) return;
      var b = el('button', 'chip' + (cat === c.id ? ' active' : ''), c.icon + ' ' + c.id);
      b.type = 'button';
      b.addEventListener('click', function () { go('#/c/' + encodeURIComponent(c.id)); });
      chips.appendChild(b);
    });
    wrap.appendChild(chips);

    games.sort(function (a, b) {
      return (b.featured ? 1 : 0) - (a.featured ? 1 : 0) || a.title.localeCompare(b.title);
    });
    wrap.appendChild(gridOf(games, { big: !!cat }));
    return wrap;
  }

  function viewList(title, emo, games, emptyMsg) {
    var wrap = el('div');
    var head = el('div', 'page-head');
    head.innerHTML = '<h1>' + emo + ' ' + esc(title) + '</h1><p>' + games.length +
      ' game' + (games.length === 1 ? '' : 's') + '</p>';
    wrap.appendChild(head);
    if (!games.length) {
      wrap.appendChild(emptyState(emo, title, emptyMsg));
    } else {
      wrap.appendChild(gridOf(games, { big: true }));
    }
    return wrap;
  }

  function emptyState(emo, title, msg) {
    var e = el('div', 'empty');
    e.innerHTML = '<div class="e">' + emo + '</div><h3>Nothing here yet</h3><p>' + esc(msg) + '</p>';
    var b = el('button', 'btn btn-primary', 'Browse all games');
    b.type = 'button';
    b.addEventListener('click', function () { go('#/browse'); });
    e.appendChild(b);
    return e;
  }

  function viewSearch(q) {
    var results = search(q);
    var wrap = el('div');
    var head = el('div', 'page-head');
    head.innerHTML = '<h1>Search</h1><p>' + results.length + ' result' +
      (results.length === 1 ? '' : 's') + ' for “' + esc(q) + '”</p>';
    wrap.appendChild(head);
    if (!results.length) {
      var e = el('div', 'empty');
      e.innerHTML = '<div class="e">🔍</div><h3>No games matched “' + esc(q) + '”</h3>' +
        '<p>Try a category like <b>puzzle</b>, <b>racing</b> or <b>sandbox</b>.</p>';
      var b = el('button', 'btn btn-primary', 'Browse all games');
      b.type = 'button';
      b.addEventListener('click', function () { go('#/browse'); });
      e.appendChild(b);
      wrap.appendChild(e);
    } else {
      wrap.appendChild(gridOf(results, { big: true }));
    }
    return wrap;
  }

  function viewElsewhere() {
    var wrap = el('div');
    wrap.appendChild(el('div', 'page-head',
      '<h1>🌐 Games elsewhere</h1><p>Big browser-game sites worth a visit. ' +
      'Each link opens the official site in a new tab.</p>'));
    wrap.appendChild(externalList());
    var note = el('div', 'info-card');
    note.style.marginTop = '24px';
    note.innerHTML = '<h3>Why link instead of embed?</h3>' +
      '<p>These are other people’s games on their own servers. Linking to them keeps ' +
      'their analytics, their ads and their rules intact — and it means MiloPlay stays fast ' +
      'and works offline. Everything under “All games” is built into this site and runs locally.</p>';
    wrap.appendChild(note);
    return wrap;
  }

  function viewAbout() {
    var wrap = el('div');
    wrap.appendChild(el('div', 'page-head',
      '<h1>ℹ️ About MiloPlay</h1><p>A free browser arcade with ' + Milo.games.length +
      ' original games.</p>'));
    var c = el('div', 'info-card');
    c.innerHTML =
      '<h3>What this is</h3>' +
      '<p>MiloPlay is a static website — one HTML page, some CSS and some JavaScript. ' +
      'Every game here was written from scratch for this site and runs entirely in your ' +
      'browser. There is no server, no account, no tracking and no ads.</p>' +
      '<h3 style="margin-top:18px">Your data</h3>' +
      '<p>High scores, favourites and your recently-played list are saved in your browser’s ' +
      'own storage. They never leave your device, and clearing your browser data resets them.</p>' +
      '<h3 style="margin-top:18px">Controls</h3>' +
      '<p>Most games work with the arrow keys or WASD, plus the mouse. On phones and tablets ' +
      'an on-screen pad appears automatically. Every game has a fullscreen button.</p>' +
      '<h3 style="margin-top:18px">Works offline</h3>' +
      '<p>Once the page has loaded, you can keep playing without a connection.</p>';
    wrap.appendChild(c);
    return wrap;
  }

  function viewPlay(id) {
    var game = Milo.byId[id];
    if (!game) {
      var e = el('div', 'empty');
      e.innerHTML = '<div class="e">🕳️</div><h3>That game doesn’t exist</h3>' +
        '<p>The link may be out of date.</p>';
      var b = el('button', 'btn btn-primary', 'Browse all games');
      b.type = 'button';
      b.addEventListener('click', function () { go('#/browse'); });
      e.appendChild(b);
      return e;
    }

    var wrap = el('div');

    var crumb = el('button', 'crumb', '← Back to games');
    crumb.type = 'button';
    crumb.addEventListener('click', function () {
      if (history.length > 1) history.back(); else go('#/browse');
    });
    wrap.appendChild(crumb);

    var layout = el('div', 'player-wrap');

    /* left: the game itself */
    var shell = el('div', 'stage-shell');
    var bar = el('div', 'stage-bar');
    bar.innerHTML =
      '<div class="tile" style="' + tileStyle(game) + '"><span class="glyph" style="font-size:17px">' +
      (game.emo || '🎮') + '</span></div>' +
      '<div><div class="n">' + esc(game.title) + '</div>' +
      '<div class="c">' + esc(game.category) + ' · ' + esc(game.tagline || '') + '</div></div>' +
      '<div class="sp"></div>';
    var favBtn = el('button', 'btn btn-sm ' + (isFav(game.id) ? 'btn-primary' : ''),
      (isFav(game.id) ? '♥ Favourited' : '♡ Favourite'));
    favBtn.type = 'button';
    favBtn.addEventListener('click', function () {
      var on = toggleFav(game.id);
      favBtn.className = 'btn btn-sm ' + (on ? 'btn-primary' : '');
      favBtn.textContent = on ? '♥ Favourited' : '♡ Favourite';
    });
    bar.appendChild(favBtn);
    shell.appendChild(bar);

    var stage = el('div', 'stage');
    stage.id = 'stage';
    shell.appendChild(stage);
    layout.appendChild(shell);

    /* right: info panel */
    var side = el('div');

    var about = el('div', 'info-card');
    about.innerHTML = '<h3>How to play</h3><p>' + esc(game.description || game.tagline || '') + '</p>';
    if (game.controls && game.controls.length) {
      var kc = el('div', 'keycaps');
      game.controls.forEach(function (k) { kc.appendChild(el('kbd', null, esc(k))); });
      about.appendChild(kc);
    }
    side.appendChild(about);

    var stats = el('div', 'info-card');
    var best = store.best(game.id);
    stats.innerHTML = '<h3>Stats</h3>' +
      '<div class="kv"><span class="k">Your best</span><span class="v">' +
      (best ? U.fmt(best) + (game.scoreLabel ? ' ' + esc(game.scoreLabel) : '') : '—') + '</span></div>' +
      '<div class="kv"><span class="k">Times played</span><span class="v">' +
      (state.plays[game.id] || 0) + '</span></div>' +
      '<div class="kv"><span class="k">Category</span><span class="v">' + esc(game.category) + '</span></div>';
    side.appendChild(stats);

    if (game.tags.length) {
      var tg = el('div', 'info-card');
      tg.innerHTML = '<h3>Tags</h3>';
      var row = el('div', 'tag-row');
      game.tags.forEach(function (t) {
        var s = el('span', 'tag', esc(t));
        s.addEventListener('click', function () {
          $('#q').value = t;
          go('#/search/' + encodeURIComponent(t));
        });
        row.appendChild(s);
      });
      tg.appendChild(row);
      side.appendChild(tg);
    }

    layout.appendChild(side);
    wrap.appendChild(layout);

    /* related */
    var related = Milo.games.filter(function (x) {
      return x.id !== game.id && (x.category === game.category ||
        x.tags.some(function (t) { return game.tags.indexOf(t) !== -1; }));
    }).slice(0, 8);
    if (!related.length) related = Milo.games.filter(function (x) { return x.id !== game.id; }).slice(0, 8);
    var rs = section('More like this', '🎯', related);
    if (rs) { rs.style.marginTop = '30px'; wrap.appendChild(rs); }

    // Mount after the node is in the document so the stage has a real size.
    requestAnimationFrame(function () {
      if (!document.body.contains(stage)) return;
      try {
        current = game.mount(stage, Milo);
      } catch (err) {
        stage.innerHTML = '<div style="color:#fff;padding:30px;text-align:center;font-family:var(--font)">' +
          '<div style="font-size:2.4rem">😵</div><h3>This game failed to start</h3>' +
          '<p style="color:#9aa3d0;font-size:.9rem">' + esc(err && err.message) + '</p></div>';
      }
    });

    return wrap;
  }

  /* --------------------------------------------------------------- router */

  function parseHash() {
    var h = location.hash.replace(/^#\/?/, '');
    var parts = h.split('/').filter(Boolean).map(decodeURIComponent);
    if (!parts.length) return { name: 'home' };
    switch (parts[0]) {
      case 'play': return { name: 'play', id: parts[1] };
      case 'browse': return { name: 'browse' };
      case 'c': return { name: 'browse', cat: parts[1] };
      case 'favorites': case 'favourites': return { name: 'favorites' };
      case 'recent': return { name: 'recent' };
      case 'search': return { name: 'search', q: parts.slice(1).join('/') };
      case 'elsewhere': return { name: 'elsewhere' };
      case 'about': return { name: 'about' };
      default: return { name: 'home' };
    }
  }

  function render() {
    if (current) { try { current.destroy(); } catch (e) { } current = null; }

    // A game may have grabbed the pointer or gone fullscreen. Neither should
    // survive a navigation, and a destroy that threw may not have undone them.
    if (document.pointerLockElement) { try { document.exitPointerLock(); } catch (e) { } }
    if (document.fullscreenElement) { document.exitFullscreen().catch(function () { }); }

    var r = state.route = parseHash();
    var main = $('#main');
    var view;

    switch (r.name) {
      case 'play': view = viewPlay(r.id); break;
      case 'browse': view = viewBrowse(r.cat); break;
      case 'favorites':
        view = viewList('Favourites', '❤️',
          state.favs.map(function (id) { return Milo.byId[id]; }).filter(Boolean),
          'Tap the heart on any game to save it here.');
        break;
      case 'recent':
        view = viewList('Recently played', '🕘',
          state.recent.map(function (id) { return Milo.byId[id]; }).filter(Boolean),
          'Games you play will show up here.');
        break;
      case 'search': view = viewSearch(r.q || ''); break;
      case 'elsewhere': view = viewElsewhere(); break;
      case 'about': view = viewAbout(); break;
      default: view = viewHome();
    }

    main.innerHTML = '';
    main.appendChild(view);
    renderSidebar();
    closeSidebar();

    document.title = titleFor(r);
    if (r.name !== 'play') window.scrollTo(0, 0);
  }

  function titleFor(r) {
    var base = 'MiloPlay — free browser games';
    if (r.name === 'play' && Milo.byId[r.id]) return Milo.byId[r.id].title + ' · MiloPlay';
    if (r.name === 'browse' && r.cat) return r.cat + ' games · MiloPlay';
    if (r.name === 'browse') return 'All games · MiloPlay';
    if (r.name === 'search') return 'Search · MiloPlay';
    return base;
  }

  /* ------------------------------------------------------- global events */

  document.addEventListener('click', function (e) {
    var fav = e.target.closest('[data-fav]');
    if (fav) {
      e.preventDefault(); e.stopPropagation();
      var on = toggleFav(fav.dataset.fav);
      fav.classList.toggle('on', on);
      fav.textContent = on ? '♥' : '♡';
      return;
    }
    var play = e.target.closest('[data-play]');
    if (play) { go('#/play/' + encodeURIComponent(play.dataset.play)); return; }

    var nav = e.target.closest('[data-go]');
    if (nav) { go(nav.dataset.go); return; }

    if (e.target.closest('[data-random]')) {
      go('#/play/' + encodeURIComponent(U.choice(Milo.games).id));
      return;
    }
  });

  /* --------------------------------------------------------------- search */

  function setupSearch() {
    var box = $('#search');
    var input = $('#q');
    var sug = $('#suggest');
    var idx = -1;
    var items = [];

    function close() { sug.classList.remove('open'); idx = -1; }

    function open(list) {
      items = list.slice(0, 8);
      if (!items.length) {
        sug.innerHTML = '<div class="suggest-empty">No games matched. Try “puzzle” or “race”.</div>';
        sug.classList.add('open');
        return;
      }
      sug.innerHTML = items.map(function (gm, i) {
        return '<button class="suggest-item' + (i === idx ? ' active' : '') + '" data-play="' +
          esc(gm.id) + '">' +
          '<span class="tile" style="' + tileStyle(gm) + '">' + (gm.emo || '🎮') + '</span>' +
          '<span><span class="t">' + esc(gm.title) + '</span><br>' +
          '<span class="c">' + esc(gm.category) + ' · ' + esc(gm.tagline || '') + '</span></span>' +
          '</button>';
      }).join('');
      sug.classList.add('open');
    }

    input.addEventListener('input', function () {
      state.query = input.value;
      box.classList.toggle('has-value', !!input.value);
      idx = -1;
      if (!input.value.trim()) { close(); return; }
      open(search(input.value));
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!items.length) return;
        e.preventDefault();
        idx = (idx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        $$('.suggest-item', sug).forEach(function (n, i) { n.classList.toggle('active', i === idx); });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (idx >= 0 && items[idx]) { go('#/play/' + encodeURIComponent(items[idx].id)); }
        else if (input.value.trim()) { go('#/search/' + encodeURIComponent(input.value.trim())); }
        close(); input.blur();
      } else if (e.key === 'Escape') { close(); input.blur(); }
    });

    $('#s-clear').addEventListener('click', function () {
      input.value = ''; box.classList.remove('has-value'); close(); input.focus();
    });

    document.addEventListener('click', function (e) {
      if (!box.contains(e.target)) close();
    });

    // "/" focuses search from anywhere that isn't already a text field.
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && document.activeElement !== input &&
        !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
        e.preventDefault(); input.focus(); input.select();
      }
    });
  }

  /* ---------------------------------------------------------------- theme */

  function setupTheme() {
    var root = document.documentElement;
    var saved = store.get('theme', null);
    if (saved) root.setAttribute('data-theme', saved);
    var btn = $('#theme');

    // With nothing stamped on the root, the OS preference decides, so the
    // button has to resolve the theme actually in effect rather than read
    // the attribute alone.
    function isDark() {
      var stamp = root.getAttribute('data-theme');
      if (stamp) return stamp !== 'light';
      return !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    }
    function icon() { btn.textContent = isDark() ? '🌙' : '☀️'; }

    icon();
    btn.addEventListener('click', function () {
      var next = isDark() ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      store.set('theme', next);
      icon();
    });

    // Follow the OS while the visitor hasn't chosen a theme themselves.
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: light)');
      var onChange = function () { if (!store.get('theme', null)) icon(); };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }
  }

  /* -------------------------------------------------------------- sidebar */

  function openSidebar() { $('#sidebar').classList.add('open'); $('#scrim').classList.add('on'); }
  function closeSidebar() { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); }

  /* ----------------------------------------------------------------- boot */

  function boot() {
    // Capability sniffing marks plenty of desktops as touch devices, which
    // would park a d-pad over the game. Wait for a real touch instead; the
    // (pointer: coarse) media query already covers phones and tablets.
    window.addEventListener('touchstart', function onFirstTouch() {
      document.body.classList.add('touch');
      window.removeEventListener('touchstart', onFirstTouch);
    }, { passive: true });
    setupTheme();
    setupSearch();
    $('#menu').addEventListener('click', openSidebar);
    $('#scrim').addEventListener('click', closeSidebar);
    $('#sidenav').addEventListener('click', function (e) {
      var b = e.target.closest('[data-go]');
      if (b) go(b.dataset.go);
    });
    window.addEventListener('hashchange', render);
    render();
    $('#boot').remove();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
