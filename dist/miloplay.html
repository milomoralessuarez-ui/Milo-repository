<script>
/* ---- assets/js/games/astro-blaster.js ---- */
/* Astro Blaster — twin-stick-ish space shooter with waves and power-ups. */
(function () {
  'use strict';
  var W = 800, H = 600;

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function reset(g) {
      var d = g.data;
      d.ship = { x: W / 2, y: H - 70, r: 14, cool: 0, inv: 2 };
      d.lives = 3;
      d.wave = 0;
      d.enemies = [];
      d.bullets = [];
      d.foeShots = [];
      d.parts = [];
      d.drops = [];
      d.stars = [];
      d.weapon = 1;
      d.weaponT = 0;
      d.shake = 0;
      d.waveTimer = 1;
      for (var i = 0; i < 90; i++) {
        d.stars.push({ x: Math.random() * W, y: Math.random() * H, z: U.rand(.25, 1) });
      }
      g.set('Score', 0);
      g.set('Wave', 0);
      g.set('Lives', 3);
    }

    function spawnWave(g) {
      var d = g.data;
      d.wave++;
      g.set('Wave', d.wave);
      var n = Math.min(22, 5 + d.wave * 2);
      var kinds = d.wave < 3 ? ['grunt'] : d.wave < 6 ? ['grunt', 'zig'] : ['grunt', 'zig', 'tank'];
      for (var i = 0; i < n; i++) {
        var kind = U.choice(kinds);
        var col = i % 8, row = (i / 8) | 0;
        d.enemies.push({
          kind: kind,
          x: 120 + col * 80 + U.rand(-10, 10),
          y: -60 - row * 62,
          r: kind === 'tank' ? 20 : 15,
          hp: kind === 'tank' ? 5 : (kind === 'zig' ? 2 : 1),
          t: Math.random() * 6,
          vy: (kind === 'tank' ? 26 : 40) + d.wave * 2.5,
          cool: U.rand(1, 4)
        });
      }
      Milo.sound.tone({ f: 200, f2: 420, d: .3, v: .09, type: 'sawtooth' });
    }

    function shoot(g) {
      var d = g.data, s = d.ship;
      if (s.cool > 0) return;
      s.cool = d.weapon >= 3 ? .1 : .15;
      var mk = function (dx, off) {
        d.bullets.push({ x: s.x + (off || 0), y: s.y - 16, vx: dx, vy: -640, r: 4 });
      };
      if (d.weapon === 1) mk(0);
      else if (d.weapon === 2) { mk(0, -9); mk(0, 9); }
      else { mk(0, -10); mk(0, 10); mk(-190); mk(190); }
      Milo.sound.tone({ f: 900, f2: 500, d: .05, v: .05, type: 'square' });
    }

    function boom(d, x, y, col, n) {
      for (var i = 0; i < n; i++) {
        var a = Math.random() * 6.28, s = U.rand(40, 300);
        d.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: U.rand(.25, .7), max: .7, col: col });
      }
    }

    return Milo.arcade(host, {
      id: 'astro-blaster',
      w: W, h: H, bg: '#04030f',
      stats: ['Score', 'Wave', 'Lives'],
      emo: '🚀',
      touch: 'dpad',
      touchButtons: [{ key: 'action', label: 'FIRE' }],
      start: {
        title: 'Astro Blaster',
        text: 'Endless waves of hostiles. Shoot them down, grab the power-ups, ' +
          'and see how deep you can get.',
        keys: ['← → ↑ ↓ / WASD', 'Space to fire', 'Mouse to aim']
      },
      init: reset,
      onPointer: function (g, type, x, y) {
        var d = g.data;
        if (!d.ship) return;
        d.ship.x = U.clamp(x, 20, W - 20);
        d.ship.y = U.clamp(y, 60, H - 24);
        if (type === 'down') d.firing = true;
        if (type === 'up') d.firing = false;
      },

      update: function (g, dt) {
        var d = g.data, i = g.input, s = d.ship;

        var sp = 380 * dt;
        if (i.down('left')) s.x -= sp;
        if (i.down('right')) s.x += sp;
        if (i.down('up')) s.y -= sp;
        if (i.down('down')) s.y += sp;
        s.x = U.clamp(s.x, 20, W - 20);
        s.y = U.clamp(s.y, 60, H - 24);

        s.cool -= dt;
        s.inv = Math.max(0, s.inv - dt);
        d.weaponT = Math.max(0, d.weaponT - dt);
        if (d.weaponT === 0 && d.weapon > 1) d.weapon = 1;
        d.shake = Math.max(0, d.shake - dt * 4);

        if (i.down('action') || d.firing) shoot(g);

        d.stars.forEach(function (st) {
          st.y += (28 + st.z * 90) * dt;
          if (st.y > H) { st.y = -2; st.x = Math.random() * W; }
        });

        // waves
        if (!d.enemies.length) {
          d.waveTimer -= dt;
          if (d.waveTimer <= 0) { spawnWave(g); d.waveTimer = 1.6; }
        }

        // bullets
        d.bullets = d.bullets.filter(function (b) {
          b.x += b.vx * dt; b.y += b.vy * dt;
          return b.y > -20 && b.x > -20 && b.x < W + 20;
        });
        d.foeShots = d.foeShots.filter(function (b) {
          b.x += b.vx * dt; b.y += b.vy * dt;
          return b.y < H + 20 && b.x > -20 && b.x < W + 20;
        });

        // enemies
        for (var k = d.enemies.length - 1; k >= 0; k--) {
          var e = d.enemies[k];
          e.t += dt;
          e.y += e.vy * dt;
          if (e.kind === 'zig') e.x += Math.sin(e.t * 2.4) * 110 * dt;
          if (e.kind === 'tank') e.x += Math.sin(e.t * .8) * 50 * dt;
          e.x = U.clamp(e.x, 24, W - 24);

          e.cool -= dt;
          if (e.cool <= 0 && e.y > 0 && e.y < H - 120) {
            e.cool = U.rand(1.6, 3.6) / (1 + d.wave * .05);
            var ang = Math.atan2(s.y - e.y, s.x - e.x);
            var bs = 210 + d.wave * 6;
            d.foeShots.push({ x: e.x, y: e.y + e.r, vx: Math.cos(ang) * bs, vy: Math.sin(ang) * bs, r: 5 });
          }

          if (e.y > H + 50) { d.enemies.splice(k, 1); continue; }

          // hit by player bullet?
          for (var b = d.bullets.length - 1; b >= 0; b--) {
            var bl = d.bullets[b];
            if (U.dist(bl.x, bl.y, e.x, e.y) < e.r + bl.r) {
              d.bullets.splice(b, 1);
              e.hp--;
              boom(d, bl.x, bl.y, '#ffd257', 4);
              if (e.hp <= 0) {
                boom(d, e.x, e.y, e.kind === 'tank' ? '#fb7185' : '#22d3ee', 20);
                d.enemies.splice(k, 1);
                g.score += e.kind === 'tank' ? 120 : (e.kind === 'zig' ? 55 : 25);
                g.set('Score', U.fmt(g.score));
                d.shake = .5;
                Milo.sound.explode();
                if (Math.random() < .16) {
                  d.drops.push({ x: e.x, y: e.y, kind: Math.random() < .3 ? 'life' : 'gun' });
                }
              } else Milo.sound.hit();
              break;
            }
          }

          if (s.inv <= 0 && U.dist(s.x, s.y, e.x, e.y) < e.r + s.r) {
            d.enemies.splice(k, 1);
            boom(d, e.x, e.y, '#fb7185', 20);
            hurt(g);
          }
        }

        // enemy shots vs ship
        for (var f = d.foeShots.length - 1; f >= 0; f--) {
          var fs = d.foeShots[f];
          if (s.inv <= 0 && U.dist(s.x, s.y, fs.x, fs.y) < s.r + fs.r) {
            d.foeShots.splice(f, 1);
            hurt(g);
          }
        }

        // drops
        d.drops = d.drops.filter(function (p) {
          p.y += 120 * dt;
          if (p.y > H + 20) return false;
          if (U.dist(s.x, s.y, p.x, p.y) < 26) {
            Milo.sound.powerup();
            if (p.kind === 'life') { d.lives++; g.set('Lives', d.lives); }
            else { d.weapon = Math.min(3, d.weapon + 1); d.weaponT = 14; }
            g.score += 30;
            g.set('Score', U.fmt(g.score));
            return false;
          }
          return true;
        });

        d.parts = d.parts.filter(function (p) {
          p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
          return p.life > 0;
        });
      },

      draw: function (g) {
        var c = g.ctx, d = g.data, s = d.ship;
        c.fillStyle = '#04030f'; c.fillRect(0, 0, W, H);

        c.save();
        if (d.shake > 0) c.translate(U.rand(-1, 1) * d.shake * 4, U.rand(-1, 1) * d.shake * 4);

        d.stars.forEach(function (st) {
          c.globalAlpha = st.z;
          c.fillStyle = '#bcd0ff';
          c.fillRect(st.x, st.y, 1.6 * st.z + .4, 2.6 * st.z + .4);
        });
        c.globalAlpha = 1;

        d.drops.forEach(function (p) {
          var col = p.kind === 'life' ? '#fb7185' : '#34d399';
          c.shadowColor = col; c.shadowBlur = 16;
          c.fillStyle = col;
          U.roundRect(c, p.x - 12, p.y - 12, 24, 24, 7); c.fill();
          c.shadowBlur = 0;
          c.fillStyle = '#06122a';
          c.font = '800 14px Outfit, sans-serif'; c.textAlign = 'center';
          c.fillText(p.kind === 'life' ? '♥' : '▲', p.x, p.y + 5);
        });

        d.enemies.forEach(function (e) {
          var col = e.kind === 'tank' ? '#fb7185' : e.kind === 'zig' ? '#a78bfa' : '#22d3ee';
          c.shadowColor = col; c.shadowBlur = 12;
          c.fillStyle = col;
          c.beginPath();
          c.moveTo(e.x, e.y + e.r);
          c.lineTo(e.x - e.r, e.y - e.r * .7);
          c.lineTo(e.x, e.y - e.r * .25);
          c.lineTo(e.x + e.r, e.y - e.r * .7);
          c.closePath(); c.fill();
          c.shadowBlur = 0;
          c.fillStyle = 'rgba(255,255,255,.85)';
          c.beginPath(); c.arc(e.x, e.y - e.r * .2, e.r * .22, 0, 7); c.fill();
        });

        c.fillStyle = '#ffe066';
        d.bullets.forEach(function (b) {
          c.shadowColor = '#ffe066'; c.shadowBlur = 10;
          U.roundRect(c, b.x - 2.5, b.y - 9, 5, 18, 2.5); c.fill();
        });
        c.shadowBlur = 0;

        c.fillStyle = '#ff5b7f';
        d.foeShots.forEach(function (b) {
          c.shadowColor = '#ff5b7f'; c.shadowBlur = 10;
          c.beginPath(); c.arc(b.x, b.y, b.r, 0, 7); c.fill();
        });
        c.shadowBlur = 0;

        // ship
        if (s.inv <= 0 || Math.floor(g.t * 12) % 2 === 0) {
          c.save();
          c.translate(s.x, s.y);
          c.fillStyle = '#ff9d3c';
          c.beginPath();
          c.moveTo(-6, 14); c.lineTo(0, 14 + 10 + Math.random() * 8); c.lineTo(6, 14);
          c.closePath(); c.fill();
          c.shadowColor = '#7c5cff'; c.shadowBlur = 16;
          c.fillStyle = '#e9eeff';
          c.beginPath();
          c.moveTo(0, -18); c.lineTo(-14, 12); c.lineTo(0, 6); c.lineTo(14, 12);
          c.closePath(); c.fill();
          c.shadowBlur = 0;
          c.fillStyle = '#22d3ee';
          c.beginPath(); c.arc(0, -2, 4.5, 0, 7); c.fill();
          c.restore();
        }

        d.parts.forEach(function (p) {
          c.globalAlpha = Math.max(0, p.life / p.max);
          c.fillStyle = p.col;
          c.fillRect(p.x - 2, p.y - 2, 4, 4);
        });
        c.globalAlpha = 1;

        if (d.weapon > 1) {
          c.fillStyle = '#34d399';
          c.font = '700 12px Outfit, sans-serif';
          c.textAlign = 'left';
          c.fillText('WEAPON LV' + d.weapon + '  ' + d.weaponT.toFixed(1) + 's', 14, H - 16);
        }
        c.restore();
      }
    });

    function hurt(g) {
      var d = g.data;
      d.lives--;
      d.ship.inv = 2.2;
      d.shake = 1;
      d.weapon = 1;
      g.set('Lives', Math.max(0, d.lives));
      Milo.sound.explode();
      boom(d, d.ship.x, d.ship.y, '#fff', 26);
      if (d.lives <= 0) {
        g.gameOver({ text: 'You survived to wave ' + d.wave + '.' });
      }
    }
  }

  window.Milo.register({
    id: 'astro-blaster', title: 'Astro Blaster', emo: '🚀', category: 'Action',
    tagline: 'Endless waves of alien attackers',
    description: 'Fly your ship, shoot down wave after wave of hostiles and dodge their ' +
      'return fire. Green power-ups upgrade your gun to spread and then to a four-way ' +
      'cannon; red ones give a spare life. Every wave is bigger and faster than the last.',
    controls: ['WASD / Arrows', 'Space fire', 'Mouse'],
    colors: ['#7c5cff', '#ec4899'],
    featured: true,
    tags: ['shooter', 'space', 'waves', 'action', 'high score'],
    mount: mount
  });
})();

<script>
/* ---- assets/js/games/ball-blast.js ---- */
/* Ball Blast — a cannon, bouncing numbered balls, and constant splitting. */
(function () {
  'use strict';
  var W = 720, H = 620, GROUND = H - 46;

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function reset(g) {
      var d = g.data;
      d.cannon = { x: W / 2, power: 1, cool: 0 };
      d.balls = [];
      d.shots = [];
      d.parts = [];
      d.drops = [];
      d.level = 1;
      d.spawnT = 0;
      d.lives = 3;
      spawnBall(d, U.rand(120, W - 120), 4);
      g.set('Score', 0);
      g.set('Power', 1);
      g.set('Lives', 3);
    }

    function spawnBall(d, x, tier, vx, vy) {
      var hp = Math.pow(2, tier) * (2 + d.level);
      d.balls.push({
        x: x, y: 90, r: 12 + tier * 9, tier: tier,
        hp: hp, max: hp,
        vx: vx == null ? U.rand(-90, 90) : vx,
        vy: vy == null ? 0 : vy,
        hue: 200 - tier * 34
      });
    }

    return Milo.arcade(host, {
      id: 'ball-blast',
      w: W, h: H, bg: '#0a0d24',
      stats: ['Score', 'Power', 'Lives'],
      touch: 'dpad',
      emo: '🔴',
      start: {
        title: 'Ball Blast',
        text: 'Your cannon fires non-stop. Move it left and right, break the balls ' +
          'before they reach you, and grab the coins they drop to upgrade your gun.',
        keys: ['← → or A D', 'Mouse / drag to move']
      },
      init: reset,

      onPointer: function (g, type, x) {
        g.data.cannon.x = U.clamp(x, 30, W - 30);
      },

      update: function (g, dt) {
        var d = g.data, i = g.input, cn = d.cannon;

        var sp = 460 * dt;
        if (i.down('left')) cn.x -= sp;
        if (i.down('right')) cn.x += sp;
        cn.x = U.clamp(cn.x, 30, W - 30);

        // The cannon fires automatically.
        cn.cool -= dt;
        if (cn.cool <= 0) {
          cn.cool = 0.085;
          d.shots.push({ x: cn.x, y: GROUND - 34, vy: -820, dmg: cn.power });
          Milo.sound.tone({ f: 900, f2: 1300, d: .03, v: .025, type: 'square' });
        }

        d.shots = d.shots.filter(function (s) {
          s.y += s.vy * dt;
          return s.y > -20;
        });

        // A steady trickle of new balls, faster as the level climbs.
        d.spawnT -= dt;
        if (d.spawnT <= 0) {
          d.spawnT = Math.max(2.2, 6 - d.level * .25);
          spawnBall(d, Math.random() < .5 ? 80 : W - 80, U.randInt(2, Math.min(5, 2 + Math.floor(d.level / 3))));
        }

        for (var b = d.balls.length - 1; b >= 0; b--) {
          var ball = d.balls[b];
          ball.vy += 620 * dt;
          ball.x += ball.vx * dt;
          ball.y += ball.vy * dt;

          if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
          if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
          if (ball.y + ball.r > GROUND) {
            ball.y = GROUND - ball.r;
            // Bigger balls bounce higher, which keeps them on screen.
            ball.vy = -(300 + ball.tier * 46);
          }

          // Hit the cannon?
          if (ball.y + ball.r > GROUND - 40 && Math.abs(ball.x - cn.x) < ball.r + 24) {
            d.balls.splice(b, 1);
            hitCannon(g);
            continue;
          }

          for (var s = d.shots.length - 1; s >= 0; s--) {
            var sh = d.shots[s];
            if (U.dist(sh.x, sh.y, ball.x, ball.y) < ball.r + 4) {
              d.shots.splice(s, 1);
              ball.hp -= sh.dmg;
              d.parts.push({ x: sh.x, y: sh.y, vx: U.rand(-60, 60), vy: U.rand(-120, -30), life: .25, max: .25, col: '#ffd257' });
              if (ball.hp <= 0) {
                d.balls.splice(b, 1);
                g.score += ball.max;
                g.set('Score', U.fmt(g.score));
                Milo.sound.tone({ f: 300 + ball.tier * 60, f2: 160, d: .1, v: .07, type: 'square' });
                pop(d, ball);
                if (ball.tier > 1) {
                  spawnSplit(d, ball, -1);
                  spawnSplit(d, ball, 1);
                }
                if (Math.random() < .4) {
                  d.drops.push({ x: ball.x, y: ball.y, vy: 40, kind: 'coin' });
                }
                // Level up on total score, which paces the difficulty.
                var want = 1 + Math.floor(g.score / 900);
                if (want > d.level) { d.level = want; Milo.sound.powerup(); }
              }
              break;
            }
          }
        }

        d.drops = d.drops.filter(function (p) {
          p.vy += 340 * dt;
          p.y += p.vy * dt;
          if (p.y > GROUND - 10) { p.y = GROUND - 10; p.vy = 0; p.rest = (p.rest || 0) + dt; }
          if (U.dist(p.x, p.y, cn.x, GROUND - 24) < 34) {
            d.cannon.power++;
            g.set('Power', d.cannon.power);
            g.score += 30;
            g.set('Score', U.fmt(g.score));
            Milo.sound.coin();
            return false;
          }
          return (p.rest || 0) < 7;
        });

        d.parts = d.parts.filter(function (p) {
          p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 560 * dt; p.life -= dt;
          return p.life > 0;
        });
      },

      draw: function (g) {
        var c = g.ctx, d = g.data, cn = d.cannon;
        var sky = c.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#161a44'); sky.addColorStop(1, '#080b20');
        c.fillStyle = sky; c.fillRect(0, 0, W, H);

        c.fillStyle = '#1d2450';
        c.fillRect(0, GROUND, W, H - GROUND);
        c.strokeStyle = '#22d3ee'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(0, GROUND); c.lineTo(W, GROUND); c.stroke();

        d.balls.forEach(function (b) {
          var frac = b.hp / b.max;
          c.shadowColor = 'hsl(' + b.hue + ',75%,55%)'; c.shadowBlur = 16;
          c.fillStyle = 'hsl(' + b.hue + ',72%,' + (34 + frac * 22) + '%)';
          c.beginPath(); c.arc(b.x, b.y, b.r, 0, 7); c.fill();
          c.shadowBlur = 0;
          c.fillStyle = 'rgba(255,255,255,.22)';
          c.beginPath(); c.arc(b.x - b.r * .3, b.y - b.r * .34, b.r * .3, 0, 7); c.fill();
          c.fillStyle = '#fff';
          c.font = '800 ' + Math.max(10, Math.min(17, b.r * .74)) + 'px Outfit, sans-serif';
          c.textAlign = 'center';
          c.fillText(U.fmtShort(Math.ceil(b.hp)), b.x, b.y + b.r * .26);
        });

        c.fillStyle = '#ffe066';
        d.shots.forEach(function (s) {
          c.shadowColor = '#ffe066'; c.shadowBlur = 8;
          U.roundRect(c, s.x - 2.5, s.y - 8, 5, 16, 2.5); c.fill();
        });
        c.shadowBlur = 0;

        d.drops.forEach(function (p) {
          c.shadowColor = '#ffd257'; c.shadowBlur = 14;
          c.fillStyle = '#ffd257';
          c.beginPath(); c.arc(p.x, p.y, 9, 0, 7); c.fill();
          c.shadowBlur = 0;
          c.fillStyle = '#7a5a00';
          c.font = '800 11px Outfit, sans-serif'; c.textAlign = 'center';
          c.fillText('+', p.x, p.y + 4);
        });

        // cannon
        c.save();
        c.translate(cn.x, GROUND);
        c.fillStyle = '#22d3ee';
        c.shadowColor = '#22d3ee'; c.shadowBlur = 16;
        U.roundRect(c, -22, -22, 44, 22, 6); c.fill();
        U.roundRect(c, -7, -38, 14, 20, 4); c.fill();
        c.shadowBlur = 0;
        c.fillStyle = '#0b1330';
        U.roundRect(c, -14, -16, 28, 9, 4); c.fill();
        c.restore();

        d.parts.forEach(function (p) {
          c.globalAlpha = Math.max(0, p.life / p.max);
          c.fillStyle = p.col;
          c.fillRect(p.x - 2, p.y - 2, 4, 4);
        });
        c.globalAlpha = 1;

        c.fillStyle = 'rgba(255,255,255,.4)';
        c.font = '600 12px Outfit, sans-serif';
        c.textAlign = 'left';
        c.fillText('Level ' + d.level, 14, H - 14);
      }
    });

    function spawnSplit(d, ball, dir) {
      var tier = ball.tier - 1;
      var hp = Math.pow(2, tier) * (2 + d.level);
      d.balls.push({
        x: ball.x + dir * ball.r * .5, y: ball.y,
        r: 12 + tier * 9, tier: tier, hp: hp, max: hp,
        vx: dir * U.rand(70, 130), vy: -180,
        hue: 200 - tier * 34
      });
    }

    function pop(d, ball) {
      for (var i = 0; i < 16; i++) {
        var a = Math.random() * 6.28, s = U.rand(60, 260);
        d.parts.push({
          x: ball.x, y: ball.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: U.rand(.25, .55), max: .55, col: 'hsl(' + ball.hue + ',75%,60%)'
        });
      }
    }

    function hitCannon(g) {
      var d = g.data;
      d.lives--;
      d.cannon.power = Math.max(1, Math.floor(d.cannon.power * .6));
      g.set('Lives', Math.max(0, d.lives));
      g.set('Power', d.cannon.power);
      Milo.sound.explode();
      for (var i = 0; i < 24; i++) {
        var a = Math.random() * 6.28, s = U.rand(60, 300);
        d.parts.push({ x: d.cannon.x, y: GROUND - 20, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: U.rand(.3, .7), max: .7, col: U.choice(['#fff', '#22d3ee', '#fb7185']) });
      }
      if (d.lives <= 0) {
        g.gameOver({ text: 'You reached level ' + d.level + ' with a power-' + d.cannon.power + ' cannon.' });
      }
    }
  }

  window.Milo.register({
    id: 'ball-blast', title: 'Ball Blast', emo: '🔴', category: 'Action',
    tagline: 'Shoot the bouncing balls before they split into more',
    description: 'Your cannon fires by itself — all you do is move it. Each ball shows ' +
      'how much damage it can still take, and breaking one splits it into two smaller, ' +
      'faster ones. Coins dropped by broken balls upgrade your firepower, and letting a ' +
      'ball reach the cannon costs a life and half your power.',
    controls: ['← →', 'A D', 'Mouse / drag'],
    colors: ['#fb7185', '#ffd257'],
    tags: ['shooter', 'physics', 'upgrades', 'action'],
    mount: mount
  });
})();

<script>
/* ---- assets/js/games/neon-snake.js ---- */
/* Neon Snake — the classic, with a glow and a speed ramp. */
(function () {
  'use strict';
  var COLS = 24, ROWS = 16, CELL = 32;
  var W = COLS * CELL, H = ROWS * CELL;

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function reset(g) {
      var d = g.data;
      d.snake = [{ x: 6, y: 8 }, { x: 5, y: 8 }, { x: 4, y: 8 }];
      d.dir = { x: 1, y: 0 };
      d.queue = [];
      d.step = 0;
      d.interval = 0.13;
      d.grow = 0;
      d.parts = [];
      d.shake = 0;
      placeFood(d);
      g.set('Score', 0);
      g.set('Best', U.fmt(g.best));
      g.set('Length', d.snake.length);
    }

    function placeFood(d) {
      var free = [];
      for (var y = 0; y < ROWS; y++) {
        for (var x = 0; x < COLS; x++) {
          if (!d.snake.some(function (s) { return s.x === x && s.y === y; })) free.push({ x: x, y: y });
        }
      }
      d.food = free.length ? U.choice(free) : null;
      d.golden = Math.random() < 0.18;
    }

    function turn(d, x, y) {
      var last = d.queue.length ? d.queue[d.queue.length - 1] : d.dir;
      if (last.x === -x && last.y === -y) return;   // no instant reversal
      if (last.x === x && last.y === y) return;
      if (d.queue.length < 2) d.queue.push({ x: x, y: y });
    }

    return Milo.arcade(host, {
      id: 'neon-snake',
      w: W, h: H, bg: '#080b1d',
      stats: ['Score', 'Length', 'Best'],
      touch: 'dpad',
      emo: '🐍',
      start: {
        title: 'Neon Snake',
        text: 'Eat the glowing orbs, grow long, and don’t bite yourself. ' +
          'Gold orbs are worth triple.',
        keys: ['Arrows / WASD', 'Swipe on mobile']
      },
      init: reset,

      update: function (g, dt) {
        var d = g.data;
        var i = g.input;
        if (i.pressed('up')) turn(d, 0, -1);
        if (i.pressed('down')) turn(d, 0, 1);
        if (i.pressed('left')) turn(d, -1, 0);
        if (i.pressed('right')) turn(d, 1, 0);

        d.shake = Math.max(0, d.shake - dt * 4);
        d.parts = d.parts.filter(function (p) {
          p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
          p.vy += 240 * dt;
          return p.life > 0;
        });

        d.step += dt;
        if (d.step < d.interval) return;
        d.step -= d.interval;

        if (d.queue.length) d.dir = d.queue.shift();
        var head = d.snake[0];
        var nx = head.x + d.dir.x, ny = head.y + d.dir.y;

        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { crash(g); return; }
        // The tail tip moves away this tick, so it is safe to step onto.
        var body = d.grow > 0 ? d.snake : d.snake.slice(0, -1);
        if (body.some(function (s) { return s.x === nx && s.y === ny; })) { crash(g); return; }

        d.snake.unshift({ x: nx, y: ny });
        if (d.grow > 0) d.grow--; else d.snake.pop();

        if (d.food && nx === d.food.x && ny === d.food.y) {
          var pts = d.golden ? 30 : 10;
          g.score += pts;
          d.grow += d.golden ? 3 : 1;
          d.interval = Math.max(0.055, d.interval * 0.978);
          burst(d, nx, ny, d.golden ? '#ffd257' : '#22d3ee');
          d.shake = d.golden ? 1 : .5;
          if (d.golden) Milo.sound.powerup(); else Milo.sound.coin();
          placeFood(d);
          g.set('Score', U.fmt(g.score));
          g.set('Length', d.snake.length);
        }
      },

      draw: function (g) {
        var c = g.ctx, d = g.data;
        c.save();
        if (d.shake > 0) c.translate(U.rand(-1, 1) * d.shake * 3, U.rand(-1, 1) * d.shake * 3);

        // grid
        c.strokeStyle = 'rgba(120,140,255,.07)';
        c.lineWidth = 1;
        c.beginPath();
        for (var x = 0; x <= COLS; x++) { c.moveTo(x * CELL, 0); c.lineTo(x * CELL, H); }
        for (var y = 0; y <= ROWS; y++) { c.moveTo(0, y * CELL); c.lineTo(W, y * CELL); }
        c.stroke();

        // food
        if (d.food) {
          var pulse = 1 + Math.sin(g.t * 7) * .13;
          var fx = d.food.x * CELL + CELL / 2, fy = d.food.y * CELL + CELL / 2;
          var col = d.golden ? '#ffd257' : '#22d3ee';
          c.shadowColor = col; c.shadowBlur = 24;
          c.fillStyle = col;
          c.beginPath(); c.arc(fx, fy, CELL * .3 * pulse, 0, 7); c.fill();
          c.shadowBlur = 0;
          c.fillStyle = 'rgba(255,255,255,.75)';
          c.beginPath(); c.arc(fx - 3, fy - 3, CELL * .09, 0, 7); c.fill();
        }

        // snake
        for (var i = d.snake.length - 1; i >= 0; i--) {
          var s = d.snake[i];
          var f = i / Math.max(1, d.snake.length);
          var col2 = i === 0 ? '#a5ffd6' : 'hsl(' + (150 + f * 90) + ',85%,' + (62 - f * 18) + '%)';
          c.shadowColor = col2;
          c.shadowBlur = i === 0 ? 22 : 12;
          c.fillStyle = col2;
          var pad = i === 0 ? 2 : 3.5;
          U.roundRect(c, s.x * CELL + pad, s.y * CELL + pad,
            CELL - pad * 2, CELL - pad * 2, i === 0 ? 9 : 7);
          c.fill();
        }
        c.shadowBlur = 0;

        // eyes
        var hd = d.snake[0];
        if (hd) {
          var cx = hd.x * CELL + CELL / 2, cy = hd.y * CELL + CELL / 2;
          c.fillStyle = '#07240f';
          var px = d.dir.y !== 0 ? 5 : 3, py = d.dir.x !== 0 ? 5 : 3;
          c.beginPath();
          c.arc(cx + d.dir.x * 5 - px * .6, cy + d.dir.y * 5 - py * .6, 2.6, 0, 7);
          c.arc(cx + d.dir.x * 5 + px * .6, cy + d.dir.y * 5 + py * .6, 2.6, 0, 7);
          c.fill();
        }

        d.parts.forEach(function (p) {
          c.globalAlpha = Math.max(0, p.life / p.max);
          c.fillStyle = p.col;
          c.fillRect(p.x - 2, p.y - 2, 4, 4);
        });
        c.globalAlpha = 1;
        c.restore();
      }
    });

    function burst(d, gx, gy, col) {
      for (var i = 0; i < 16; i++) {
        var a = Math.random() * 6.28, sp = U.rand(50, 190);
        d.parts.push({
          x: gx * CELL + CELL / 2, y: gy * CELL + CELL / 2,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
          life: U.rand(.3, .7), max: .7, col: col
        });
      }
    }

    function crash(g) {
      g.data.shake = 1.6;
      Milo.sound.explode();
      g.gameOver({ text: 'You reached ' + g.data.snake.length + ' segments.' });
    }
  }

  window.Milo.register({
    id: 'neon-snake', title: 'Neon Snake', emo: '🐍', category: 'Arcade',
    tagline: 'Classic snake with a neon glow',
    description: 'Steer the snake around the grid, eat every orb you can and grow. ' +
      'Gold orbs are worth triple and add three segments. The snake speeds up with ' +
      'every bite — hitting a wall or your own body ends the run.',
    controls: ['Arrow keys', 'WASD', 'Touch pad'],
    colors: ['#22d3ee', '#0ea5e9'],
    tags: ['classic', 'snake', 'solo', 'high score'],
    mount: mount
  });
})();

</script>
<script>
/* ---- assets/js/games/brick-breaker.js ---- */
/* Brick Breaker — paddle, ball, power-ups and 12 escalating levels. */
(function () {
  'use strict';
  var W = 800, H = 560;
  var COLS = 11, ROWS = 7, BW = 62, BH = 24, GAP = 6;
  var LEFT = (W - (COLS * (BW + GAP) - GAP)) / 2, TOP = 70;
  var POWERS = [
    { k: 'wide', col: '#34d399', label: 'W' },
    { k: 'multi', col: '#22d3ee', label: 'M' },
    { k: 'slow', col: '#a78bfa', label: 'S' },
    { k: 'life', col: '#fb7185', label: '+' }
  ];

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function reset(g) {
      var d = g.data;
      d.level = 1;
      d.lives = 3;
      buildLevel(g);
      g.set('Score', 0);
      g.set('Lives', 3);
      g.set('Level', 1);
    }

    function buildLevel(g) {
      var d = g.data;
      d.bricks = [];
      var seed = d.level * 977;
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          var n = U.hash2(c, r, seed);
          if (d.level > 2 && n < 0.12) continue;              // gaps in later levels
          var hp = 1;
          if (n > 0.86 && d.level >= 3) hp = 3;
          else if (n > 0.62 && d.level >= 2) hp = 2;
          d.bricks.push({
            x: LEFT + c * (BW + GAP), y: TOP + r * (BH + GAP),
            w: BW, h: BH, hp: hp, max: hp,
            hue: 200 - r * 22
          });
        }
      }
      d.paddle = { x: W / 2 - 58, y: H - 42, w: 116, h: 14 };
      d.balls = [newBall(d)];
      d.drops = [];
      d.parts = [];
      d.wideT = 0; d.slowT = 0;
      d.stuck = true;
      d.shake = 0;
    }

    function newBall(d) {
      return { x: d.paddle.x + d.paddle.w / 2, y: d.paddle.y - 9, vx: 0, vy: 0, r: 8 };
    }

    function launch(d) {
      d.stuck = false;
      var sp = 340;
      d.balls.forEach(function (b) {
        if (b.vx === 0 && b.vy === 0) {
          var a = -Math.PI / 2 + U.rand(-.5, .5);
          b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
        }
      });
    }

    function burst(d, x, y, col, n) {
      for (var i = 0; i < (n || 12); i++) {
        var a = Math.random() * 6.28, s = U.rand(40, 220);
        d.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: U.rand(.25, .6), max: .6, col: col });
      }
    }

    return Milo.arcade(host, {
      id: 'brick-breaker',
      w: W, h: H, bg: '#0a0d20',
      stats: ['Score', 'Lives', 'Level'],
      emo: '🧱',
      start: {
        title: 'Brick Breaker',
        text: 'Clear every brick. Catch the falling capsules for a wider paddle, ' +
          'extra balls, slow motion or a spare life.',
        keys: ['← →  or  Mouse', 'Space to launch']
      },
      init: reset,

      onPointer: function (g, type, x) {
        var d = g.data;
        if (!d.paddle) return;
        d.paddle.x = U.clamp(x - d.paddle.w / 2, 0, W - d.paddle.w);
        if (type === 'down' && d.stuck) launch(d);
      },
      onKey: function (g, e) {
        if (e.code === 'Space' && g.data.stuck) launch(g.data);
      },

      update: function (g, dt) {
        var d = g.data, i = g.input;
        var pspeed = 620 * dt;
        if (i.down('left')) d.paddle.x -= pspeed;
        if (i.down('right')) d.paddle.x += pspeed;
        d.paddle.x = U.clamp(d.paddle.x, 0, W - d.paddle.w);

        d.wideT = Math.max(0, d.wideT - dt);
        d.slowT = Math.max(0, d.slowT - dt);
        d.shake = Math.max(0, d.shake - dt * 4);
        var targetW = d.wideT > 0 ? 176 : 116;
        d.paddle.w += (targetW - d.paddle.w) * Math.min(1, dt * 10);

        if (d.stuck) {
          d.balls[0].x = d.paddle.x + d.paddle.w / 2;
          d.balls[0].y = d.paddle.y - 9;
          if (i.pressed('action')) launch(d);
        }

        var tScale = d.slowT > 0 ? 0.55 : 1;

        d.balls.forEach(function (b) {
          if (d.stuck) return;
          b.x += b.vx * dt * tScale;
          b.y += b.vy * dt * tScale;

          if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); Milo.sound.click(); }
          if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); Milo.sound.click(); }
          if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); Milo.sound.click(); }

          // paddle
          var p = d.paddle;
          if (b.vy > 0 && b.y + b.r >= p.y && b.y - b.r <= p.y + p.h &&
            b.x >= p.x - b.r && b.x <= p.x + p.w + b.r) {
            b.y = p.y - b.r;
            // Bounce angle depends on where along the paddle it lands.
            var rel = U.clamp((b.x - (p.x + p.w / 2)) / (p.w / 2), -1, 1);
            var sp = Math.min(620, Math.hypot(b.vx, b.vy) * 1.015);
            var ang = -Math.PI / 2 + rel * 1.05;
            b.vx = Math.cos(ang) * sp;
            b.vy = Math.sin(ang) * sp;
            Milo.sound.tone({ f: 420, f2: 560, d: .06, v: .08, type: 'square' });
          }

          // bricks
          for (var k = d.bricks.length - 1; k >= 0; k--) {
            var br = d.bricks[k];
            if (b.x + b.r < br.x || b.x - b.r > br.x + br.w ||
              b.y + b.r < br.y || b.y - b.r > br.y + br.h) continue;

            // Reflect on whichever axis has the shallower overlap.
            var ox = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r));
            var oy = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
            if (ox < oy) b.vx = -b.vx; else b.vy = -b.vy;

            br.hp--;
            burst(d, b.x, b.y, 'hsl(' + br.hue + ',80%,62%)', br.hp <= 0 ? 14 : 6);
            d.shake = .4;
            if (br.hp <= 0) {
              d.bricks.splice(k, 1);
              g.score += 10 * d.level;
              Milo.sound.tone({ f: 700, f2: 900, d: .06, v: .08, type: 'square' });
              if (Math.random() < 0.14) {
                var pw = U.choice(POWERS);
                d.drops.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, k: pw.k, col: pw.col, label: pw.label });
              }
            } else {
              Milo.sound.tone({ f: 320, d: .05, v: .06, type: 'triangle' });
            }
            g.set('Score', U.fmt(g.score));
            break;
          }
        });

        // lost balls
        d.balls = d.balls.filter(function (b) { return b.y - b.r < H + 30; });
        if (!d.balls.length) {
          d.lives--;
          g.set('Lives', d.lives);
          Milo.sound.hit();
          if (d.lives <= 0) { g.gameOver({ text: 'You cleared ' + (d.level - 1) + ' full level' + (d.level - 1 === 1 ? '' : 's') + '.' }); return; }
          d.balls = [newBall(d)];
          d.stuck = true;
          d.wideT = 0; d.slowT = 0;
        }

        // power-up capsules
        d.drops = d.drops.filter(function (p) {
          p.y += 190 * dt;
          if (p.y > H + 20) return false;
          var pd = d.paddle;
          if (p.y > pd.y - 8 && p.y < pd.y + pd.h + 8 && p.x > pd.x - 12 && p.x < pd.x + pd.w + 12) {
            applyPower(g, p.k);
            return false;
          }
          return true;
        });

        d.parts = d.parts.filter(function (p) {
          p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 380 * dt; p.life -= dt;
          return p.life > 0;
        });

        if (!d.bricks.length) {
          d.level++;
          if (d.level > 12) {
            g.win({ score: g.score, text: 'You cleared all 12 levels. Outstanding.' });
            return;
          }
          g.set('Level', d.level);
          g.score += 100;
          g.set('Score', U.fmt(g.score));
          Milo.sound.win();
          buildLevel(g);
        }
      },

      draw: function (g) {
        var c = g.ctx, d = g.data;
        c.save();
        if (d.shake > 0) c.translate(U.rand(-1, 1) * d.shake * 2.5, U.rand(-1, 1) * d.shake * 2.5);

        d.bricks.forEach(function (b) {
          var lum = 40 + (b.hp / b.max) * 26;
          var grd = c.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
          grd.addColorStop(0, 'hsl(' + b.hue + ',80%,' + (lum + 14) + '%)');
          grd.addColorStop(1, 'hsl(' + b.hue + ',80%,' + lum + '%)');
          c.fillStyle = grd;
          U.roundRect(c, b.x, b.y, b.w, b.h, 5); c.fill();
          c.fillStyle = 'rgba(255,255,255,.20)';
          U.roundRect(c, b.x + 3, b.y + 3, b.w - 6, 5, 2.5); c.fill();
          if (b.max > 1) {
            c.fillStyle = 'rgba(255,255,255,.8)';
            c.font = '700 11px Outfit, sans-serif';
            c.textAlign = 'center';
            c.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 4);
          }
        });

        d.drops.forEach(function (p) {
          c.shadowColor = p.col; c.shadowBlur = 14;
          c.fillStyle = p.col;
          U.roundRect(c, p.x - 13, p.y - 8, 26, 16, 8); c.fill();
          c.shadowBlur = 0;
          c.fillStyle = '#08122a';
          c.font = '800 11px Outfit, sans-serif';
          c.textAlign = 'center';
          c.fillText(p.label, p.x, p.y + 4);
        });

        var p = d.paddle;
        var pg = c.createLinearGradient(p.x, 0, p.x + p.w, 0);
        pg.addColorStop(0, '#7c5cff'); pg.addColorStop(.5, '#22d3ee'); pg.addColorStop(1, '#7c5cff');
        c.shadowColor = '#22d3ee'; c.shadowBlur = 18;
        c.fillStyle = pg;
        U.roundRect(c, p.x, p.y, p.w, p.h, 7); c.fill();
        c.shadowBlur = 0;

        d.balls.forEach(function (b) {
          c.shadowColor = '#fff'; c.shadowBlur = 18;
          c.fillStyle = '#fff';
          c.beginPath(); c.arc(b.x, b.y, b.r, 0, 7); c.fill();
          c.shadowBlur = 0;
        });

        d.parts.forEach(function (q) {
          c.globalAlpha = Math.max(0, q.life / q.max);
          c.fillStyle = q.col;
          c.fillRect(q.x - 2, q.y - 2, 4, 4);
        });
        c.globalAlpha = 1;

        if (d.stuck) {
          c.fillStyle = 'rgba(255,255,255,.72)';
          c.font = '600 15px Outfit, sans-serif';
          c.textAlign = 'center';
          c.fillText('Press Space or click to launch', W / 2, H - 70);
        }
        if (d.slowT > 0 || d.wideT > 0) {
          c.textAlign = 'left';
          c.font = '700 12px Outfit, sans-serif';
          var yy = H - 96;
          if (d.wideT > 0) { c.fillStyle = '#34d399'; c.fillText('WIDE ' + d.wideT.toFixed(1) + 's', 14, yy); yy += 16; }
          if (d.slowT > 0) { c.fillStyle = '#a78bfa'; c.fillText('SLOW ' + d.slowT.toFixed(1) + 's', 14, yy); }
        }
        c.restore();
      }
    });

    function applyPower(g, k) {
      var d = g.data;
      Milo.sound.powerup();
      if (k === 'wide') d.wideT = 12;
      else if (k === 'slow') d.slowT = 9;
      else if (k === 'life') { d.lives++; g.set('Lives', d.lives); }
      else if (k === 'multi') {
        var src = d.balls[0];
        if (src && d.balls.length < 6) {
          for (var n = 0; n < 2; n++) {
            var a = Math.atan2(src.vy, src.vx) + (n ? .5 : -.5);
            var sp = Math.max(300, Math.hypot(src.vx, src.vy));
            d.balls.push({ x: src.x, y: src.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 8 });
          }
        }
      }
      g.score += 25;
      g.set('Score', window.Milo.util.fmt(g.score));
    }
  }

  window.Milo.register({
    id: 'brick-breaker', title: 'Brick Breaker', emo: '🧱', category: 'Arcade',
    tagline: 'Smash every brick across 12 levels',
    description: 'Bounce the ball off your paddle to clear the wall. Tougher bricks ' +
      'need two or three hits. Catch falling capsules for a wider paddle (W), extra ' +
      'balls (M), slow motion (S) or a spare life (+). Twelve levels, each busier than the last.',
    controls: ['← →', 'Mouse', 'Space to launch'],
    colors: ['#f472b6', '#7c5cff'],
    tags: ['classic', 'paddle', 'arkanoid', 'levels'],
    mount: mount
  });
})();

<script>
/* ---- assets/js/games/flap-rocket.js ---- */
/* Flap Rocket — one-button flyer through asteroid gates. */
(function () {
  'use strict';
  var W = 800, H = 560;
  var GAP = 175, PIPE_W = 78, SPACING = 260;

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function reset(g) {
      var d = g.data;
      d.y = H / 2; d.vy = 0; d.rot = 0;
      d.pipes = [];
      d.scroll = 0;
      d.speed = 200;
      d.parts = [];
      d.stars = [];
      d.passed = 0;
      d.dead = false;
      for (var i = 0; i < 70; i++) {
        d.stars.push({ x: Math.random() * W, y: Math.random() * H, z: U.rand(.2, 1) });
      }
      for (var k = 0; k < 4; k++) addPipe(d, W + 200 + k * SPACING);
      g.set('Score', 0);
      g.set('Best', U.fmt(g.best));
    }

    function addPipe(d, x) {
      var margin = 70;
      var gapY = U.rand(margin + GAP / 2, H - margin - GAP / 2);
      d.pipes.push({ x: x, gapY: gapY, scored: false, hue: U.randInt(180, 300) });
    }

    function flap(g) {
      if (g.state !== 'play' || g.data.dead) return;
      g.data.vy = -370;
      Milo.sound.tone({ f: 420, f2: 700, d: .09, v: .07, type: 'square' });
      for (var i = 0; i < 6; i++) {
        g.data.parts.push({
          x: 180, y: g.data.y + 10, vx: U.rand(-140, -40), vy: U.rand(-60, 60),
          life: .4, max: .4, col: U.choice(['#ffb020', '#ff7a45', '#fff'])
        });
      }
    }

    return Milo.arcade(host, {
      id: 'flap-rocket',
      w: W, h: H, bg: '#070b22',
      stats: ['Score', 'Best'],
      emo: '🚁',
      start: {
        title: 'Flap Rocket',
        text: 'Tap to fire the thruster and thread the rocket through the gates. ' +
          'One touch and it’s over.',
        keys: ['Space / Click / Tap']
      },
      init: reset,
      onPointer: function (g, type) { if (type === 'down') flap(g); },
      onKey: function (g, e) { if (e.code === 'Space' || e.code === 'ArrowUp') flap(g); },

      update: function (g, dt) {
        var d = g.data;
        if (g.input.pressed('up')) flap(g);

        d.vy += 1180 * dt;
        d.y += d.vy * dt;
        d.rot = U.clamp(d.vy / 700, -.6, 1.1);
        d.speed = Math.min(340, 200 + d.passed * 4);

        d.stars.forEach(function (s) {
          s.x -= d.speed * s.z * .5 * dt;
          if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
        });

        d.parts = d.parts.filter(function (p) {
          p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
          return p.life > 0;
        });

        // thruster trail
        if (g.frame % 2 === 0) {
          d.parts.push({
            x: 172, y: d.y + 6, vx: U.rand(-200, -110), vy: U.rand(-25, 25),
            life: .3, max: .3, col: U.choice(['#ffb020', '#ff7a45'])
          });
        }

        var rx = 180, ry = d.y, rr = 15;

        for (var i = d.pipes.length - 1; i >= 0; i--) {
          var p = d.pipes[i];
          p.x -= d.speed * dt;

          if (!p.scored && p.x + PIPE_W < rx) {
            p.scored = true;
            d.passed++;
            g.score++;
            g.set('Score', g.score);
            Milo.sound.coin();
          }

          // circle vs the two rectangles
          if (rx + rr > p.x && rx - rr < p.x + PIPE_W) {
            if (ry - rr < p.gapY - GAP / 2 || ry + rr > p.gapY + GAP / 2) { die(g); return; }
          }

          if (p.x < -PIPE_W - 40) {
            d.pipes.splice(i, 1);
            addPipe(d, d.pipes[d.pipes.length - 1].x + SPACING);
          }
        }

        if (d.y > H - 18 || d.y < 18) { die(g); return; }
      },

      draw: function (g) {
        var c = g.ctx, d = g.data;

        var sky = c.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#100a35');
        sky.addColorStop(1, '#050817');
        c.fillStyle = sky; c.fillRect(0, 0, W, H);

        d.stars.forEach(function (s) {
          c.globalAlpha = s.z * .8;
          c.fillStyle = '#cfe0ff';
          c.fillRect(s.x, s.y, 2 * s.z, 2 * s.z);
        });
        c.globalAlpha = 1;

        d.pipes.forEach(function (p) {
          var col = 'hsl(' + p.hue + ',70%,';
          [[0, p.gapY - GAP / 2], [p.gapY + GAP / 2, H]].forEach(function (seg) {
            var y0 = seg[0], y1 = seg[1];
            var grd = c.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
            grd.addColorStop(0, col + '38%)');
            grd.addColorStop(.4, col + '56%)');
            grd.addColorStop(1, col + '32%)');
            c.fillStyle = grd;
            U.roundRect(c, p.x, y0, PIPE_W, y1 - y0, 8); c.fill();
            c.fillStyle = col + '66%)';
            var capY = y0 === 0 ? y1 - 22 : y0;
            U.roundRect(c, p.x - 7, capY, PIPE_W + 14, 22, 6); c.fill();
          });
        });

        // rocket
        c.save();
        c.translate(180, d.y);
        c.rotate(d.rot);
        c.fillStyle = '#e8eeff';
        c.beginPath();
        c.moveTo(22, 0); c.lineTo(-6, -12); c.lineTo(-16, -8);
        c.lineTo(-16, 8); c.lineTo(-6, 12);
        c.closePath(); c.fill();
        c.fillStyle = '#ff4d6d';
        c.beginPath();
        c.moveTo(-4, -11); c.lineTo(-18, -20); c.lineTo(-14, -6);
        c.closePath(); c.fill();
        c.beginPath();
        c.moveTo(-4, 11); c.lineTo(-18, 20); c.lineTo(-14, 6);
        c.closePath(); c.fill();
        c.fillStyle = '#22d3ee';
        c.beginPath(); c.arc(4, 0, 5, 0, 7); c.fill();
        c.restore();

        d.parts.forEach(function (p) {
          c.globalAlpha = Math.max(0, p.life / p.max);
          c.fillStyle = p.col;
          c.beginPath(); c.arc(p.x, p.y, 3.2 * (p.life / p.max) + 1, 0, 7); c.fill();
        });
        c.globalAlpha = 1;

        c.fillStyle = 'rgba(255,255,255,.10)';
        c.fillRect(0, H - 12, W, 12);
      }
    });

    function die(g) {
      if (g.data.dead) return;
      g.data.dead = true;
      Milo.sound.explode();
      for (var i = 0; i < 30; i++) {
        var a = Math.random() * 6.28, s = U.rand(60, 320);
        g.data.parts.push({
          x: 180, y: g.data.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: U.rand(.3, .8), max: .8, col: U.choice(['#ffb020', '#ff4d6d', '#fff'])
        });
      }
      g.gameOver({ text: 'You cleared ' + g.score + ' gate' + (g.score === 1 ? '' : 's') + '.' });
    }
  }

  window.Milo.register({
    id: 'flap-rocket', title: 'Flap Rocket', emo: '🚁', category: 'Arcade',
    tagline: 'One-button flying through tight gates',
    description: 'Tap, click or press Space to fire the thruster. Gravity does the rest. ' +
      'Fly through the gap in every gate — the gates come faster the further you get, ' +
      'and a single scrape ends the run.',
    controls: ['Space', 'Click', 'Tap'],
    colors: ['#ff7a45', '#ffb020'],
    tags: ['one button', 'flappy', 'reflex', 'high score'],
    mount: mount
  });
})();

</script>
<script>
/* ---- assets/js/games/sky-hopper.js ---- */
/* Sky Hopper — bounce endlessly up a tower of platforms. */
(function () {
  'use strict';
  var W = 480, H = 720;

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function reset(g) {
      var d = g.data;
      d.p = { x: W / 2, y: H - 140, vx: 0, vy: -700, r: 17 };
      d.plats = [];
      d.height = 0;
      d.camY = 0;
      d.parts = [];
      d.clouds = [];
      for (var i = 0; i < 8; i++) {
        d.clouds.push({ x: Math.random() * W, y: Math.random() * H, s: U.rand(.5, 1.3) });
      }
      // A wide starting platform, then a climbing ladder of them.
      d.plats.push({ x: W / 2 - 60, y: H - 90, w: 120, kind: 'solid', t: 0 });
      var y = H - 190;
      while (y > -600) {
        addPlat(d, y);
        y -= U.rand(66, 96);
      }
      g.set('Height', 0);
      g.set('Best', U.fmt(g.best));
    }

    function addPlat(d, y) {
      var r = Math.random();
      var kind = 'solid';
      var diff = Math.min(1, d.height / 4000);
      if (r < .13 + diff * .16) kind = 'moving';
      else if (r < .20 + diff * .22) kind = 'crumble';
      else if (r < .24 + diff * .06) kind = 'spring';
      var w = U.rand(62, 96) - diff * 16;
      d.plats.push({
        x: U.rand(6, W - w - 6), y: y, w: w, kind: kind, t: Math.random() * 6,
        dir: Math.random() < .5 ? -1 : 1, gone: false
      });
    }

    return Milo.arcade(host, {
      id: 'sky-hopper',
      w: W, h: H, bg: '#0a1030',
      stats: ['Height', 'Best'],
      touch: 'dpad',
      emo: '🦘',
      start: {
        title: 'Sky Hopper',
        text: 'Bounce your way up. Green pads launch you higher, orange ones ' +
          'crumble the moment you leave them. Falling off the bottom ends it.',
        keys: ['← →  or  A D', 'Tilt your aim, gravity does the rest']
      },
      init: reset,
      onPointer: function (g, type, x) {
        // Touch/mouse steering: the pointer's side of centre sets the lean.
        g.data.lean = x < W / 2 ? -1 : 1;
        if (type === 'up') g.data.lean = 0;
      },

      update: function (g, dt) {
        var d = g.data, p = d.p, i = g.input;

        var lean = (i.down('right') ? 1 : 0) - (i.down('left') ? 1 : 0);
        if (!lean && d.lean) lean = d.lean;
        p.vx += lean * 1700 * dt;
        p.vx *= Math.pow(0.0016, dt);
        p.vx = U.clamp(p.vx, -420, 420);

        p.vy += 1500 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        // wrap horizontally
        if (p.x < -p.r) p.x = W + p.r;
        if (p.x > W + p.r) p.x = -p.r;

        // camera follows only upward
        var target = p.y - H * 0.42;
        if (target < d.camY) d.camY = target;
        var h = Math.max(0, Math.floor((H - 140 - p.y) / 10));
        if (h > d.height) {
          d.height = h;
          g.score = h;
          g.set('Height', U.fmt(h));
        }

        d.plats.forEach(function (pl) {
          pl.t += dt;
          if (pl.kind === 'moving') {
            pl.x += pl.dir * 92 * dt;
            if (pl.x < 4) { pl.x = 4; pl.dir = 1; }
            if (pl.x + pl.w > W - 4) { pl.x = W - 4 - pl.w; pl.dir = -1; }
          }
          if (pl.fading != null) pl.fading -= dt;
        });

        // Land only while falling, and only from above the pad.
        if (p.vy > 0) {
          for (var k = 0; k < d.plats.length; k++) {
            var pl = d.plats[k];
            if (pl.gone) continue;
            var top = pl.y;
            if (p.y + p.r >= top && p.y + p.r <= top + 22 &&
              p.x > pl.x - p.r * .6 && p.x < pl.x + pl.w + p.r * .6) {
              if (pl.kind === 'spring') {
                p.vy = -1180;
                Milo.sound.tone({ f: 300, f2: 1100, d: .2, v: .1, type: 'square' });
              } else {
                p.vy = -740;
                Milo.sound.tone({ f: 520, f2: 700, d: .06, v: .06, type: 'triangle' });
              }
              puff(d, p.x, top);
              if (pl.kind === 'crumble') { pl.gone = true; pl.fading = .35; }
              break;
            }
          }
        }

        // Recycle platforms that scrolled off the bottom.
        var lowest = 1e9;
        d.plats = d.plats.filter(function (pl) {
          if (pl.fading != null && pl.fading <= 0) return false;
          return pl.y < d.camY + H + 120;
        });
        d.plats.forEach(function (pl) { lowest = Math.min(lowest, pl.y); });
        while (lowest > d.camY - 420) {
          lowest -= U.rand(66, 96);
          addPlat(d, lowest);
        }

        d.parts = d.parts.filter(function (q) {
          q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 600 * dt; q.life -= dt;
          return q.life > 0;
        });

        if (p.y - d.camY > H + 80) {
          Milo.sound.lose();
          g.gameOver({ text: 'You climbed ' + U.fmt(d.height) + ' metres.' });
        }
      },

      draw: function (g) {
        var c = g.ctx, d = g.data;
        var sky = c.createLinearGradient(0, 0, 0, H);
        var deep = U.clamp(d.height / 3000, 0, 1);
        sky.addColorStop(0, 'hsl(' + (232 - deep * 30) + ',60%,' + (16 + deep * 6) + '%)');
        sky.addColorStop(1, 'hsl(' + (250 - deep * 20) + ',55%,' + (8 + deep * 4) + '%)');
        c.fillStyle = sky; c.fillRect(0, 0, W, H);

        c.save();
        c.translate(0, -d.camY);

        d.clouds.forEach(function (cl) {
          var y = ((cl.y - d.camY * .25) % (H + 200)) - 100 + d.camY;
          c.globalAlpha = .09;
          c.fillStyle = '#dfe8ff';
          c.beginPath(); c.ellipse(cl.x, y, 60 * cl.s, 22 * cl.s, 0, 0, 7); c.fill();
        });
        c.globalAlpha = 1;

        d.plats.forEach(function (pl) {
          var col = pl.kind === 'spring' ? '#34d399'
            : pl.kind === 'crumble' ? '#f59e0b'
              : pl.kind === 'moving' ? '#22d3ee' : '#7c5cff';
          c.globalAlpha = pl.fading != null ? Math.max(0, pl.fading / .35) : 1;
          c.shadowColor = col; c.shadowBlur = 12;
          c.fillStyle = col;
          U.roundRect(c, pl.x, pl.y, pl.w, 13, 6.5); c.fill();
          c.shadowBlur = 0;
          c.fillStyle = 'rgba(255,255,255,.28)';
          U.roundRect(c, pl.x + 3, pl.y + 2.5, pl.w - 6, 4, 2); c.fill();
          if (pl.kind === 'spring') {
            c.fillStyle = '#062d1e';
            c.font = '800 10px Outfit, sans-serif'; c.textAlign = 'center';
            c.fillText('▲▲', pl.x + pl.w / 2, pl.y + 10);
          }
          c.globalAlpha = 1;
        });

        d.parts.forEach(function (q) {
          c.globalAlpha = Math.max(0, q.life / q.max);
          c.fillStyle = q.col;
          c.beginPath(); c.arc(q.x, q.y, 3, 0, 7); c.fill();
        });
        c.globalAlpha = 1;

        var p = d.p;
        var squash = U.clamp(1 + p.vy / 2600, .78, 1.22);
        c.save();
        c.translate(p.x, p.y);
        c.scale(1 / squash, squash);
        c.shadowColor = '#ffd257'; c.shadowBlur = 20;
        c.fillStyle = '#ffd257';
        c.beginPath(); c.arc(0, 0, p.r, 0, 7); c.fill();
        c.shadowBlur = 0;
        c.fillStyle = '#3a2a05';
        c.beginPath();
        c.arc(-5.5, -3, 2.6, 0, 7);
        c.arc(5.5, -3, 2.6, 0, 7);
        c.fill();
        c.strokeStyle = '#3a2a05'; c.lineWidth = 1.8; c.lineCap = 'round';
        c.beginPath(); c.arc(0, 2, 6, .25, Math.PI - .25); c.stroke();
        c.restore();
        c.restore();
      }
    });

    function puff(d, x, y) {
      for (var i = 0; i < 8; i++) {
        var a = Math.random() * 3.14 + 3.14;
        d.parts.push({
          x: x, y: y, vx: Math.cos(a) * U.rand(30, 120), vy: Math.sin(a) * U.rand(20, 70),
          life: .35, max: .35, col: '#cfe0ff'
        });
      }
    }
  }

  window.Milo.register({
    id: 'sky-hopper', title: 'Sky Hopper', emo: '🦘', category: 'Arcade',
    tagline: 'Bounce up an endless tower',
    description: 'Every platform bounces you back up — you only have to steer. Green ' +
      'springs launch you much higher, cyan pads slide side to side, and orange pads ' +
      'crumble the instant you leave them. Fall off the bottom of the screen and it’s over.',
    controls: ['← →', 'A D', 'Touch left/right'],
    colors: ['#38bdf8', '#a78bfa'],
    tags: ['jumping', 'endless', 'reflex', 'high score'],
    mount: mount
  });
})();

</script>
<script>
/* ---- assets/js/games/dash-runner.js ---- */
/* Dash Runner — endless runner with jumps, slides and a rising tempo. */
(function () {
  'use strict';
  var W = 900, H = 460, GROUND = H - 78;

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function reset(g) {
      var d = g.data;
      d.p = { x: 130, y: GROUND, vy: 0, h: 52, ducking: false, jumps: 0 };
      d.speed = 420;
      d.obs = [];
      d.coins = [];
      d.parts = [];
      d.dist = 0;
      d.next = 300;
      d.nextCoin = 500;
      d.hills = [];
      for (var i = 0; i < 5; i++) d.hills.push({ x: i * 260, h: U.rand(40, 120) });
      g.set('Score', 0);
      g.set('Coins', 0);
      d.coinCount = 0;
    }

    function jump(g) {
      var d = g.data, p = d.p;
      if (p.jumps >= 2) return;
      p.vy = p.jumps === 0 ? -760 : -640;
      p.jumps++;
      Milo.sound.jump();
    }

    return Milo.arcade(host, {
      id: 'dash-runner',
      w: W, h: H, bg: '#0b1026',
      stats: ['Score', 'Coins'],
      emo: '🏃',
      touch: 'dpad',
      start: {
        title: 'Dash Runner',
        text: 'Run, jump and slide through everything in your way. You get a ' +
          'double jump — use it. Coins are worth 25 each.',
        keys: ['Space / ↑ jump', '↓ slide', 'Double-tap to double jump']
      },
      init: reset,
      onPointer: function (g, type, x, y) {
        if (type !== 'down') return;
        if (y > H * .62) g.data.p.ducking = true; else jump(g);
      },
      onKey: function (g, e) {
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jump(g);
      },

      update: function (g, dt) {
        var d = g.data, p = d.p, i = g.input;

        if (i.pressed('up')) jump(g);
        p.ducking = i.down('down') || (g.input.pdown && g.input.py > H * .62);
        p.h = p.ducking && p.y >= GROUND - 1 ? 28 : 52;

        d.speed = Math.min(900, 420 + d.dist * 0.028);
        d.dist += d.speed * dt;
        g.score = Math.floor(d.dist / 10) + d.coinCount * 25;
        g.set('Score', U.fmt(g.score));

        p.vy += 2100 * dt;
        p.y += p.vy * dt;
        if (p.y >= GROUND) { p.y = GROUND; p.vy = 0; p.jumps = 0; }

        d.hills.forEach(function (hl) {
          hl.x -= d.speed * .25 * dt;
          if (hl.x < -300) { hl.x += 5 * 260; hl.h = U.rand(40, 120); }
        });

        // spawn
        d.next -= d.speed * dt;
        if (d.next <= 0) {
          var gap = U.rand(260, 460) - Math.min(120, d.dist / 120);
          d.next = Math.max(170, gap);
          var kind = Math.random();
          if (kind < .45) d.obs.push({ x: W + 40, y: GROUND, w: 26, h: U.rand(34, 58), kind: 'block' });
          else if (kind < .72) d.obs.push({ x: W + 40, y: GROUND - 74, w: 60, h: 26, kind: 'bar' });
          else d.obs.push({ x: W + 40, y: GROUND, w: 54, h: 30, kind: 'spikes' });
        }
        d.nextCoin -= d.speed * dt;
        if (d.nextCoin <= 0) {
          d.nextCoin = U.rand(340, 700);
          var cy = Math.random() < .5 ? GROUND - 40 : GROUND - 130;
          for (var n = 0; n < 5; n++) d.coins.push({ x: W + 40 + n * 34, y: cy, t: n });
        }

        d.obs = d.obs.filter(function (o) { o.x -= d.speed * dt; return o.x > -120; });
        d.coins = d.coins.filter(function (o) { o.x -= d.speed * dt; return o.x > -60; });

        // player box
        var px = p.x - 15, py = p.y - p.h, pw = 30, ph = p.h;

        for (var k = 0; k < d.obs.length; k++) {
          var o = d.obs[k];
          var oy = o.kind === 'bar' ? o.y : o.y - o.h;
          if (px < o.x + o.w && px + pw > o.x && py < oy + o.h && py + ph > oy) {
            Milo.sound.explode();
            for (var b = 0; b < 24; b++) {
              var a = Math.random() * 6.28, s = U.rand(60, 300);
              d.parts.push({ x: p.x, y: p.y - 26, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: U.rand(.3, .7), max: .7, col: U.choice(['#22d3ee', '#fff', '#fb7185']) });
            }
            g.gameOver({ text: 'You ran ' + U.fmt(Math.floor(d.dist / 10)) + ' m and grabbed ' + d.coinCount + ' coins.' });
            return;
          }
        }

        for (var m = d.coins.length - 1; m >= 0; m--) {
          var co = d.coins[m];
          if (U.dist(co.x, co.y, p.x, p.y - p.h / 2) < 30) {
            d.coins.splice(m, 1);
            d.coinCount++;
            g.set('Coins', d.coinCount);
            Milo.sound.coin();
            for (var q = 0; q < 6; q++) {
              var aa = Math.random() * 6.28;
              d.parts.push({ x: co.x, y: co.y, vx: Math.cos(aa) * 120, vy: Math.sin(aa) * 120, life: .3, max: .3, col: '#ffd257' });
            }
          }
        }

        d.parts = d.parts.filter(function (q2) {
          q2.x += q2.vx * dt; q2.y += q2.vy * dt; q2.vy += 700 * dt; q2.life -= dt;
          return q2.life > 0;
        });
      },

      draw: function (g) {
        var c = g.ctx, d = g.data, p = d.p;
        var sky = c.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#16123f'); sky.addColorStop(1, '#080a1e');
        c.fillStyle = sky; c.fillRect(0, 0, W, H);

        c.fillStyle = 'rgba(124,92,255,.16)';
        d.hills.forEach(function (hl) {
          c.beginPath();
          c.moveTo(hl.x - 130, GROUND);
          c.quadraticCurveTo(hl.x, GROUND - hl.h, hl.x + 130, GROUND);
          c.fill();
        });

        c.fillStyle = '#141a3d';
        c.fillRect(0, GROUND, W, H - GROUND);
        c.strokeStyle = 'rgba(34,211,238,.55)'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(0, GROUND); c.lineTo(W, GROUND); c.stroke();
        c.strokeStyle = 'rgba(124,92,255,.25)'; c.lineWidth = 1;
        c.beginPath();
        for (var x = -(d.dist % 60); x < W; x += 60) { c.moveTo(x, GROUND); c.lineTo(x - 26, H); }
        c.stroke();

        d.coins.forEach(function (co) {
          var bob = Math.sin(g.t * 5 + co.t) * 4;
          c.shadowColor = '#ffd257'; c.shadowBlur = 14;
          c.fillStyle = '#ffd257';
          c.beginPath(); c.ellipse(co.x, co.y + bob, 8, 10, 0, 0, 7); c.fill();
          c.shadowBlur = 0;
          c.fillStyle = '#8a6b00';
          c.font = '800 10px Outfit, sans-serif'; c.textAlign = 'center';
          c.fillText('$', co.x, co.y + bob + 4);
        });

        d.obs.forEach(function (o) {
          var oy = o.kind === 'bar' ? o.y : o.y - o.h;
          if (o.kind === 'spikes') {
            c.fillStyle = '#fb7185';
            c.shadowColor = '#fb7185'; c.shadowBlur = 12;
            c.beginPath();
            for (var s = 0; s < 3; s++) {
              c.moveTo(o.x + s * 18, o.y);
              c.lineTo(o.x + s * 18 + 9, o.y - o.h);
              c.lineTo(o.x + s * 18 + 18, o.y);
            }
            c.fill(); c.shadowBlur = 0;
          } else {
            var col = o.kind === 'bar' ? '#a78bfa' : '#22d3ee';
            c.shadowColor = col; c.shadowBlur = 12;
            c.fillStyle = col;
            U.roundRect(c, o.x, oy, o.w, o.h, 5); c.fill();
            c.shadowBlur = 0;
          }
        });

        // runner
        c.save();
        c.translate(p.x, p.y);
        var run = Math.sin(d.dist / 22) ;
        c.shadowColor = '#fff'; c.shadowBlur = 14;
        c.fillStyle = '#eef2ff';
        U.roundRect(c, -14, -p.h, 28, p.h, 9); c.fill();
        c.shadowBlur = 0;
        c.fillStyle = '#22d3ee';
        c.beginPath(); c.arc(4, -p.h + 12, 4, 0, 7); c.fill();
        if (p.y >= GROUND - 1) {
          c.strokeStyle = '#eef2ff'; c.lineWidth = 5; c.lineCap = 'round';
          c.beginPath();
          c.moveTo(-4, 0); c.lineTo(-4 + run * 10, 12);
          c.moveTo(6, 0); c.lineTo(6 - run * 10, 12);
          c.stroke();
        }
        c.restore();

        d.parts.forEach(function (q) {
          c.globalAlpha = Math.max(0, q.life / q.max);
          c.fillStyle = q.col;
          c.fillRect(q.x - 2.5, q.y - 2.5, 5, 5);
        });
        c.globalAlpha = 1;
      }
    });
  }

  window.Milo.register({
    id: 'dash-runner', title: 'Dash Runner', emo: '🏃', category: 'Arcade',
    tagline: 'Endless running, jumping and sliding',
    description: 'Sprint down a neon highway that never ends. Jump the blocks and ' +
      'spikes, slide under the bars, and grab every coin you can reach — each one is ' +
      'worth 25 points. You have a double jump, and the run gets faster the longer you last.',
    controls: ['Space jump', '↑ jump', '↓ slide', 'Tap top/bottom'],
    colors: ['#22d3ee', '#7c5cff'],
    tags: ['runner', 'endless', 'reflex', 'high score'],
    mount: mount
  });
})();

<script>
/* ---- assets/js/games/color-rush.js ---- */
/* Color Rush — match the ring colour to the gate before you hit it. */
(function () {
  'use strict';
  var W = 480, H = 700;
  var COLORS = ['#ff4d6d', '#22d3ee', '#ffd257', '#a78bfa'];
  var NAMES = ['Red', 'Cyan', 'Gold', 'Violet'];

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function reset(g) {
      var d = g.data;
      d.color = 0;
      d.ball = { x: W / 2, y: H - 130, r: 16 };
      d.gates = [];
      d.speed = 210;
      d.parts = [];
      d.combo = 0;
      d.passed = 0;
      for (var i = 0; i < 4; i++) addGate(d, -i * 210);
      g.set('Score', 0);
      g.set('Combo', 0);
      g.set('Best', U.fmt(g.best));
    }

    function addGate(d, y) {
      // Each gate is a ring of four coloured arcs; you must enter through the
      // arc that matches your current colour.
      d.gates.push({ y: y, rot: Math.random() * 6.28, spin: U.rand(-1.1, 1.1), scored: false });
    }

    function cycle(g, dir) {
      var d = g.data;
      d.color = (d.color + (dir || 1) + COLORS.length) % COLORS.length;
      Milo.sound.click();
    }

    return Milo.arcade(host, {
      id: 'color-rush',
      w: W, h: H, bg: '#080b1e',
      stats: ['Score', 'Combo', 'Best'],
      emo: '🎨',
      touchButtons: [{ key: 'action', label: 'SWAP' }],
      start: {
        title: 'Colour Rush',
        text: 'Your ball climbs through spinning rings. Switch colour so you pass ' +
          'through the matching quarter — anything else and you burst.',
        keys: ['Space / Click to swap colour', '← → for a specific colour']
      },
      init: reset,
      onPointer: function (g, type) { if (type === 'down') cycle(g, 1); },
      onKey: function (g, e) {
        if (e.code === 'Space') cycle(g, 1);
        if (e.code === 'ArrowLeft') cycle(g, -1);
        if (e.code === 'ArrowRight') cycle(g, 1);
      },

      update: function (g, dt) {
        var d = g.data;
        if (g.input.pressed('action')) cycle(g, 1);

        d.speed = Math.min(430, 210 + d.passed * 6);
        var by = d.ball.y;

        d.gates.forEach(function (gt) {
          gt.y += d.speed * dt;
          gt.rot += gt.spin * dt;

          if (!gt.scored && gt.y > by) {
            gt.scored = true;
            // Which quarter is facing up as the ball crosses?
            var seg = quarterAt(gt, d.ball.x, by);
            if (seg !== d.color) { burst(g); return; }
            d.passed++;
            d.combo++;
            g.score += 10 + d.combo * 2;
            g.set('Score', U.fmt(g.score));
            g.set('Combo', 'x' + d.combo);
            Milo.sound.tone({ f: 500 + d.combo * 22, d: .08, v: .07, type: 'square' });
            for (var i = 0; i < 12; i++) {
              var a = Math.random() * 6.28;
              d.parts.push({
                x: d.ball.x, y: by, vx: Math.cos(a) * U.rand(50, 200), vy: Math.sin(a) * U.rand(50, 200),
                life: .5, max: .5, col: COLORS[d.color]
              });
            }
          }
        });

        d.gates = d.gates.filter(function (gt) { return gt.y < H + 140; });
        while (d.gates.length < 4) {
          var top = Math.min.apply(null, d.gates.map(function (x) { return x.y; }));
          addGate(d, top - U.rand(180, 240));
        }

        d.parts = d.parts.filter(function (p) {
          p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
          return p.life > 0;
        });
      },

      draw: function (g) {
        var c = g.ctx, d = g.data;
        var sky = c.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#12103a'); sky.addColorStop(1, '#05060f');
        c.fillStyle = sky; c.fillRect(0, 0, W, H);

        d.gates.forEach(function (gt) {
          var R = 118, th = 20;
          c.lineWidth = th;
          for (var s = 0; s < 4; s++) {
            c.strokeStyle = COLORS[s];
            c.shadowColor = COLORS[s]; c.shadowBlur = 14;
            c.beginPath();
            c.arc(W / 2, gt.y, R, gt.rot + s * Math.PI / 2, gt.rot + (s + 1) * Math.PI / 2);
            c.stroke();
          }
          c.shadowBlur = 0;
        });

        d.parts.forEach(function (p) {
          c.globalAlpha = Math.max(0, p.life / p.max);
          c.fillStyle = p.col;
          c.beginPath(); c.arc(p.x, p.y, 3.5, 0, 7); c.fill();
        });
        c.globalAlpha = 1;

        var b = d.ball;
        c.shadowColor = COLORS[d.color]; c.shadowBlur = 26;
        c.fillStyle = COLORS[d.color];
        c.beginPath(); c.arc(b.x, b.y, b.r, 0, 7); c.fill();
        c.shadowBlur = 0;
        c.fillStyle = 'rgba(255,255,255,.55)';
        c.beginPath(); c.arc(b.x - 5, b.y - 5, 4.5, 0, 7); c.fill();

        c.fillStyle = 'rgba(255,255,255,.6)';
        c.font = '600 13px Outfit, sans-serif';
        c.textAlign = 'center';
        c.fillText(NAMES[d.color] + ' — tap to swap', W / 2, H - 60);

        // upcoming colour swatches
        for (var s2 = 0; s2 < 4; s2++) {
          c.globalAlpha = s2 === d.color ? 1 : .28;
          c.fillStyle = COLORS[s2];
          U.roundRect(c, W / 2 - 62 + s2 * 34, H - 42, 24, 10, 5); c.fill();
        }
        c.globalAlpha = 1;
      }
    });

    /** Which coloured quarter of the ring sits where the ball crosses it. */
    function quarterAt(gt, bx, by) {
      var ang = Math.atan2(by - gt.y, bx - W / 2) - gt.rot;
      ang = ((ang % 6.283185) + 6.283185) % 6.283185;
      return Math.floor(ang / (Math.PI / 2)) % 4;
    }

    function burst(g) {
      var d = g.data;
      Milo.sound.explode();
      for (var i = 0; i < 26; i++) {
        var a = Math.random() * 6.28, s = U.rand(60, 300);
        d.parts.push({
          x: d.ball.x, y: d.ball.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          life: U.rand(.3, .7), max: .7, col: U.choice(COLORS)
        });
      }
      g.gameOver({ text: 'Best combo this run: x' + d.combo + '.' });
    }
  }

  window.Milo.register({
    id: 'color-rush', title: 'Colour Rush', emo: '🎨', category: 'Arcade',
    tagline: 'Match your colour to the gate',
    description: 'Rings made of four coloured quarters spin toward you. Swap your ball ' +
      'to the colour of the quarter you are about to pass through — get it wrong and ' +
      'you burst. Every clean pass builds your combo, and the rings speed up as you go.',
    controls: ['Space swap', '← → pick colour', 'Tap'],
    colors: ['#ff4d6d', '#a78bfa'],
    tags: ['reflex', 'colour', 'timing', 'high score'],
    mount: mount
  });
})();

</script>
<script>
/* ---- assets/js/games/tower-stack.js ---- */
/* Tower Stack — time each drop; overhang gets sliced off. */
(function () {
  'use strict';
  var W = 480, H = 720, BASE_W = 220, BH = 32;

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function reset(g) {
      var d = g.data;
      d.stack = [{ x: (W - BASE_W) / 2, w: BASE_W, hue: 200 }];
      d.camY = 0;
      d.speed = 190;
      d.dir = 1;
      d.cur = { x: 0, w: BASE_W, hue: 210 };
      d.slices = [];
      d.perfect = 0;
      d.dropping = false;
      g.set('Height', 0);
      g.set('Perfect', 0);
      g.set('Best', U.fmt(g.best));
    }

    function levelY(d, i) {
      // Row 0 sits at the bottom; the tower grows upward.
      return H - 110 - i * BH;
    }

    function place(g) {
      var d = g.data;
      var top = d.stack[d.stack.length - 1];
      var cur = d.cur;
      var overlapL = Math.max(cur.x, top.x);
      var overlapR = Math.min(cur.x + cur.w, top.x + top.w);
      var w = overlapR - overlapL;

      if (w <= 0) {
        Milo.sound.explode();
        d.slices.push({ x: cur.x, y: levelY(d, d.stack.length), w: cur.w, hue: cur.hue, vy: 0, vx: 0 });
        g.gameOver({ text: 'Your tower reached ' + d.stack.length + ' blocks.' });
        return;
      }

      var off = Math.abs(cur.x - top.x);
      if (off < 4) {
        // Close enough counts as perfect: snap it and give the width back.
        w = top.w;
        overlapL = top.x;
        d.perfect++;
        g.score += 20 + d.perfect * 5;
        Milo.sound.powerup();
        g.set('Perfect', d.perfect);
      } else {
        d.perfect = 0;
        g.set('Perfect', 0);
        g.score += 10;
        Milo.sound.tone({ f: 420, f2: 300, d: .1, v: .08, type: 'triangle' });
        // The overhang falls away.
        var sliceX = cur.x < top.x ? cur.x : overlapR;
        var sliceW = cur.w - w;
        d.slices.push({
          x: sliceX, y: levelY(d, d.stack.length), w: sliceW, hue: cur.hue,
          vy: 0, vx: cur.x < top.x ? -60 : 60
        });
      }

      d.stack.push({ x: overlapL, w: w, hue: cur.hue });
      g.set('Height', d.stack.length - 1);
      g.score = Math.max(g.score, (d.stack.length - 1) * 10);
      d.speed = Math.min(520, 190 + d.stack.length * 9);
      d.dir = Math.random() < .5 ? 1 : -1;
      d.cur = { x: d.dir > 0 ? -w : W, w: w, hue: (d.stack.length * 24) % 360 };

      if (w < 8) {
        Milo.sound.lose();
        g.gameOver({ text: 'The tower got too thin at ' + (d.stack.length - 1) + ' blocks.' });
      }
    }

    return Milo.arcade(host, {
      id: 'tower-stack',
      w: W, h: H, bg: '#0a0d22',
      stats: ['Height', 'Perfect', 'Best'],
      emo: '🗼',
      touchButtons: [{ key: 'action', label: 'DROP' }],
      start: {
        title: 'Tower Stack',
        text: 'Drop each block right on top of the last one. Anything hanging over ' +
          'the edge is sliced off, so a sloppy drop makes the next one harder.',
        keys: ['Space / Click to drop']
      },
      init: reset,
      onPointer: function (g, type) { if (type === 'down') place(g); },
      onKey: function (g, e) { if (e.code === 'Space') place(g); },

      update: function (g, dt) {
        var d = g.data;
        if (g.input.pressed('action')) place(g);

        d.cur.x += d.dir * d.speed * dt;
        if (d.cur.x + d.cur.w > W) { d.cur.x = W - d.cur.w; d.dir = -1; }
        if (d.cur.x < 0) { d.cur.x = 0; d.dir = 1; }

        // Scroll once the tower climbs past the middle of the screen.
        var topY = levelY(d, d.stack.length);
        var want = Math.min(0, topY - H * 0.45);
        d.camY += (want - d.camY) * Math.min(1, dt * 6);

        d.slices = d.slices.filter(function (s) {
          s.vy += 1500 * dt;
          s.y += s.vy * dt;
          s.x += s.vx * dt;
          return s.y < H - d.camY + 200;
        });
      },

      draw: function (g) {
        var c = g.ctx, d = g.data;
        var sky = c.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#1a1550'); sky.addColorStop(1, '#070a1c');
        c.fillStyle = sky; c.fillRect(0, 0, W, H);

        c.save();
        c.translate(0, -d.camY);

        function block(x, y, w, hue, glow) {
          var grd = c.createLinearGradient(x, y, x, y + BH);
          grd.addColorStop(0, 'hsl(' + hue + ',72%,62%)');
          grd.addColorStop(1, 'hsl(' + hue + ',72%,46%)');
          if (glow) { c.shadowColor = 'hsl(' + hue + ',80%,60%)'; c.shadowBlur = 18; }
          c.fillStyle = grd;
          U.roundRect(c, x, y, w, BH - 3, 5); c.fill();
          c.shadowBlur = 0;
          c.fillStyle = 'rgba(255,255,255,.22)';
          U.roundRect(c, x + 3, y + 3, Math.max(0, w - 6), 5, 2.5); c.fill();
        }

        d.stack.forEach(function (b, i) { block(b.x, levelY(d, i), b.w, b.hue, false); });
        d.slices.forEach(function (s) {
          c.globalAlpha = .8;
          block(s.x, s.y, s.w, s.hue, false);
          c.globalAlpha = 1;
        });
        if (g.state === 'play' || g.state === 'start') {
          block(d.cur.x, levelY(d, d.stack.length), d.cur.w, d.cur.hue, true);
        }

        // guide line from the top of the stack
        var top = d.stack[d.stack.length - 1];
        c.strokeStyle = 'rgba(255,255,255,.16)';
        c.setLineDash([4, 6]); c.lineWidth = 1;
        c.beginPath();
        c.moveTo(top.x, levelY(d, d.stack.length - 1));
        c.lineTo(top.x, levelY(d, d.stack.length) - 4);
        c.moveTo(top.x + top.w, levelY(d, d.stack.length - 1));
        c.lineTo(top.x + top.w, levelY(d, d.stack.length) - 4);
        c.stroke();
        c.setLineDash([]);
        c.restore();

        if (d.perfect > 1) {
          c.fillStyle = '#ffd257';
          c.font = '800 22px Outfit, sans-serif';
          c.textAlign = 'center';
          c.fillText('PERFECT ×' + d.perfect, W / 2, 108);
        }
      }
    });
  }

  window.Milo.register({
    id: 'tower-stack', title: 'Tower Stack', emo: '🗼', category: 'Casual',
    tagline: 'One-tap tower building',
    description: 'A block slides back and forth above your tower. Tap to drop it. ' +
      'Whatever hangs over the edge is sliced away, so every sloppy drop leaves you ' +
      'a narrower target. Land it dead centre for a perfect — those keep your full width.',
    controls: ['Space', 'Click', 'Tap'],
    colors: ['#f59e0b', '#ef4444'],
    tags: ['one button', 'timing', 'stacking', 'relaxing'],
    mount: mount
  });
})();

</script>
