<script>
/* ---- assets/js/games/block-stacker.js ---- */
/* Block Stacker — falling-tetromino puzzler with hold, ghost and hard drop. */
(function () {
  'use strict';
  var COLS = 10, ROWS = 20, CELL = 28;
  var W = COLS * CELL + 200, H = ROWS * CELL + 20;
  var BX = 14, BY = 10;

  var SHAPES = {
    I: { cells: [[0, 1], [1, 1], [2, 1], [3, 1]], w: 4, col: '#22d3ee' },
    O: { cells: [[1, 0], [2, 0], [1, 1], [2, 1]], w: 4, col: '#ffd257' },
    T: { cells: [[1, 0], [0, 1], [1, 1], [2, 1]], w: 3, col: '#a78bfa' },
    S: { cells: [[1, 0], [2, 0], [0, 1], [1, 1]], w: 3, col: '#34d399' },
    Z: { cells: [[0, 0], [1, 0], [1, 1], [2, 1]], w: 3, col: '#fb7185' },
    J: { cells: [[0, 0], [0, 1], [1, 1], [2, 1]], w: 3, col: '#60a5fa' },
    L: { cells: [[2, 0], [0, 1], [1, 1], [2, 1]], w: 3, col: '#fb923c' }
  };
  var KEYS = Object.keys(SHAPES);

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function reset(g) {
      var d = g.data;
      d.grid = [];
      for (var y = 0; y < ROWS; y++) d.grid.push(new Array(COLS).fill(null));
      d.bag = [];
      d.next = takeFromBag(d);
      d.hold = null;
      d.canHold = true;
      d.lines = 0;
      d.level = 1;
      d.fall = 0;
      d.flash = [];
      d.dead = false;
      spawn(d);
      g.set('Score', 0);
      g.set('Lines', 0);
      g.set('Level', 1);
    }

    // 7-bag randomiser: every shape appears once before any repeats.
    function takeFromBag(d) {
      if (!d.bag.length) d.bag = U.shuffle(KEYS.slice());
      return d.bag.pop();
    }

    function spawn(d, key) {
      var k = key || d.next;
      if (!key) d.next = takeFromBag(d);
      var s = SHAPES[k];
      d.piece = {
        key: k,
        cells: s.cells.map(function (c) { return [c[0], c[1]]; }),
        size: s.w,
        x: Math.floor((COLS - s.w) / 2),
        y: -1,
        col: s.col
      };
      if (hits(d, d.piece, 0, 0)) d.dead = true;
    }

    function hits(d, p, dx, dy, cells) {
      var cs = cells || p.cells;
      for (var i = 0; i < cs.length; i++) {
        var x = p.x + cs[i][0] + dx, y = p.y + cs[i][1] + dy;
        if (x < 0 || x >= COLS || y >= ROWS) return true;
        if (y >= 0 && d.grid[y][x]) return true;
      }
      return false;
    }

    function rotate(d, dir) {
      var p = d.piece;
      if (p.key === 'O') return;
      var n = p.size - 1;
      var next = p.cells.map(function (c) {
        return dir > 0 ? [n - c[1], c[0]] : [c[1], n - c[0]];
      });
      // Wall kicks: try in place, then nudged one or two columns.
      var kicks = [0, -1, 1, -2, 2];
      for (var i = 0; i < kicks.length; i++) {
        if (!hits(d, p, kicks[i], 0, next)) {
          p.cells = next;
          p.x += kicks[i];
          Milo.sound.click();
          return;
        }
      }
    }

    function lock(g) {
      var d = g.data, p = d.piece;
      p.cells.forEach(function (c) {
        var y = p.y + c[1], x = p.x + c[0];
        if (y >= 0) d.grid[y][x] = p.col;
      });
      Milo.sound.tone({ f: 200, f2: 140, d: .08, v: .07, type: 'square' });

      var cleared = [];
      for (var y2 = ROWS - 1; y2 >= 0; y2--) {
        if (d.grid[y2].every(function (v) { return v; })) cleared.push(y2);
      }
      if (cleared.length) {
        cleared.forEach(function (y3) { d.grid.splice(y3, 1); d.grid.unshift(new Array(COLS).fill(null)); });
        d.lines += cleared.length;
        var table = [0, 100, 300, 500, 800];
        g.score += table[cleared.length] * d.level;
        d.level = 1 + Math.floor(d.lines / 10);
        d.flash.push({ t: .3, n: cleared.length });
        if (cleared.length === 4) Milo.sound.win(); else Milo.sound.powerup();
        g.set('Score', U.fmt(g.score));
        g.set('Lines', d.lines);
        g.set('Level', d.level);
      }
      d.canHold = true;
      spawn(d);
      if (d.dead) {
        g.gameOver({ text: 'You cleared ' + d.lines + ' line' + (d.lines === 1 ? '' : 's') + ' at level ' + d.level + '.' });
      }
    }

    function drop(g) {
      var d = g.data, n = 0;
      while (!hits(d, d.piece, 0, 1)) { d.piece.y++; n++; }
      g.score += n * 2;
      g.set('Score', U.fmt(g.score));
      Milo.sound.hit();
      lock(g);
    }

    function hold(g) {
      var d = g.data;
      if (!d.canHold) return;
      var prev = d.hold;
      d.hold = d.piece.key;
      d.canHold = false;
      if (prev) spawn(d, prev); else spawn(d);
      Milo.sound.blip();
    }

    return Milo.arcade(host, {
      id: 'block-stacker',
      w: W, h: H, bg: '#080b1c',
      stats: ['Score', 'Lines', 'Level'],
      touch: 'dpad',
      touchButtons: [{ key: 'b', label: 'ROT' }, { key: 'action', label: 'DROP' }],
      emo: '🟦',
      start: {
        title: 'Block Stacker',
        text: 'Fit the falling shapes together and clear full rows. Four rows at ' +
          'once is worth eight times a single.',
        keys: ['← → move', '↑ / X rotate', '↓ soft drop', 'Space hard drop', 'C hold']
      },
      init: reset,
      onKey: function (g, e) {
        var d = g.data;
        if (e.code === 'ArrowUp' || e.code === 'KeyX') rotate(d, 1);
        if (e.code === 'KeyZ' || e.code === 'ControlLeft') rotate(d, -1);
        if (e.code === 'Space') drop(g);
        if (e.code === 'KeyC' || e.code === 'ShiftLeft') hold(g);
        if (e.code === 'ArrowLeft' && !hits(d, d.piece, -1, 0)) d.piece.x--;
        if (e.code === 'ArrowRight' && !hits(d, d.piece, 1, 0)) d.piece.x++;
      },

      update: function (g, dt) {
        var d = g.data, i = g.input;
        if (d.dead) return;

        // Touch controls map onto the same actions as the keys.
        if (i.pressed('b')) rotate(d, 1);
        if (i.pressed('action')) drop(g);
        if (i.pressed('left') && !hits(d, d.piece, -1, 0)) d.piece.x--;
        if (i.pressed('right') && !hits(d, d.piece, 1, 0)) d.piece.x++;

        // Auto-repeat while a direction is held.
        d.rep = (d.rep || 0) - dt;
        if ((i.down('left') || i.down('right')) && d.rep <= 0) {
          var dx = i.down('left') ? -1 : 1;
          if (!hits(d, d.piece, dx, 0)) d.piece.x += dx;
          d.rep = 0.07;
        }
        if (!i.down('left') && !i.down('right')) d.rep = 0.16;

        var speed = Math.max(0.055, 0.62 - (d.level - 1) * 0.055);
        if (i.down('down')) speed = 0.035;

        d.fall += dt;
        if (d.fall >= speed) {
          d.fall = 0;
          if (!hits(d, d.piece, 0, 1)) {
            d.piece.y++;
            if (i.down('down')) { g.score++; g.set('Score', U.fmt(g.score)); }
          } else lock(g);
        }

        d.flash = d.flash.filter(function (f) { f.t -= dt; return f.t > 0; });
      },

      draw: function (g) {
        var c = g.ctx, d = g.data;
        c.fillStyle = '#080b1c'; c.fillRect(0, 0, W, H);

        // well
        c.fillStyle = '#0d1128';
        U.roundRect(c, BX - 4, BY - 4, COLS * CELL + 8, ROWS * CELL + 8, 8); c.fill();
        c.strokeStyle = 'rgba(124,92,255,.30)'; c.lineWidth = 1;
        c.beginPath();
        for (var x = 0; x <= COLS; x++) { c.moveTo(BX + x * CELL, BY); c.lineTo(BX + x * CELL, BY + ROWS * CELL); }
        for (var y = 0; y <= ROWS; y++) { c.moveTo(BX, BY + y * CELL); c.lineTo(BX + COLS * CELL, BY + y * CELL); }
        c.stroke();

        function cube(px, py, col, alpha) {
          c.globalAlpha = alpha == null ? 1 : alpha;
          c.fillStyle = col;
          U.roundRect(c, px + 1.5, py + 1.5, CELL - 3, CELL - 3, 4); c.fill();
          c.fillStyle = 'rgba(255,255,255,.26)';
          U.roundRect(c, px + 4, py + 4, CELL - 8, 5, 2); c.fill();
          c.globalAlpha = 1;
        }

        for (var gy = 0; gy < ROWS; gy++) {
          for (var gx = 0; gx < COLS; gx++) {
            if (d.grid[gy][gx]) cube(BX + gx * CELL, BY + gy * CELL, d.grid[gy][gx]);
          }
        }

        var p = d.piece;
        if (p) {
          // ghost
          var gy2 = 0;
          while (!hits(d, p, 0, gy2 + 1)) gy2++;
          p.cells.forEach(function (cc) {
            var yy = p.y + cc[1] + gy2;
            if (yy >= 0) cube(BX + (p.x + cc[0]) * CELL, BY + yy * CELL, p.col, .18);
          });
          p.cells.forEach(function (cc) {
            var yy = p.y + cc[1];
            if (yy >= 0) cube(BX + (p.x + cc[0]) * CELL, BY + yy * CELL, p.col);
          });
        }

        // side panel
        var PX = BX + COLS * CELL + 20;
        c.fillStyle = '#a8b0d8';
        c.font = '700 11px Outfit, sans-serif';
        c.textAlign = 'left';
        c.fillText('NEXT', PX, BY + 16);
        miniPiece(c, d.next, PX, BY + 26);
        c.fillStyle = '#a8b0d8';
        c.fillText('HOLD', PX, BY + 130);
        if (d.hold) miniPiece(c, d.hold, PX, BY + 140, !d.canHold);
        else {
          c.fillStyle = 'rgba(255,255,255,.14)';
          U.roundRect(c, PX, BY + 140, 92, 68, 8); c.fill();
        }

        c.fillStyle = '#737bab';
        c.font = '600 10px Outfit, sans-serif';
        var help = ['← → move', '↑ rotate', '↓ soft drop', 'Space drop', 'C hold'];
        help.forEach(function (t, i2) { c.fillText(t, PX, BY + 250 + i2 * 16); });

        d.flash.forEach(function (f) {
          c.globalAlpha = f.t / .3;
          c.fillStyle = f.n === 4 ? '#ffd257' : '#22d3ee';
          c.font = '800 26px Outfit, sans-serif';
          c.textAlign = 'center';
          c.fillText(f.n === 4 ? 'QUAD!' : f.n + ' LINE' + (f.n > 1 ? 'S' : ''), BX + COLS * CELL / 2, H / 2);
          c.globalAlpha = 1;
        });
      }
    });

    function miniPiece(c, key, px, py, dim) {
      var U2 = window.Milo.util;
      c.fillStyle = 'rgba(255,255,255,.06)';
      U2.roundRect(c, px, py, 92, 68, 8); c.fill();
      if (!key) return;
      var s = SHAPES[key], m = 16;
      var minX = Math.min.apply(null, s.cells.map(function (q) { return q[0]; }));
      var maxX = Math.max.apply(null, s.cells.map(function (q) { return q[0]; }));
      var minY = Math.min.apply(null, s.cells.map(function (q) { return q[1]; }));
      var maxY = Math.max.apply(null, s.cells.map(function (q) { return q[1]; }));
      var ox = px + (92 - (maxX - minX + 1) * m) / 2 - minX * m;
      var oy = py + (68 - (maxY - minY + 1) * m) / 2 - minY * m;
      c.globalAlpha = dim ? .35 : 1;
      s.cells.forEach(function (q) {
        c.fillStyle = s.col;
        U2.roundRect(c, ox + q[0] * m + 1, oy + q[1] * m + 1, m - 2, m - 2, 3);
        c.fill();
      });
      c.globalAlpha = 1;
    }
  }

  window.Milo.register({
    id: 'block-stacker', title: 'Block Stacker', emo: '🟦', category: 'Puzzle',
    tagline: 'Fit the falling shapes, clear the rows',
    description: 'Seven shapes fall one at a time — rotate and slide them to fill ' +
      'complete rows. A ghost shows exactly where the piece will land, you can hold a ' +
      'piece for later with C, and Space slams it straight down. Clearing four rows at ' +
      'once scores eight times a single row.',
    controls: ['← →', '↑ rotate', '↓ soft drop', 'Space hard drop', 'C hold'],
    colors: ['#22d3ee', '#a78bfa'],
    featured: true,
    tags: ['tetris-like', 'classic', 'blocks', 'puzzle'],
    mount: mount
  });
})();

</script>
<script>
/* ---- assets/js/games/g2048.js ---- */
/* 2048 — slide and merge to reach the 2048 tile (and keep going). */
(function () {
  'use strict';
  var N = 4;
  var TILE_COL = {
    2: ['#eee4da', '#776e65'], 4: ['#ede0c8', '#776e65'],
    8: ['#f2b179', '#fff'], 16: ['#f59563', '#fff'],
    32: ['#f67c5f', '#fff'], 64: ['#f65e3b', '#fff'],
    128: ['#edcf72', '#fff'], 256: ['#edcc61', '#fff'],
    512: ['#edc850', '#fff'], 1024: ['#edc53f', '#fff'],
    2048: ['#edc22e', '#fff']
  };

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;
    var board, cells = [];

    function build(g) {
      var wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:12px';

      board = document.createElement('div');
      board.style.cssText = 'position:relative;width:min(78vw,min(56vh,420px));' +
        'aspect-ratio:1;background:#1c2044;border-radius:14px;padding:10px;' +
        'display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px';

      cells = [];
      for (var i = 0; i < N * N; i++) {
        var c = document.createElement('div');
        c.style.cssText = 'border-radius:8px;display:grid;place-items:center;' +
          'font:800 clamp(14px,4.4vw,30px)/1 Outfit,sans-serif;background:rgba(255,255,255,.05);' +
          'transition:transform .1s ease';
        board.appendChild(c);
        cells.push(c);
      }

      var hint = document.createElement('div');
      hint.style.cssText = 'color:#a8b0d8;font-size:.86rem;text-align:center';
      hint.textContent = 'Arrow keys or WASD — or swipe. Equal tiles merge.';

      wrap.appendChild(board);
      wrap.appendChild(hint);
      g.root.innerHTML = '';
      g.root.appendChild(wrap);
    }

    function reset(g) {
      var d = g.data;
      d.grid = new Array(N * N).fill(0);
      d.won = false;
      d.paused = false;
      build(g);
      add(d); add(d);
      paint(g);
      g.set('Score', 0);
      g.set('Best', U.fmt(g.best));
      g.set('Top tile', 2);
    }

    function add(d) {
      var free = [];
      d.grid.forEach(function (v, i) { if (!v) free.push(i); });
      if (!free.length) return;
      d.grid[U.choice(free)] = Math.random() < 0.9 ? 2 : 4;
    }

    function paint(g) {
      var d = g.data;
      var top = 0;
      d.grid.forEach(function (v, i) {
        var c = cells[i];
        top = Math.max(top, v);
        if (!v) {
          c.textContent = '';
          c.style.background = 'rgba(255,255,255,.05)';
          c.style.color = 'transparent';
          c.style.boxShadow = 'none';
          return;
        }
        var pair = TILE_COL[v] || ['#3c3a32', '#fff'];
        c.textContent = v;
        c.style.background = pair[0];
        c.style.color = pair[1];
        c.style.fontSize = v >= 1024 ? 'clamp(11px,3.2vw,22px)' : v >= 128 ? 'clamp(13px,3.8vw,26px)' : '';
        c.style.boxShadow = v >= 128 ? '0 0 18px ' + pair[0] + '66' : 'none';
      });
      g.set('Top tile', top);
    }

    /** Slide+merge one line (already ordered from the moving edge). */
    function collapse(line) {
      var vals = line.filter(function (v) { return v; });
      var out = [], gained = 0;
      for (var i = 0; i < vals.length; i++) {
        if (vals[i] === vals[i + 1]) {
          out.push(vals[i] * 2);
          gained += vals[i] * 2;
          i++;
        } else out.push(vals[i]);
      }
      while (out.length < N) out.push(0);
      return { line: out, gained: gained };
    }

    function move(g, dir) {
      var d = g.data;
      if (g.state !== 'play' || d.paused) return;
      var before = d.grid.join(',');
      var gained = 0;

      for (var i = 0; i < N; i++) {
        var idx = [];
        for (var j = 0; j < N; j++) {
          if (dir === 'left') idx.push(i * N + j);
          else if (dir === 'right') idx.push(i * N + (N - 1 - j));
          else if (dir === 'up') idx.push(j * N + i);
          else idx.push((N - 1 - j) * N + i);
        }
        var r = collapse(idx.map(function (k) { return d.grid[k]; }));
        gained += r.gained;
        idx.forEach(function (k, n) { d.grid[k] = r.line[n]; });
      }

      if (d.grid.join(',') === before) return;

      g.score += gained;
      g.set('Score', U.fmt(g.score));
      if (gained) Milo.sound.tone({ f: 300 + Math.min(600, gained), d: .07, v: .07, type: 'square' });
      else Milo.sound.click();

      add(d);
      paint(g);

      if (!d.won && d.grid.indexOf(2048) !== -1) {
        d.won = true;
        // Reaching 2048 is a win, but it does not have to end the run — so
        // hold the board with a flag rather than moving to the 'over' state,
        // which would turn Space into "restart".
        d.paused = true;
        Milo.store.setBest('g2048', g.score);
        g.best = Milo.store.best('g2048');
        Milo.sound.win();
        g.overlay({
          emo: '🏅',
          title: 'You made 2048!',
          text: 'You can stop here — or carry on for 4096.',
          score: g.score,
          best: g.best,
          actions: [
            {
              label: 'Keep playing', primary: true,
              onClick: function () { d.paused = false; g.clearOverlay(); }
            },
            { label: 'New game', onClick: function () { g.restart(); } }
          ]
        });
        return;
      }
      if (stuck(d)) {
        g.gameOver({ text: 'No moves left. Top tile: ' + Math.max.apply(null, d.grid) + '.' });
      }
    }

    function stuck(d) {
      if (d.grid.indexOf(0) !== -1) return false;
      for (var y = 0; y < N; y++) {
        for (var x = 0; x < N; x++) {
          var v = d.grid[y * N + x];
          if (x < N - 1 && d.grid[y * N + x + 1] === v) return false;
          if (y < N - 1 && d.grid[(y + 1) * N + x] === v) return false;
        }
      }
      return true;
    }

    var runner = Milo.domGame(host, {
      id: 'g2048',
      stats: ['Score', 'Top tile', 'Best'],
      bg: '#12163a',
      emo: '🔢',
      start: {
        title: '2048',
        text: 'Slide the tiles. Two of the same number merge into one that is twice ' +
          'as big. Get to 2048 — then see how far past it you can go.',
        keys: ['Arrows / WASD', 'Swipe']
      },
      init: reset,
      onKey: function (g, e) {
        var map = {
          ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
          ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down'
        };
        if (map[e.code]) { e.preventDefault(); move(g, map[e.code]); }
      }
    });

    // Swipe support on the board itself.
    var sx = 0, sy = 0, tracking = false;
    function down(e) {
      var p = e.touches ? e.touches[0] : e;
      sx = p.clientX; sy = p.clientY; tracking = true;
    }
    function up(e) {
      if (!tracking) return;
      tracking = false;
      var p = e.changedTouches ? e.changedTouches[0] : e;
      var dx = p.clientX - sx, dy = p.clientY - sy;
      if (Math.hypot(dx, dy) < 26) return;
      if (Math.abs(dx) > Math.abs(dy)) move(runner.g, dx > 0 ? 'right' : 'left');
      else move(runner.g, dy > 0 ? 'down' : 'up');
    }
    host.addEventListener('touchstart', down, { passive: true });
    host.addEventListener('touchend', up);
    host.addEventListener('mousedown', down);
    host.addEventListener('mouseup', up);

    return runner;
  }

  window.Milo.register({
    id: 'g2048', title: '2048', emo: '🔢', category: 'Puzzle',
    tagline: 'Slide, merge, double',
    description: 'Every move slides all the tiles to one side. Two tiles with the same ' +
      'number merge into their sum, and a new tile appears after each move. Reaching ' +
      '2048 wins — but nothing stops you carrying on for 4096.',
    controls: ['Arrows', 'WASD', 'Swipe'],
    colors: ['#edc22e', '#f67c5f'],
    tags: ['numbers', 'classic', 'merge', 'brain'],
    mount: mount
  });
})();

</script>
<script>
/* ---- assets/js/games/minesweeper.js ---- */
/* Minesweeper — classic sweeping with flags, chording and a timer. */
(function () {
  'use strict';
  var COLS = 16, ROWS = 14, MINES = 38;
  var NUM_COL = ['', '#60a5fa', '#34d399', '#fb7185', '#a78bfa', '#fb923c', '#22d3ee', '#e2e8f0', '#94a3b8'];

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;
    var cellEls = [];

    function reset(g) {
      var d = g.data;
      d.mine = new Array(COLS * ROWS).fill(false);
      d.open = new Array(COLS * ROWS).fill(false);
      d.flag = new Array(COLS * ROWS).fill(false);
      d.count = new Array(COLS * ROWS).fill(0);
      d.placed = false;          // mines are laid after the first click
      d.time = 0;
      d.left = MINES;
      d.done = false;
      build(g);
      g.set('Mines', MINES);
      g.set('Time', '0:00');
      g.set('Best', bestTime() ? U.time(bestTime()) : '—');
    }

    function build(g) {
      var wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:10px';
      var grid = document.createElement('div');
      grid.style.cssText = 'display:grid;grid-template-columns:repeat(' + COLS + ',1fr);' +
        'gap:2px;background:#1b2046;padding:6px;border-radius:10px;' +
        'width:min(94vw,min(70vh*' + (COLS / ROWS) + ',640px))';
      cellEls = [];
      for (var i = 0; i < COLS * ROWS; i++) {
        var b = document.createElement('button');
        b.type = 'button';
        b.dataset.i = i;
        b.style.cssText = 'aspect-ratio:1;border:0;border-radius:4px;cursor:pointer;' +
          'background:#2b3167;color:#fff;font:800 clamp(9px,1.8vw,15px)/1 Outfit,sans-serif;' +
          'display:grid;place-items:center;padding:0;user-select:none;-webkit-user-select:none';
        grid.appendChild(b);
        cellEls.push(b);
      }
      var hint = document.createElement('div');
      hint.style.cssText = 'color:#a8b0d8;font-size:.84rem;text-align:center';
      hint.innerHTML = 'Click to reveal · Right-click (or long-press) to flag · ' +
        'Click a number with its flags placed to clear around it';
      wrap.appendChild(grid);
      wrap.appendChild(hint);
      g.root.innerHTML = '';
      g.root.appendChild(wrap);

      grid.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      grid.addEventListener('mousedown', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        var i = +b.dataset.i;
        if (e.button === 2) toggleFlag(g, i);
        else if (e.button === 0) click(g, i);
      });

      // Long-press flags on touch.
      var timer = null, moved = false;
      grid.addEventListener('touchstart', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        moved = false;
        var i = +b.dataset.i;
        timer = setTimeout(function () { timer = null; toggleFlag(g, i); }, 380);
      }, { passive: true });
      grid.addEventListener('touchmove', function () { moved = true; });
      grid.addEventListener('touchend', function (e) {
        var b = e.target.closest('button');
        if (timer) {
          clearTimeout(timer); timer = null;
          if (b && !moved) click(g, +b.dataset.i);
        }
        if (e.cancelable) e.preventDefault();
      });
    }

    /** Fastest clear, in seconds. Tracked separately: the engine's own best is
        a points score (higher is better), which is not a time. */
    function bestTime() { return Milo.store.get('best:minesweeper-time', 0) || 0; }

    function idx(x, y) { return y * COLS + x; }
    function around(i, fn) {
      var x = i % COLS, y = (i / COLS) | 0;
      for (var dy = -1; dy <= 1; dy++) {
        for (var dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          var nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
          fn(idx(nx, ny));
        }
      }
    }

    function place(d, safe) {
      // Keep the first click and its neighbours clear so it always opens up.
      var forbidden = [safe];
      around(safe, function (n) { forbidden.push(n); });
      var pool = [];
      for (var i = 0; i < COLS * ROWS; i++) if (forbidden.indexOf(i) === -1) pool.push(i);
      U.shuffle(pool);
      for (var m = 0; m < MINES; m++) d.mine[pool[m]] = true;
      for (var k = 0; k < COLS * ROWS; k++) {
        var n = 0;
        around(k, function (j) { if (d.mine[j]) n++; });
        d.count[k] = n;
      }
      d.placed = true;
    }

    function reveal(g, i) {
      var d = g.data;
      if (d.open[i] || d.flag[i]) return;
      d.open[i] = true;
      if (d.count[i] === 0 && !d.mine[i]) around(i, function (n) { reveal(g, n); });
    }

    function click(g, i) {
      var d = g.data;
      if (d.done || g.state !== 'play') return;
      if (!d.placed) place(d, i);

      if (d.open[i]) { chord(g, i); return; }
      if (d.flag[i]) return;

      if (d.mine[i]) {
        d.done = true;
        d.open[i] = true;
        paint(g, i);
        Milo.sound.explode();
        g.gameOver({ emo: '💣', title: 'Boom', text: 'You hit a mine.', score: 0 });
        return;
      }
      reveal(g, i);
      Milo.sound.click();
      paint(g);
      checkWin(g);
    }

    /** Clicking an open number clears its neighbours if enough flags are set. */
    function chord(g, i) {
      var d = g.data;
      if (!d.count[i]) return;
      var flags = 0;
      around(i, function (n) { if (d.flag[n]) flags++; });
      if (flags !== d.count[i]) return;
      var boom = false;
      around(i, function (n) {
        if (d.flag[n] || d.open[n]) return;
        if (d.mine[n]) boom = true;
        reveal(g, n);
      });
      if (boom) {
        d.done = true;
        paint(g);
        Milo.sound.explode();
        g.gameOver({ emo: '💣', title: 'Boom', text: 'A flag was in the wrong place.', score: 0 });
        return;
      }
      paint(g);
      checkWin(g);
    }

    function toggleFlag(g, i) {
      var d = g.data;
      if (d.done || d.open[i] || g.state !== 'play') return;
      d.flag[i] = !d.flag[i];
      d.left += d.flag[i] ? -1 : 1;
      g.set('Mines', d.left);
      Milo.sound.blip();
      paint(g);
    }

    function checkWin(g) {
      var d = g.data;
      for (var i = 0; i < COLS * ROWS; i++) {
        if (!d.mine[i] && !d.open[i]) return;
      }
      d.done = true;
      // Score is time taken, so a *lower* number is better — track it separately.
      var t = Math.round(d.time);
      var prev = bestTime();
      if (!prev || t < prev) Milo.store.set('best:minesweeper-time', t);
      g.set('Best', U.time(bestTime()));
      g.win({
        emo: '🚩', title: 'Field cleared!',
        text: 'You swept all ' + MINES + ' mines in ' + U.time(t) + '.',
        score: Math.max(0, 9999 - t)
      });
    }

    function paint(g, blownAt) {
      var d = g.data;
      for (var i = 0; i < COLS * ROWS; i++) {
        var b = cellEls[i];
        if (d.open[i]) {
          if (d.mine[i]) {
            b.textContent = '💥';
            b.style.background = i === blownAt ? '#fb7185' : '#4a2038';
          } else {
            b.textContent = d.count[i] || '';
            b.style.background = '#171c40';
            b.style.color = NUM_COL[d.count[i]] || '#fff';
          }
          b.style.cursor = 'default';
        } else if (d.flag[i]) {
          b.textContent = '🚩';
          b.style.background = '#333a72';
        } else {
          b.textContent = d.done && d.mine[i] ? '💣' : '';
          b.style.background = d.done && d.mine[i] ? '#3a2050' : '#2b3167';
        }
      }
    }

    return Milo.domGame(host, {
      id: 'minesweeper',
      stats: ['Mines', 'Time', 'Best'],
      bg: '#0f1330',
      emo: '💣',
      start: {
        title: 'Minesweeper',
        text: 'A ' + COLS + '×' + ROWS + ' field with ' + MINES + ' mines. Numbers tell ' +
          'you how many mines touch that square. Your first click is always safe.',
        keys: ['Click reveal', 'Right-click flag', 'Long-press flag']
      },
      init: reset,
      update: function (g, dt) {
        var d = g.data;
        if (d.done || !d.placed) return;
        d.time += dt;
        g.set('Time', U.time(d.time));
      }
    });
  }

  window.Milo.register({
    id: 'minesweeper', title: 'Minesweeper', emo: '💣', category: 'Puzzle',
    tagline: 'Find every mine without touching one',
    description: 'Reveal squares to uncover the field. Each number tells you how many ' +
      'of the eight neighbouring squares hide a mine — use that to work out where they ' +
      'are and flag them. Your first click is always safe, and clicking a number that ' +
      'already has enough flags around it clears the rest in one go.',
    controls: ['Click', 'Right-click flag', 'Long-press'],
    colors: ['#64748b', '#fb7185'],
    scoreLabel: 'pts',
    tags: ['logic', 'classic', 'brain', 'deduction'],
    mount: mount
  });
})();

</script>
<script>
/* ---- assets/js/games/slide-puzzle.js ---- */
/* Slide Puzzle — the classic 15-puzzle, always shuffled into a solvable state. */
(function () {
  'use strict';
  var N = 4;

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;
    var tiles = [];

    function reset(g) {
      var d = g.data;
      d.board = [];
      for (var i = 0; i < N * N - 1; i++) d.board.push(i + 1);
      d.board.push(0);                       // 0 is the empty slot
      d.moves = 0;
      d.time = 0;
      d.solved = false;
      shuffle(d);
      build(g);
      paint(g);
      g.set('Moves', 0);
      g.set('Time', '0:00');
      g.set('Best', g.best ? U.fmt(g.best) : '—');
    }

    /** Shuffle by walking the blank around, which can only reach solvable states. */
    function shuffle(d) {
      var blank = N * N - 1;
      for (var n = 0; n < 400; n++) {
        var opts = neighbours(blank);
        var pick = U.choice(opts);
        d.board[blank] = d.board[pick];
        d.board[pick] = 0;
        blank = pick;
      }
      // A shuffle that happens to land on solved would be a dull start.
      if (isSolved(d)) shuffle(d);
    }

    function neighbours(i) {
      var x = i % N, y = (i / N) | 0, out = [];
      if (x > 0) out.push(i - 1);
      if (x < N - 1) out.push(i + 1);
      if (y > 0) out.push(i - N);
      if (y < N - 1) out.push(i + N);
      return out;
    }

    function isSolved(d) {
      for (var i = 0; i < N * N - 1; i++) if (d.board[i] !== i + 1) return false;
      return true;
    }

    function build(g) {
      var wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:12px';
      var board = document.createElement('div');
      board.style.cssText = 'width:min(80vw,min(58vh,420px));aspect-ratio:1;background:#191d44;' +
        'border-radius:14px;padding:8px;display:grid;gap:8px;' +
        'grid-template-columns:repeat(' + N + ',1fr);grid-template-rows:repeat(' + N + ',1fr)';
      tiles = [];
      for (var i = 0; i < N * N; i++) {
        var b = document.createElement('button');
        b.type = 'button';
        b.dataset.i = i;
        b.style.cssText = 'border:0;border-radius:10px;cursor:pointer;padding:0;' +
          'font:800 clamp(16px,5vw,32px)/1 Outfit,sans-serif;display:grid;place-items:center;' +
          'transition:background .12s,transform .08s';
        board.appendChild(b);
        tiles.push(b);
      }
      board.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (b) tap(g, +b.dataset.i);
      });
      var hint = document.createElement('div');
      hint.style.cssText = 'color:#a8b0d8;font-size:.86rem';
      hint.textContent = 'Click a tile next to the gap — or use the arrow keys.';
      wrap.appendChild(board);
      wrap.appendChild(hint);
      g.root.innerHTML = '';
      g.root.appendChild(wrap);
    }

    function paint(g) {
      var d = g.data;
      d.board.forEach(function (v, i) {
        var b = tiles[i];
        if (!v) {
          b.textContent = '';
          b.style.background = 'rgba(255,255,255,.04)';
          b.style.cursor = 'default';
          return;
        }
        b.textContent = v;
        b.style.cursor = 'pointer';
        var right = v === i + 1;
        b.style.background = right
          ? 'linear-gradient(140deg,#34d399,#22d3ee)'
          : 'linear-gradient(140deg,#7c5cff,#4d8cff)';
        b.style.color = '#fff';
      });
    }

    function tap(g, i) {
      var d = g.data;
      if (g.state !== 'play' || d.solved) return;
      var blank = d.board.indexOf(0);
      if (neighbours(blank).indexOf(i) === -1) return;
      d.board[blank] = d.board[i];
      d.board[i] = 0;
      d.moves++;
      g.set('Moves', d.moves);
      Milo.sound.click();
      paint(g);
      if (isSolved(d)) {
        d.solved = true;
        // Fewer moves and less time is better, so score rewards efficiency.
        var score = Math.max(50, 4000 - d.moves * 10 - Math.round(d.time) * 5);
        g.win({
          emo: '🧩', title: 'Solved!',
          text: d.moves + ' moves in ' + U.time(d.time) + '.',
          score: score
        });
      }
    }

    /** Arrow keys slide the tile that would move *into* the gap. */
    function key(g, e) {
      var d = g.data;
      var blank = d.board.indexOf(0);
      var x = blank % N, y = (blank / N) | 0;
      var target = null;
      if (e.code === 'ArrowUp' || e.code === 'KeyW') { if (y < N - 1) target = blank + N; }
      if (e.code === 'ArrowDown' || e.code === 'KeyS') { if (y > 0) target = blank - N; }
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { if (x < N - 1) target = blank + 1; }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') { if (x > 0) target = blank - 1; }
      if (target != null) { e.preventDefault(); tap(g, target); }
    }

    return Milo.domGame(host, {
      id: 'slide-puzzle',
      stats: ['Moves', 'Time', 'Best'],
      bg: '#101433',
      emo: '🧩',
      start: {
        title: 'Slide Puzzle',
        text: 'Slide the numbered tiles into order, 1 to 15, with the gap ending ' +
          'bottom-right. Tiles turn green when they are home.',
        keys: ['Click a tile', 'Arrow keys']
      },
      init: reset,
      onKey: key,
      update: function (g, dt) {
        var d = g.data;
        if (d.solved) return;
        d.time += dt;
        g.set('Time', U.time(d.time));
      }
    });
  }

  window.Milo.register({
    id: 'slide-puzzle', title: 'Slide Puzzle', emo: '🧩', category: 'Puzzle',
    tagline: 'Get the 15 tiles back in order',
    description: 'The classic sliding tile puzzle. Only tiles next to the empty space ' +
      'can move, so getting a number home often means taking three others out of the way. ' +
      'Tiles glow green once they are in the right place. Solve it in fewer moves and ' +
      'less time for a higher score.',
    controls: ['Click a tile', 'Arrow keys'],
    colors: ['#7c5cff', '#34d399'],
    tags: ['classic', 'sliding', 'brain', 'logic'],
    mount: mount
  });
})();

</script>
<script>
/* ---- assets/js/games/lights-out.js ---- */
/* Lights Out — every tap flips a plus-shape; turn the whole grid off. */
(function () {
  'use strict';
  var N = 5;

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;
    var cells = [];

    function reset(g) {
      var d = g.data;
      d.level = d.level || 1;
      d.on = new Array(N * N).fill(false);
      d.moves = 0;
      d.done = false;
      // Generate by starting solved and applying random taps — always solvable.
      var taps = Math.min(14, 3 + d.level * 2);
      for (var i = 0; i < taps; i++) flip(d, U.randInt(0, N * N - 1));
      if (d.on.every(function (v) { return !v; })) flip(d, U.randInt(0, N * N - 1));
      build(g);
      paint(g);
      g.set('Level', d.level);
      g.set('Moves', 0);
      g.set('Best', g.best ? U.fmt(g.best) : '—');
    }

    function flip(d, i) {
      var x = i % N, y = (i / N) | 0;
      [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (o) {
        var nx = x + o[0], ny = y + o[1];
        if (nx < 0 || ny < 0 || nx >= N || ny >= N) return;
        var k = ny * N + nx;
        d.on[k] = !d.on[k];
      });
    }

    function build(g) {
      var wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:12px';
      var grid = document.createElement('div');
      grid.style.cssText = 'width:min(80vw,min(58vh,400px));aspect-ratio:1;display:grid;gap:9px;' +
        'grid-template-columns:repeat(' + N + ',1fr);grid-template-rows:repeat(' + N + ',1fr)';
      cells = [];
      for (var i = 0; i < N * N; i++) {
        var b = document.createElement('button');
        b.type = 'button';
        b.dataset.i = i;
        b.style.cssText = 'border:0;border-radius:12px;cursor:pointer;padding:0;' +
          'transition:background .14s,box-shadow .14s,transform .08s';
        grid.appendChild(b);
        cells.push(b);
      }
      grid.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (b) tap(g, +b.dataset.i);
      });
      var hint = document.createElement('div');
      hint.style.cssText = 'color:#a8b0d8;font-size:.86rem;text-align:center;max-width:34ch';
      hint.textContent = 'Tapping a light also flips the four around it. Turn them all off.';
      wrap.appendChild(grid);
      wrap.appendChild(hint);
      g.root.innerHTML = '';
      g.root.appendChild(wrap);
    }

    function paint(g) {
      g.data.on.forEach(function (v, i) {
        var b = cells[i];
        b.style.background = v ? 'linear-gradient(140deg,#ffd257,#f59e0b)' : '#1c2149';
        b.style.boxShadow = v ? '0 0 22px rgba(255,210,87,.55)' : 'inset 0 0 0 1px rgba(255,255,255,.05)';
      });
    }

    function tap(g, i) {
      var d = g.data;
      if (g.state !== 'play' || d.done) return;
      flip(d, i);
      d.moves++;
      g.set('Moves', d.moves);
      Milo.sound.blip();
      paint(g);
      if (d.on.every(function (v) { return !v; })) {
        d.done = true;
        Milo.sound.win();
        var earned = Math.max(20, 300 - d.moves * 8) * d.level;
        g.score += earned;
        d.level++;
        g.overlay({
          emo: '💡',
          title: 'Lights out!',
          text: 'Cleared in ' + d.moves + ' move' + (d.moves === 1 ? '' : 's') +
            ' — worth ' + U.fmt(earned) + ' points.',
          score: g.score,
          best: g.best,
          newBest: Milo.store.setBest('lights-out', g.score),
          actions: [
            { label: 'Next level →', primary: true, onClick: function () { nextLevel(g); } },
            { label: 'Start over', onClick: function () { g.data.level = 1; g.restart(); } }
          ]
        });
      }
    }

    function nextLevel(g) {
      g.clearOverlay();
      g.state = 'play';
      var keepScore = g.score;
      var keepLevel = g.data.level;
      reset(g);
      g.score = keepScore;
      g.data.level = keepLevel;
      g.set('Level', keepLevel);
      g.best = Milo.store.best('lights-out');
    }

    return Milo.domGame(host, {
      id: 'lights-out',
      stats: ['Level', 'Moves', 'Best'],
      bg: '#0d1130',
      emo: '💡',
      start: {
        title: 'Lights Out',
        text: 'Tap a light and it flips — along with the four lights touching it. ' +
          'Switch every light off to clear the level. Each level starts more tangled.',
        keys: ['Click / tap a light']
      },
      preload: function (g) { g.data.level = 1; },
      init: reset
    });
  }

  window.Milo.register({
    id: 'lights-out', title: 'Lights Out', emo: '💡', category: 'Puzzle',
    tagline: 'Switch off every light',
    description: 'A 5×5 grid of lights. Tapping one toggles it and its four neighbours, ' +
      'so undoing a mistake is rarely as simple as tapping again. Clear the board to move ' +
      'up a level — and the fewer moves you use, the more the level is worth.',
    controls: ['Click', 'Tap'],
    colors: ['#ffd257', '#f59e0b'],
    tags: ['logic', 'brain', 'levels', 'relaxing'],
    mount: mount
  });
})();

</script>
<script>
/* ---- assets/js/games/maze-runner.js ---- */
/* Maze Runner — generated mazes, lantern-lit, growing every level. */
(function () {
  'use strict';
  var W = 720, H = 560;

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function reset(g) {
      var d = g.data;
      d.level = d.level || 1;
      var size = Math.min(23, 9 + (d.level - 1) * 2);
      d.cols = size; d.rows = size;
      d.cell = Math.floor(Math.min((W - 40) / d.cols, (H - 40) / d.rows));
      d.ox = (W - d.cols * d.cell) / 2;
      d.oy = (H - d.rows * d.cell) / 2;
      generate(d);
      d.p = { x: 0, y: 0, px: 0, py: 0, moveT: 0 };
      d.exit = { x: d.cols - 1, y: d.rows - 1 };
      d.time = 0;
      d.steps = 0;
      d.trail = [];
      d.done = false;
      g.set('Level', d.level);
      g.set('Time', '0:00');
      g.set('Best', g.best ? U.fmt(g.best) : '—');
    }

    /** Recursive-backtracker maze. walls[i] is a 4-bit mask: N E S W. */
    function generate(d) {
      var n = d.cols * d.rows;
      d.walls = new Array(n).fill(15);
      var seen = new Array(n).fill(false);
      var stack = [0];
      seen[0] = true;
      var DIRS = [{ dx: 0, dy: -1, bit: 1, opp: 4 }, { dx: 1, dy: 0, bit: 2, opp: 8 },
      { dx: 0, dy: 1, bit: 4, opp: 1 }, { dx: -1, dy: 0, bit: 8, opp: 2 }];
      while (stack.length) {
        var cur = stack[stack.length - 1];
        var cx = cur % d.cols, cy = (cur / d.cols) | 0;
        var options = [];
        DIRS.forEach(function (dir) {
          var nx = cx + dir.dx, ny = cy + dir.dy;
          if (nx < 0 || ny < 0 || nx >= d.cols || ny >= d.rows) return;
          var ni = ny * d.cols + nx;
          if (!seen[ni]) options.push({ ni: ni, dir: dir });
        });
        if (!options.length) { stack.pop(); continue; }
        var pick = U.choice(options);
        d.walls[cur] &= ~pick.dir.bit;
        d.walls[pick.ni] &= ~pick.dir.opp;
        seen[pick.ni] = true;
        stack.push(pick.ni);
      }
    }

    function canMove(d, x, y, dx, dy) {
      var i = y * d.cols + x;
      if (dx === 1) return !(d.walls[i] & 2);
      if (dx === -1) return !(d.walls[i] & 8);
      if (dy === 1) return !(d.walls[i] & 4);
      if (dy === -1) return !(d.walls[i] & 1);
      return false;
    }

    function step(g, dx, dy) {
      var d = g.data, p = d.p;
      if (d.done || g.state !== 'play') return;
      var nx = p.x + dx, ny = p.y + dy;
      if (nx < 0 || ny < 0 || nx >= d.cols || ny >= d.rows) return;
      if (!canMove(d, p.x, p.y, dx, dy)) { Milo.sound.tone({ f: 120, d: .05, v: .05, type: 'square' }); return; }
      d.trail.push({ x: p.x, y: p.y, t: 1 });
      p.x = nx; p.y = ny;
      d.steps++;
      Milo.sound.tone({ f: 300 + Math.random() * 60, d: .04, v: .04, type: 'triangle' });

      if (p.x === d.exit.x && p.y === d.exit.y) {
        d.done = true;
        var earned = Math.max(50, 900 - Math.round(d.time) * 8) * d.level;
        g.score += earned;
        Milo.sound.win();
        d.level++;
        g.overlay({
          emo: '🏁',
          title: 'Level ' + (d.level - 1) + ' cleared',
          text: U.time(d.time) + ' · ' + d.steps + ' steps · +' + U.fmt(earned) + ' points',
          score: g.score,
          best: g.best,
          newBest: Milo.store.setBest('maze-runner', g.score),
          actions: [
            { label: 'Next maze →', primary: true, onClick: function () { nextLevel(g); } },
            { label: 'Start over', onClick: function () { g.data.level = 1; g.restart(); } }
          ]
        });
      }
    }

    function nextLevel(g) {
      g.clearOverlay();
      var keepScore = g.score, keepLevel = g.data.level;
      reset(g);
      g.data.level = keepLevel;
      g.score = keepScore;
      g.state = 'play';
      g.set('Level', keepLevel);
      g.best = Milo.store.best('maze-runner');
    }

    return Milo.arcade(host, {
      id: 'maze-runner',
      w: W, h: H, bg: '#070a1c',
      stats: ['Level', 'Time', 'Best'],
      touch: 'dpad',
      emo: '🌀',
      start: {
        title: 'Maze Runner',
        text: 'Find your way from the top-left corner to the glowing exit. Your ' +
          'lantern only lights the way so far — and every maze is bigger than the last.',
        keys: ['Arrow keys / WASD', 'Touch pad']
      },
      preload: function (g) { g.data.level = 1; },
      init: reset,
      onKey: function (g, e) {
        var m = {
          ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
          ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0]
        }[e.code];
        if (m) { e.preventDefault(); step(g, m[0], m[1]); }
      },

      update: function (g, dt) {
        var d = g.data;
        if (d.done) return;
        d.time += dt;
        g.set('Time', U.time(d.time));

        // Held direction auto-repeats so long corridors aren't tedious.
        d.rep = (d.rep || 0) - dt;
        if (d.rep <= 0) {
          var i = g.input;
          if (i.down('up')) { step(g, 0, -1); d.rep = .12; }
          else if (i.down('down')) { step(g, 0, 1); d.rep = .12; }
          else if (i.down('left')) { step(g, -1, 0); d.rep = .12; }
          else if (i.down('right')) { step(g, 1, 0); d.rep = .12; }
        }

        d.trail = d.trail.filter(function (t) { t.t -= dt * .5; return t.t > 0; });

        var p = d.p;
        p.px += (p.x - p.px) * Math.min(1, dt * 16);
        p.py += (p.y - p.py) * Math.min(1, dt * 16);
      },

      draw: function (g) {
        var c = g.ctx, d = g.data;
        c.fillStyle = '#070a1c'; c.fillRect(0, 0, W, H);
        var cs = d.cell, ox = d.ox, oy = d.oy;
        var p = d.p;
        var lightR = cs * (5.2 - Math.min(2.2, d.level * .16));

        // exit glow
        var ex = ox + d.exit.x * cs + cs / 2, ey = oy + d.exit.y * cs + cs / 2;
        var eg = c.createRadialGradient(ex, ey, 0, ex, ey, cs * 2.2);
        eg.addColorStop(0, 'rgba(52,211,153,.55)');
        eg.addColorStop(1, 'rgba(52,211,153,0)');
        c.fillStyle = eg;
        c.fillRect(ex - cs * 2.2, ey - cs * 2.2, cs * 4.4, cs * 4.4);

        d.trail.forEach(function (t) {
          c.globalAlpha = t.t * .3;
          c.fillStyle = '#7c5cff';
          c.fillRect(ox + t.x * cs + cs * .34, oy + t.y * cs + cs * .34, cs * .32, cs * .32);
        });
        c.globalAlpha = 1;

        // walls
        c.strokeStyle = '#4b57b8';
        c.lineWidth = Math.max(2, cs * .09);
        c.lineCap = 'round';
        c.beginPath();
        for (var y = 0; y < d.rows; y++) {
          for (var x = 0; x < d.cols; x++) {
            var w = d.walls[y * d.cols + x];
            var X = ox + x * cs, Y = oy + y * cs;
            if (w & 1) { c.moveTo(X, Y); c.lineTo(X + cs, Y); }
            if (w & 2) { c.moveTo(X + cs, Y); c.lineTo(X + cs, Y + cs); }
            if (w & 4) { c.moveTo(X, Y + cs); c.lineTo(X + cs, Y + cs); }
            if (w & 8) { c.moveTo(X, Y); c.lineTo(X, Y + cs); }
          }
        }
        c.stroke();

        // exit marker
        c.fillStyle = '#34d399';
        U.roundRect(c, ex - cs * .26, ey - cs * .26, cs * .52, cs * .52, cs * .12);
        c.fill();

        // player
        var px = ox + p.px * cs + cs / 2, py = oy + p.py * cs + cs / 2;
        c.shadowColor = '#ffd257'; c.shadowBlur = 22;
        c.fillStyle = '#ffd257';
        c.beginPath(); c.arc(px, py, cs * .27, 0, 7); c.fill();
        c.shadowBlur = 0;

        // lantern vignette — darkens everything outside the lit radius
        var vg = c.createRadialGradient(px, py, lightR * .35, px, py, lightR);
        vg.addColorStop(0, 'rgba(7,10,28,0)');
        vg.addColorStop(1, 'rgba(7,10,28,.94)');
        c.fillStyle = vg;
        c.fillRect(0, 0, W, H);
      }
    });
  }

  window.Milo.register({
    id: 'maze-runner', title: 'Maze Runner', emo: '🌀', category: 'Puzzle',
    tagline: 'Escape mazes by lantern-light',
    description: 'Start top-left, reach the green exit bottom-right. Each maze is ' +
      'generated fresh, and your lantern lights only the corridors near you — so you ' +
      'are mapping it as you go. Clear a maze and the next one is larger and darker.',
    controls: ['Arrow keys', 'WASD', 'Touch pad'],
    colors: ['#4b57b8', '#34d399'],
    tags: ['maze', 'exploration', 'levels', 'brain'],
    mount: mount
  });
})();

<script>
/* ---- assets/js/games/turbo-drift.js ---- */
/* Turbo Drift — top-down circuit racing against three rivals, three laps. */
(function () {
  'use strict';
  var W = 900, H = 600;
  var ROAD = 96, LAPS = 3;

  // Closed circuit, in world coordinates.
  var TRACK = [
    [220, 200], [430, 140], [660, 170], [880, 260], [1030, 430], [1000, 640],
    [820, 760], [600, 780], [420, 720], [330, 560], [200, 480], [130, 330]
  ];

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function reset(g) {
      var d = g.data;
      d.cars = [];
      for (var i = 0; i < 4; i++) {
        var p = startPos(i);
        d.cars.push({
          x: p.x, y: p.y, a: p.a, v: 0,
          ai: i > 0,
          wp: 1, lap: 0, prog: 0,
          col: ['#22d3ee', '#fb7185', '#ffd257', '#a78bfa'][i],
          name: ['You', 'Rossi', 'Vega', 'Kade'][i],
          skill: i === 0 ? 1 : U.rand(.88, .99),
          drift: 0
        });
      }
      d.me = d.cars[0];
      d.time = 0;
      d.finished = false;
      d.place = 1;
      d.smoke = [];
      d.countdown = 3;
      g.set('Lap', '0/' + LAPS);
      g.set('Place', '1st');
      g.set('Speed', '0');
    }

    function startPos(i) {
      var a = Math.atan2(TRACK[1][1] - TRACK[0][1], TRACK[1][0] - TRACK[0][0]);
      var nx = -Math.sin(a), ny = Math.cos(a);
      var lane = (i % 2 ? 1 : -1) * 26;
      var back = Math.floor(i / 2) * 46;
      return {
        x: TRACK[0][0] + nx * lane - Math.cos(a) * back,
        y: TRACK[0][1] + ny * lane - Math.sin(a) * back,
        a: a
      };
    }

    /** Distance from a point to the nearest point on the track centreline. */
    function trackDist(x, y) {
      var best = 1e9;
      for (var i = 0; i < TRACK.length; i++) {
        var a = TRACK[i], b = TRACK[(i + 1) % TRACK.length];
        var vx = b[0] - a[0], vy = b[1] - a[1];
        var t = U.clamp(((x - a[0]) * vx + (y - a[1]) * vy) / (vx * vx + vy * vy), 0, 1);
        var dx = a[0] + vx * t - x, dy = a[1] + vy * t - y;
        best = Math.min(best, Math.hypot(dx, dy));
      }
      return best;
    }

    function advanceWaypoints(g, car) {
      var d = g.data;
      var wp = TRACK[car.wp];
      if (U.dist(car.x, car.y, wp[0], wp[1]) < 92) {
        car.wp = (car.wp + 1) % TRACK.length;
        car.prog++;
        if (car.wp === 1) {
          car.lap++;
          if (!car.ai) {
            g.set('Lap', Math.min(car.lap, LAPS) + '/' + LAPS);
            if (car.lap <= LAPS) Milo.sound.powerup();
          }
          if (car.lap >= LAPS && !d.finished && !car.ai) finish(g);
          else if (car.lap >= LAPS && car.ai) car.done = true;
        }
      }
    }

    function finish(g) {
      var d = g.data;
      d.finished = true;
      var ahead = d.cars.filter(function (c) {
        return c.ai && (c.lap * TRACK.length + c.prog) > (d.me.lap * TRACK.length + d.me.prog);
      }).length;
      var place = ahead + 1;
      var bonus = [3000, 1800, 900, 400][place - 1] || 200;
      var score = Math.max(100, bonus + Math.round(Math.max(0, 180 - d.time) * 20));
      var suffix = ['st', 'nd', 'rd', 'th'][place - 1] || 'th';
      g.win({
        emo: place === 1 ? '🏆' : '🏁',
        title: place === 1 ? 'You won!' : 'Finished ' + place + suffix,
        text: LAPS + ' laps in ' + d.time.toFixed(1) + 's.',
        score: score
      });
    }

    return Milo.arcade(host, {
      id: 'turbo-drift',
      w: W, h: H, bg: '#0d1226',
      stats: ['Lap', 'Place', 'Speed'],
      touch: 'dpad',
      emo: '🏎️',
      start: {
        title: 'Turbo Drift',
        text: 'Three laps against three rivals. Stay on the tarmac — the grass ' +
          'will scrub your speed off in a hurry.',
        keys: ['↑ accelerate', '↓ brake', '← → steer']
      },
      init: reset,

      update: function (g, dt) {
        var d = g.data, i = g.input;

        if (d.countdown > 0) {
          d.countdown -= dt;
          if (d.countdown <= 0) Milo.sound.win();
          return;
        }

        d.time += dt;

        d.cars.forEach(function (car) {
          if (car.done) return;
          var throttle = 0, steer = 0;

          if (car.ai) {
            var wp = TRACK[car.wp];
            var want = Math.atan2(wp[1] - car.y, wp[0] - car.x);
            var diff = ((want - car.a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
            steer = U.clamp(diff * 2.4, -1, 1);
            throttle = 1 - Math.min(.55, Math.abs(diff) * .7);
          } else {
            throttle = (i.down('up') ? 1 : 0) - (i.down('down') ? 1 : 0);
            steer = (i.down('right') ? 1 : 0) - (i.down('left') ? 1 : 0);
            if (i.pdown) {
              // Pointer steering: left/right half of the screen.
              throttle = 1;
              steer = i.px < W / 2 ? -1 : 1;
            }
          }

          var onRoad = trackDist(car.x, car.y) < ROAD / 2;
          var maxV = (onRoad ? 330 : 145) * car.skill;
          var accel = throttle > 0 ? 260 : (throttle < 0 ? -320 : -70);
          car.v += accel * dt;
          car.v = U.clamp(car.v, -80, maxV);
          if (!onRoad) car.v = Math.min(car.v, maxV);

          // Steering authority scales with speed, so you can't spin on the spot.
          var grip = U.clamp(car.v / 140, 0, 1);
          car.a += steer * 2.5 * grip * dt * (car.v < 0 ? -1 : 1);
          car.drift = Math.abs(steer) * grip * (car.v / maxV);

          car.x += Math.cos(car.a) * car.v * dt;
          car.y += Math.sin(car.a) * car.v * dt;

          if (car.drift > .55 && Math.random() < .5) {
            d.smoke.push({ x: car.x, y: car.y, life: .5, max: .5 });
          }

          advanceWaypoints(g, car);
        });

        // Nudge cars apart so they don't stack on top of each other.
        for (var a = 0; a < d.cars.length; a++) {
          for (var b = a + 1; b < d.cars.length; b++) {
            var c1 = d.cars[a], c2 = d.cars[b];
            var dist = U.dist(c1.x, c1.y, c2.x, c2.y);
            if (dist < 34 && dist > 0.01) {
              var push = (34 - dist) / 2;
              var nx = (c2.x - c1.x) / dist, ny = (c2.y - c1.y) / dist;
              c1.x -= nx * push; c1.y -= ny * push;
              c2.x += nx * push; c2.y += ny * push;
              c1.v *= .93; c2.v *= .93;
              if (!c1.ai || !c2.ai) Milo.sound.hit();
            }
          }
        }

        d.smoke = d.smoke.filter(function (s) { s.life -= dt; return s.life > 0; });

        var ahead = d.cars.filter(function (c) {
          return c.ai && (c.lap * TRACK.length + c.prog) > (d.me.lap * TRACK.length + d.me.prog);
        }).length;
        d.place = ahead + 1;
        g.set('Place', d.place + (['st', 'nd', 'rd', 'th'][d.place - 1] || 'th'));
        g.set('Speed', Math.round(Math.abs(d.me.v) * 0.6));
      },

      draw: function (g) {
        var c = g.ctx, d = g.data, me = d.me;
        c.fillStyle = '#12331f'; c.fillRect(0, 0, W, H);

        var camX = U.clamp(me.x - W / 2, -120, 1160 - W + 120);
        var camY = U.clamp(me.y - H / 2, -120, 900 - H + 120);
        c.save();
        c.translate(-camX, -camY);

        // grass texture
        c.strokeStyle = 'rgba(255,255,255,.03)';
        c.lineWidth = 1;
        c.beginPath();
        for (var gx = -100; gx < 1200; gx += 40) { c.moveTo(gx, -100); c.lineTo(gx, 900); }
        for (var gy = -100; gy < 900; gy += 40) { c.moveTo(-100, gy); c.lineTo(1200, gy); }
        c.stroke();

        function path() {
          c.beginPath();
          c.moveTo(TRACK[0][0], TRACK[0][1]);
          for (var i = 1; i < TRACK.length; i++) c.lineTo(TRACK[i][0], TRACK[i][1]);
          c.closePath();
        }

        c.lineJoin = 'round'; c.lineCap = 'round';
        c.strokeStyle = '#e2e8f0'; c.lineWidth = ROAD + 10; path(); c.stroke();
        c.strokeStyle = '#26293f'; c.lineWidth = ROAD; path(); c.stroke();
        c.strokeStyle = 'rgba(255,255,255,.30)';
        c.lineWidth = 3; c.setLineDash([16, 22]); path(); c.stroke();
        c.setLineDash([]);

        // start/finish line
        var sa = Math.atan2(TRACK[1][1] - TRACK[0][1], TRACK[1][0] - TRACK[0][0]);
        c.save();
        c.translate(TRACK[0][0], TRACK[0][1]);
        c.rotate(sa);
        for (var r = 0; r < 6; r++) {
          for (var col = 0; col < 2; col++) {
            c.fillStyle = (r + col) % 2 ? '#fff' : '#1a1c2e';
            c.fillRect(col * 9 - 9, -ROAD / 2 + r * (ROAD / 6), 9, ROAD / 6);
          }
        }
        c.restore();

        d.smoke.forEach(function (s) {
          c.globalAlpha = s.life / s.max * .32;
          c.fillStyle = '#dfe6ff';
          c.beginPath(); c.arc(s.x, s.y, 9 * (1.6 - s.life / s.max), 0, 7); c.fill();
        });
        c.globalAlpha = 1;

        d.cars.forEach(function (car) {
          c.save();
          c.translate(car.x, car.y);
          c.rotate(car.a);
          c.fillStyle = 'rgba(0,0,0,.35)';
          U.roundRect(c, -15, -9, 32, 18, 4); c.fill();
          c.fillStyle = car.col;
          if (!car.ai) { c.shadowColor = car.col; c.shadowBlur = 14; }
          U.roundRect(c, -16, -10, 32, 20, 5); c.fill();
          c.shadowBlur = 0;
          c.fillStyle = 'rgba(10,14,32,.75)';
          U.roundRect(c, -4, -7, 11, 14, 3); c.fill();
          c.fillStyle = '#0b0e1a';
          c.fillRect(-13, -12, 7, 4); c.fillRect(-13, 8, 7, 4);
          c.fillRect(8, -12, 7, 4); c.fillRect(8, 8, 7, 4);
          c.restore();
        });
        c.restore();

        if (d.countdown > 0) {
          c.fillStyle = 'rgba(4,6,18,.55)';
          c.fillRect(0, 0, W, H);
          c.fillStyle = '#fff';
          c.font = '800 96px Outfit, sans-serif';
          c.textAlign = 'center';
          var n = Math.ceil(d.countdown);
          c.fillText(n > 0 ? n : 'GO!', W / 2, H / 2 + 30);
        }

        // mini leaderboard
        c.font = '700 12px Outfit, sans-serif';
        c.textAlign = 'left';
        var order = d.cars.slice().sort(function (a, b) {
          return (b.lap * TRACK.length + b.prog) - (a.lap * TRACK.length + a.prog);
        });
        order.forEach(function (car, i) {
          c.fillStyle = 'rgba(8,10,26,.6)';
          U.roundRect(c, 12, H - 96 + i * 21, 118, 18, 5); c.fill();
          c.fillStyle = car.col;
          c.fillRect(17, H - 92 + i * 21, 8, 10);
          c.fillStyle = car.ai ? '#c7cff0' : '#fff';
          c.fillText((i + 1) + '. ' + car.name + '  L' + Math.min(LAPS, car.lap + 1),
            31, H - 83 + i * 21);
        });
      }
    });
  }

  window.Milo.register({
    id: 'turbo-drift', title: 'Turbo Drift', emo: '🏎️', category: 'Racing',
    tagline: 'Three laps, three rivals, one line',
    description: 'A top-down circuit race. Your car steers better the faster it goes, ' +
      'but leave the tarmac and the grass will drag you down to a crawl. Three rivals ' +
      'race the same line — finishing first is worth far more than finishing fast.',
    controls: ['↑ accelerate', '↓ brake', '← → steer'],
    colors: ['#22d3ee', '#ef4444'],
    featured: true,
    tags: ['racing', 'cars', 'laps', 'ai opponents'],
    mount: mount
  });
})();

<script>
/* ---- assets/js/games/highway-rush.js ---- */
/* Highway Rush — weave through traffic at speed; near misses pay. */
(function () {
  'use strict';
  var W = 520, H = 720;
  var LANES = 5, LANE_W = 82;
  var ROAD_L = (W - LANES * LANE_W) / 2;

  function mount(host) {
    var Milo = window.Milo, U = Milo.util;

    function laneX(i) { return ROAD_L + i * LANE_W + LANE_W / 2; }

    function reset(g) {
      var d = g.data;
      d.lane = 2;
      d.x = laneX(2);
      d.y = H - 130;
      d.speed = 300;
      d.traffic = [];
      d.marks = [];
      d.parts = [];
      d.dist = 0;
      d.near = 0;
      d.next = 60;
      for (var i = 0; i < 12; i++) d.marks.push({ y: i * 70 });
      g.set('Score', 0);
      g.set('Near miss', 0);
      g.set('Speed', 0);
    }

    return Milo.arcade(host, {
      id: 'highway-rush',
      w: W, h: H, bg: '#101426',
      stats: ['Score', 'Near miss', 'Speed'],
      touch: 'dpad',
      emo: '🚗',
      start: {
        title: 'Highway Rush',
        text: 'Five lanes, no brakes worth using. Slip past traffic as close as you ' +
          'dare — near misses are worth 50 points each.',
        keys: ['← → change lane', 'Tap left/right']
      },
      init: reset,
      onPointer: function (g, type, x) {
        if (type !== 'down') return;
        moveLane(g, x < W / 2 ? -1 : 1);
      },

      update: function (g, dt) {
        var d = g.data;
        if (g.input.pressed('left')) moveLane(g, -1);
        if (g.input.pressed('right')) moveLane(g, 1);

        d.speed = Math.min(760, 300 + d.dist * 0.02);
        d.dist += d.speed * dt;
        g.score = Math.floor(d.dist / 8) + d.near * 50;
        g.set('Score', U.fmt(g.score));
        g.set('Speed', Math.round(d.speed * .32));

        d.x += (laneX(d.lane) - d.x) * Math.min(1, dt * 12);

        d.marks.forEach(function (m) {
          m.y += d.speed * dt;
          if (m.y > H + 40) m.y -= 12 * 70;
        });

        d.next -= d.speed * dt;
        if (d.next <= 0) {
          d.next = U.rand(210, 380) - Math.min(120, d.dist / 400);
          // Leave at least one lane open so the wall is always passable.
          var blocked = U.shuffle([0, 1, 2, 3, 4]).slice(0, U.randInt(1, 3));
          blocked.forEach(function (ln) {
            d.traffic.push({
              lane: ln, x: laneX(ln), y: -90,
              v: U.rand(90, 190),
              col: U.choice(['#fb7185', '#ffd257', '#a78bfa', '#34d399', '#60a5fa']),
              scored: false
            });
          });
        }

        var px = d.x, py = d.y;
        for (var i = d.traffic.length - 1; i >= 0; i--) {
          var t = d.traffic[i];
          t.y += (d.speed - t.v) * dt;
          if (t.y > H + 120) { d.traffic.splice(i, 1); continue; }

          var dx = Math.abs(t.x - px), dy = Math.abs(t.y - py);
          if (dx < 46 && dy < 74) {
            Milo.sound.explode();
            for (var b = 0; b < 26; b++) {
              var a = Math.random() * 6.28, s = U.rand(60, 300);
              d.parts.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: U.rand(.3, .8), max: .8, col: U.choice(['#fff', '#ffd257', '#fb7185']) });
            }
            g.gameOver({ text: U.fmt(Math.floor(d.dist / 8)) + ' m driven, ' + d.near + ' near misses.' });
            return;
          }
          if (!t.scored && t.y > py + 40) {
            t.scored = true;
            if (dx < 96) {
              d.near++;
              g.set('Near miss', d.near);
              Milo.sound.tone({ f: 800, f2: 1200, d: .09, v: .07, type: 'square' });
            }
          }
        }

        d.parts = d.parts.filter(function (p) {
          p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt;
          return p.life > 0;
        });
      },

      draw: function (g) {
        var c = g.ctx, d = g.data;
        c.fillStyle = '#0c1020'; c.fillRect(0, 0, W, H);
        c.fillStyle = '#1c2138';
        c.fillRect(ROAD_L, 0, LANES * LANE_W, H);
        c.fillStyle = '#2a3050';
        c.fillRect(ROAD_L - 10, 0, 10, H);
        c.fillRect(ROAD_L + LANES * LANE_W, 0, 10, H);

        c.fillStyle = 'rgba(255,255,255,.25)';
        d.marks.forEach(function (m) {
          for (var l = 1; l < LANES; l++) {
            c.fillRect(ROAD_L + l * LANE_W - 2, m.y, 4, 34);
          }
        });

        function car(x, y, col, isPlayer) {
          c.save();
          c.translate(x, y);
          c.fillStyle = 'rgba(0,0,0,.4)';
          U.roundRect(c, -22, -36, 44, 74, 9); c.fill();
          if (isPlayer) { c.shadowColor = col; c.shadowBlur = 18; }
          c.fillStyle = col;
          U.roundRect(c, -24, -38, 48, 76, 10); c.fill();
          c.shadowBlur = 0;
          c.fillStyle = 'rgba(10,14,32,.72)';
          U.roundRect(c, -17, -26, 34, 20, 5); c.fill();
          U.roundRect(c, -17, 8, 34, 18, 5); c.fill();
          c.fillStyle = isPlayer ? '#fff' : 'rgba(255,255,255,.55)';
          c.fillRect(-20, -40, 9, 5); c.fillRect(11, -40, 9, 5);
          c.restore();
        }

        d.traffic.forEach(function (t) { car(t.x, t.y, t.col, false); });
        car(d.x, d.y, '#22d3ee', true);

        d.parts.forEach(function (p) {
          c.globalAlpha = Math.max(0, p.life / p.max);
          c.fillStyle = p.col;
          c.fillRect(p.x - 3, p.y - 3, 6, 6);
        });
        c.globalAlpha = 1;
      }
    });

    function moveLane(g, dir) {
      var d = g.data;
      var next = U.clamp(d.lane + dir, 0, LANES - 1);
      if (next === d.lane) return;
      d.lane = next;
      Milo.sound.click();
    }
  }

  window.Milo.register({
    id: 'highway-rush', title: 'Highway Rush', emo: '🚗', category: 'Racing',
    tagline: 'Weave through endless traffic',
    description: 'Five lanes of traffic and a car that only gets faster. Change lanes ' +
      'to slip through the gaps — passing close to another car counts as a near miss and ' +
      'pays 50 points, so the greedy line is also the risky one.',
    controls: ['← →', 'Tap left/right'],
    colors: ['#22d3ee', '#f59e0b'],
    tags: ['driving', 'endless', 'reflex', 'traffic'],
    mount: mount
  });
})();
