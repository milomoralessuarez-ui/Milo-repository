name: Deploy MiloPlay to GitHub Pages

# Runs on a push to whichever branch the repository treats as its default,
# so it keeps working if the default is later renamed or changed.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is plain static files — there is no build step.
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
